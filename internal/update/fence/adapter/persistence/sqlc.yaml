version: "2"

sql:
  - engine: postgresql
    schema: ../../../../../db/migrations/*.sql
    queries: query.sql
    gen:
      go:
        package: persistence
        out: generated
        sql_package: database/sql
        emit_interface: true
        emit_exact_table_names: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        emit_sql_as_comment: true
        omit_unused_structs: true
