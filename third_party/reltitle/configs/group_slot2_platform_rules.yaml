updated_at: "2026-03-07"
description: "Group-specific slot2 platform inference rules."

rules:
  - id: "jibaketa_slot2_platform_v1"
    enabled: true
    priority: 100
    match:
      group_in:
        - "jibaketa"
        - "jibaketa 合成"
        - "jibaketa 合成&壓制"
        - "jibaketa 合成&压制"
        - "jibaketa 合成&音頻壓制"
        - "jibaketa 合成&音频压制"
        - "jibaketa 合成&二次壓制"
        - "jibaketa 合成&二次压制"
        - "jibaketa 自載"
      group_regex: "(?i)^jibaketa"
      slot_index: 2
    keywords:
      yue: ["粤语", "粵語", "cantonese"]
      distributor: ["代理商", "發行商", "发行商"]
      language_meta:
        - "雙語"
        - "双语"
        - "字幕"
        - "內封"
        - "内封"
        - "中字"
        - "中文"
        - "繁體"
        - "繁体"
        - "简體"
        - "简体"
        - "chs"
        - "cht"
        - "jpn"
        - "eng"
        - "+"
      trim_for_infer: ["粤语", "粵語", "cantonese"]
    platform_whitelist:
      - contains_any: ["tvb"]
        normalized: "TVB"
      - contains_any: ["viutv"]
        normalized: "VIUTV"
      - contains_any: ["hoy"]
        normalized: "HOY"
      - contains_any: ["rthk"]
        normalized: "RTHK"
    output:
      emit_audio_lang: "YUE"
      note_on_distributor: "CHANNEL_DISTRIBUTOR"
      infer_unknown_platform: true
      unknown_platform_confidence: 0.6

