description: "Template route families for high-level routing before template matching."
defaults:
  fallback_family: "tv_web_general"

families:
  - id: "raw_media"
    enabled: true
    priority: 100
    match:
      raw_must_contain_any:
        - "bdmv"
        - "dvdiso"
        - "dvd iso"
        - "bd-box"
        - "bd box"
        - "bdbox"
        - "dvd9"
      source_type_in:
        - "BD"
        - "DVD"
        - "BluRay"
      note_in:
        - "BDMV"
        - "DVDISO"
        - "DVD_ISO"
        - "DVD9"
        - "BD-BOX"
        - "BD_BOX"
    select:
      strict_template_filter: true
      allowed_route_ids:
        - "raw_media_v1"
      preferred_template_categories:
        - "batch"
        - "movie"

  - id: "tv_web_general"
    enabled: true
    priority: 10
    match:
      source_type_in:
        - "WEB-DL"
        - "WEBRip"
        - "BDRip"
        - "HDTV"
    select:
      strict_template_filter: false
      preferred_template_categories:
        - "tv_episode"
        - "batch"
