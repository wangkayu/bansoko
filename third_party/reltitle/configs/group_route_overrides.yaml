updated_at: "2026-03-06"
description: "Group-specific route overrides with safe fallback to general route."

defaults:
  fallback_route: "general"

overrides:
  - id: "onepace_range_release"
    enabled: true
    priority: 100
    match:
      group_in: ["One Pace", "ONEPACE", "OnePace"]
      raw_must_contain_any: ["[One Pace]"]
      require_episode_range: true
    output:
      force_group: "One Pace"
      force_title: "One Piece"
      clear_aliases: true
      force_template_id: "TF_BATCH_RANGE_ONEPACE_01"
      force_content_kind: "BATCH"
      force_route_id: "onepace_range_release"

  - id: "wgjd_overall_range_batch"
    enabled: true
    priority: 96
    match:
      group_in: ["晚街与灯", "晚街與燈"]
      raw_must_contain_any: ["总第", "總第"]
      require_episode_range: true
    output:
      force_template_id: "TF_BATCH_RANGE_WGJD_OVERALL_01"
      force_content_kind: "BATCH"
      force_route_id: "group_wgjd_overall_range_v1"

  - id: "baidong_bracket_underscore_alias"
    enabled: true
    priority: 96
    match:
      group_in: ["百冬练习组", "百冬練習組"]
      raw_must_contain_any: ["_"]
    output:
      force_route_id: "group_baidong_underscore_alias_v1"

  - id: "fate_strange_fake_ep_wgjd"
    enabled: true
    priority: 95
    match:
      group_in: ["晚街与灯", "晚街與燈"]
      require_episode_with_title: true
    output:
      force_route_id: "group_epseg_fate_sf_wgjd_v1"

  - id: "fate_strange_fake_ep_atlas"
    enabled: true
    priority: 95
    match:
      group_in: ["阿特拉斯字幕组", "阿特拉斯字幕组·雪原市出差所", "阿特拉斯字幕組", "阿特拉斯字幕組·雪原市出差所"]
      require_episode_with_title: true
      episode_title_sep_in: ["_"]
    output:
      force_route_id: "group_epseg_fate_sf_atlas_v1"

  - id: "sazae_epseg_maruko"
    enabled: true
    priority: 95
    match:
      group_in: ["丸子家族"]
      require_episode_like: true
    output:
      force_content_kind: "TV_EP"
      force_route_id: "group_epseg_maruko_v1"

  - id: "aptx4869_conan_bracket_ep_title"
    enabled: true
    priority: 95
    match:
      group_in: ["APTX4869"]
      raw_must_contain_any:
        - "[CONAN][名侦探柯南 "
        - "[CONAN][名偵探柯南 "
    output:
      force_route_id: "group_aptx4869_conan_bracket_ep_v1"

  - id: "ani_special_no_ep_streaming"
    enabled: true
    priority: 94
    match:
      group_in: ["ANi"]
      raw_must_contain_any:
        - " - 特別篇 ["
        - " - 特别篇 ["
        - "-特別篇["
        - "-特别篇["
    output:
      force_content_kind: "SPECIAL"
      force_template_id: "TF_TV_SP_ONLY_01"
      force_route_id: "group_ani_special_no_ep_v1"

  - id: "furretar_dub_prefix_cleanup"
    enabled: true
    priority: 92
    match:
      group_in: ["Furretar"]
      raw_must_contain_any: ["台配", "中台配", "台粤配", "台粵配", "中台粤配", "中台粵配"]
    output:
      force_route_id: "group_furretar_dub_prefix_v1"
      title_strip_prefixes:
        - "台配"
        - "中台配"
        - "台粤配"
        - "台粵配"
        - "中台粤配"
        - "中台粵配"
        - "中文配"
        - "中文配音"
      alias_strip_prefixes:
        - "台配"
        - "中台配"
        - "台粤配"
        - "台粵配"
        - "中台粤配"
        - "中台粵配"
        - "中文配"
        - "中文配音"

  - id: "jibaketa_slot2_prefix_cleanup"
    enabled: true
    priority: 91
    match:
      group_in:
        - "jibaketa"
        - "jibaketa 合成"
        - "jibaketa 合成&壓制"
        - "jibaketa 合成&压制"
        - "jibaketa 合成&音頻壓制"
        - "jibaketa 合成&音频压制"
        - "jibaketa 合成&二次壓制"
        - "jibaketa 合成&二次压制"
        - "jibaketa 自載"
      raw_must_contain_any:
        - "tvb粵語"
        - "tvb粤语"
        - "mytv粵語"
        - "mytv粤语"
        - "viutv粵語"
        - "viutv粤语"
        - "hoy粵語"
        - "hoy粤语"
        - "rthk粵語"
        - "rthk粤语"
        - "代理商粵語"
        - "代理商再版粵語"
        - "代理商粤语"
        - "代理商再版粤语"
        - "發行商粵語"
        - "發行商再版粵語"
        - "发行商粤语"
        - "发行商再版粤语"
    output:
      force_route_id: "group_jibaketa_slot2_prefix_v1"
      title_strip_prefixes:
        - "TVB粵語"
        - "TVB粤语"
        - "TVB"
        - "MyTV粵語"
        - "MyTV粤语"
        - "MyTV"
        - "MYTV"
        - "ViuTV粵語"
        - "ViuTV粤语"
        - "ViuTV"
        - "VIUTV"
        - "HOY粵語"
        - "HOY粤语"
        - "HOY"
        - "RTHK粵語"
        - "RTHK粤语"
        - "RTHK"
        - "代理商粵語"
        - "代理商再版粵語"
        - "代理商粤语"
        - "代理商再版粤语"
        - "發行商粵語"
        - "發行商再版粵語"
        - "发行商粤语"
        - "发行商再版粤语"

  - id: "underscore_delimiter_route_family_v1"
    enabled: true
    priority: 90
    match:
      group_in:
        - "FS"
        - "WZF"
        - "Kashikoi"
        - "SyncRajo"
        - "Kaerizaki -"
        - "Kaerizaki-Fansub"
        - "ALS"
        - "NTA"
        - "EA"
        - "LS -"
      raw_must_contain_any:
        - "_"
    output:
      force_route_id: "group_underscore_delim_v1"
      title_strip_prefixes:
        - "_"
      alias_strip_prefixes:
        - "_"
