  regex_patterns:
    # simple tech words / containers / codecs
    - '(?i)^(1080p|2160p|720p|480p)$'
    - '(?i)^(fhd|hi10p)$'
    - '(?i)^(hevc|avc|x264|x265|h264|h265|aac|ac3|flac|ddp|dts|atmos)$'
    - '(?i)^(mkv|mp4|avi)$'
    - '(?i)^(web-?dl|webrip|bdrip|bluray|hdtv|dvd|remux)$'
    - '(?i)^(?:bd|web|hdtv|dvd|tv|vcd|ld|uhd|fhd)[-_.]?(?:rip|remux|iso)$'
    - '(?i)^(?:bd|web|hdtv|dvd|tv|uhd|fhd)\d{3,4}p$'
    - '(?i)^dvd[-_ ]?isos?$'
    - '(?i)^(us|jp)bd$'
    - '(?i)^laser\s*disc(?:\s*box)?$'
    - '(?i)^(retail|bootleg|vhs)$'
    - '(?i)^\d{3,4}p$'
    - '(?i)^(?:multi[-_ ]?sub|multisub|dual[-_ ]?audio|multi[-_ ]?audio)$'
    # movie/batch content markers that should not stay as title_alias
    - '(?i)^movies?$'
    - '(?i)^movies?\s*\+\s*(?:specials?|sp|ova|oad|ona)$'
    - '(?i)^season\s*\d{1,2}(?:\s*[-~]\s*\d{1,2})?\s*\+\s*movie$'
    - '(?i)^\d{1,2}\s*\+\s*movie$'
    - '(?i)^\d{1,2}月番$'
    - '(?i)^box\s*\d{1,2}$'

