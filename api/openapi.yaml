    SubscriptionDelete:
      type: object
      additionalProperties: false
      description: >-
        CAS guard for irreversible retirement. The expected_version is the
        current Subscription version; a mismatch returns 409 so a stale client
        cannot retire an instance another editor just changed.
      required: [expected_version]
      properties:
        expected_version:
          $ref: '#/components/schemas/Version'
    LocalDataCleanup:
      type: object
      additionalProperties: false
      description: >-
        Explicit, separately authorized physical local cleanup of one RETIRED
        ManagedAnime's local records. The fixed confirmation string prevents an
        accidental destructive call; expected_lifecycle_epoch is the CAS guard
        against a stale retired generation.
      required: [expected_lifecycle_epoch, confirmation]
      properties:
        expected_lifecycle_epoch:
          type: integer
          format: int64
          minimum: 1
        confirmation:
          type: string
          enum: [delete-local-data]
    ReleaseReevaluationResult:
      type: object
      additionalProperties: false
      required: [managed_anime_id, accepted, scheduled_count]
      properties:
        managed_anime_id:
          $ref: '#/components/schemas/ID'
        accepted:
