        collected layer — the snapshot published with the release — is reference
        data and is never removable: asking for one of its entries is a 409
        GROUP_DICTIONARY_ENTRY_IMMUTABLE, and asking for an entry neither layer
        holds is a 404 GROUP_DICTIONARY_ENTRY_NOT_FOUND. Idempotent for the user
        layer in the sense that removing a row that is already gone reports that
        absence instead of failing silently.
