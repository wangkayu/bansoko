      x-scope: write
      x-mcp:
        tool: align_anime_files
        group: files
        write: true
        description: >-
          Move misaligned files of one anime (all of them, or the listed
          placement_ids) to the paths the latest scan rendered, together with
          their bound subtitles, once. Works whether or not automatic
          alignment is on. Pass the scan generation you read from
          list_anime_files; a newer scan answers scan_changed. The collision
          setting applies; files found missing or changed are not moved.
      description: >-
        One-off alignment admission, not gated by the anime's automatic
        alignment setting (`alignment_enabled`). It plans the latest
        calibrated generation with the alignment planner and admits the same
        alignment operations the automatic consumer would (same
        per-observation keys, unit collision policy, fenced execute claims,
        receipts and recovery), restricted to present files of the given
        placements (none = all). Replaying admits nothing new. A refused
        admission is 409 ANIME_FILES_ALIGN_UNAVAILABLE with the reason in
        details[0].code: `owner_retired`, `not_started`, `scan_running`,
        `scan_required` or `scan_changed`.
