        - name: placement_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Acceptance result of the redownload.
          content:
            application/json:
              schema:
