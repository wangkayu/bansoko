          description: |
            已入库进度（与 AnimeListItem.episode_progress 同构，按数量计：
            len(episodes) 与 total 比较，不按集号对位）。首集入库前为 null。workspace 的 total 仅取 metadata.total_episodes，
            不回退 provider 目录 source_hint。
          properties:
            episodes:
              type: array
              items:
                type: integer
                minimum: 0
              uniqueItems: true
            total:
              type: integer
              minimum: 1
            done:
              type: boolean
              description: |
                读时派生（按数量）：episodes 非空且 len(episodes) >= total 时为 true。
    AcquireSeedOnceInput:
      type: object
      additionalProperties: false
      required: [selected_seed]
      description: >-
        Finite one-shot admission body with two mutually exclusive config input
        sources. input_source=current_input carries the complete unsaved draft:
        no candidate row is required, the server resolves the draft against the
        current globals and the global parser-policy default inside the
        admission transaction and freezes the captured input as the execution
        identity. input_source=saved_revision carries candidate_id plus
        revision and admits against that exact immutable revision. A legacy
        body with candidate_id+revision and no input_source is accepted with
        the unchanged saved-revision parsing, selection semantics and replay
        identity. Carrying a draft together with candidate_id/revision, or a
        discriminator naming a different source than the supplied fields, is a
        400 INPUT_SOURCE_INVALID with zero writes. A one-shot names its seed
        directly: it is never bound by the configuration's group selection,
        and the seed's exact persisted snapshot is what proves it exists. A
        human discovery-provider draft (anibt or mikan) admits a seed of its
        own catalog entry from any of that entry's groups. A human custom
        draft admits only a custom seed: under input_source=saved_revision the
        server derives the custom-source and custom-group identities from the
        revision's own frozen locator and group under the exact candidate
        revision identity, and a seed carrying any other entry/group is a 422
        SEED_PREVIEW_STALE with zero writes; under input_source=current_input
        the draft is the one-shot's own unsaved configuration (never written
        back to the preset), so no saved scope applies and the seed's persisted
        custom snapshot is the binding. A human origin=oneshot draft is 422
        ONE_SHOT_CALLER_INVALID except for one keyword search seed: its refs
        are the derived search-scope/search-query pair, and it requires a
        current_input admission plus the exact fresh search snapshot. That
        narrow exception does not admit a feed or custom seed, a saved
        revision, or a seed without the search snapshot identity.
        The agent authorization boundary is unchanged: an agent request still
        needs a complete origin=oneshot draft and an explicit authorization
        snapshot, and a human request never gains agent reach.
      properties:
        input_source:
          type: string
          enum: [current_input, saved_revision]
          description: >-
            Config input source discriminator. Omitted means the legacy
            saved-revision body (candidate_id + revision).
        candidate_id:
          $ref: '#/components/schemas/ID'
        revision:
          type: integer
          format: int64
          minimum: 1
        draft:
          allOf:
            - $ref: '#/components/schemas/AnimeDraft'
          description: >-
            The complete unsaved draft captured by a current_input admission.
            Required for input_source=current_input and forbidden otherwise.
        selected_seed:
          $ref: '#/components/schemas/SelectedSeedInput'
        episode_offset:
          type: integer
          minimum: -1000
          maximum: 1000
          description: >-
            The one episode offset of this one-shot. It is written to the
            one-shot's placeholder RSS link and frozen into the input snapshot
            and the idempotency request identity; it is never read from an
            existing subscription, link or the submitted draft. Omitted means 0.
            Out of range is a 422 OFFSET_OUT_OF_RANGE with zero writes.
    SelectedSeedInput:
      type: object
      additionalProperties: false
      required: [provider, provider_entry_ref, provider_group_ref]
      description: >-
        The seed a one-shot admits, in one of two forms. Locator form (the
        frontend and HTTP path): locator, title and published_at are required,
        the snapshot identity (snapshot_id, snapshot_version,
        snapshot_content_hash, stable_seed_key) binds the seed to the persisted
        feed snapshot it was copied from, and at least one strong content
        identity (info_hash or expected_payload_digest) is mandatory. Reference
        form (agents; no download URL ever leaves the server): locator is
        omitted and snapshot_id, snapshot_version, snapshot_content_hash and
        stable_seed_key name one seed of one persisted snapshot of the
        provider/provider_entry_ref/provider_group_ref feed. The server reads
        that exact snapshot and resolves the seed into the locator form before
        anything is hashed or frozen, so the frozen input snapshot, the replay
        identity and every later stage are exactly those of the locator form
        for the same seed. A missing, superseded, stale or mismatching snapshot,
        or a stable_seed_key that is not in it, is a 422 SEED_PREVIEW_STALE
        with zero writes (refresh the snapshot and choose again). Seed facts
        (title, published_at, size_bytes, info_hash, expected_payload_digest)
        are optional in the reference form; each supplied fact must equal the
        snapshot's value or the request is a 422 SEED_PREVIEW_STALE. A
        reference without the complete snapshot identity is a 422 SEED_INVALID.
        Replaying the same Idempotency-Key with the same reference returns the
        original handle even after the snapshot was superseded. A custom seed
        (provider=custom) is the locator-form seed of one frozen custom/oneshot
        draft source's own feed snapshot: provider_entry_ref is that snapshot's
        frozen custom-source identity, provider_group_ref its frozen
        custom-group identity, and the seed identity inside it is
        stable_seed_key plus a strong content identity (info_hash or
        expected_payload_digest). The custom
        source identity is derived by the server from the draft's own frozen
        locator and group, so a seed whose entry/group does not belong to the
        submitted draft is a 422 SEED_PREVIEW_STALE with zero writes.
      properties:
        provider:
          $ref: '#/components/schemas/SnapshotSeedProvider'
        provider_entry_ref:
          type: string
          minLength: 1
          maxLength: 256
        provider_group_ref:
          type: string
          minLength: 1
          maxLength: 256
        stable_seed_key:
          type: string
          minLength: 1
          maxLength: 256
          description: Server-issued seed identity within the selected feed snapshot.
        snapshot_id:
          $ref: '#/components/schemas/ID'
          description: Server-issued feed snapshot identity (ProviderRSSPreviewResult.snapshot_id).
        snapshot_version:
          $ref: '#/components/schemas/Version'
          description: Server-issued feed snapshot version (ProviderRSSPreviewResult.snapshot_version).
        snapshot_content_hash:
          type: string
          minLength: 72
          maxLength: 72
          pattern: '^sha256:[0-9a-f]{64}$'
          description: Canonical typed seed-facts digest (ProviderRSSPreviewResult.content_hash).
        locator:
          type: string
          minLength: 1
          maxLength: 2048
          description: >-
            Locator form only: absolute HTTP(S) torrent URL aligned with
            ProviderRSSPreviewSeed.download_url. Omit it to send a snapshot
            reference.
        title:
          type: string
          minLength: 1
          maxLength: 512
          description: Required in the locator form; optional and verified in the reference form.
        published_at:
          type: string
          format: date-time
          description: Required in the locator form; optional and verified in the reference form.
        size_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Frozen snapshot fact when known; never content identity.
        info_hash:
          type: string
          minLength: 1
          maxLength: 128
          description: Canonical torrent info hash (v1 SHA-1 or v2 SHA-256 hex).
        expected_payload_digest:
          type: string
          minLength: 71
          maxLength: 71
          pattern: '^sha256:[0-9a-f]{64}$'
          description: >-
            Canonical SHA-256 digest of the exact .torrent payload bytes in the
            same `sha256:<64 hex>` wire form the provider preview emits. The
            server still verifies the fetched payload against it.
    SelectedSeed:
      type: object
      additionalProperties: false
      required:
        [provider, provider_entry_ref, provider_group_ref, locator, title, published_at]
      description: >-
        One selected seed as frozen into a one-shot input snapshot (always the
        resolved locator form; see SelectedSeedInput for the request). For a
        provider=custom seed the entry/group refs are the frozen custom-source
        and custom-group identities of a custom/oneshot draft source's own feed
        snapshot, never a discoverable provider entry.
        provider/provider_entry_ref/provider_group_ref are provenance and
        authorization facts;
        title/published_at/size_bytes are frozen snapshot facts; neither
        group alone is content identity. At least one strong content
        identity is mandatory: a canonical info_hash or a SHA-256
        expected_payload_digest. When both are supplied both must match the
        fetched torrent exactly.
      properties:
        provider:
          $ref: '#/components/schemas/SnapshotSeedProvider'
        provider_entry_ref:
          type: string
          minLength: 1
          maxLength: 256
        provider_group_ref:
          type: string
          minLength: 1
          maxLength: 256
        stable_seed_key:
          type: string
          minLength: 1
          maxLength: 256
          description: Server-issued seed identity within the selected feed snapshot.
        snapshot_id:
          $ref: '#/components/schemas/ID'
          description: Server-issued feed snapshot identity required for human admission.
        snapshot_version:
          $ref: '#/components/schemas/Version'
          description: Server-issued feed snapshot version required for human admission.
        snapshot_content_hash:
          type: string
          minLength: 72
          maxLength: 72
          pattern: '^sha256:[0-9a-f]{64}$'
          description: Canonical typed seed-facts digest required for human admission.
        locator:
          type: string
          minLength: 1
          maxLength: 2048
          x-mcp-omit: true
          x-secret: true
          description: >-
            Absolute HTTP(S) torrent URL aligned with
            ProviderRSSPreviewSeed.download_url. Withheld from MCP tool results
            (x-mcp-omit): it can embed a passkey.
        title:
          type: string
          minLength: 1
          maxLength: 512
        published_at:
          type: string
          format: date-time
        size_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Frozen snapshot fact when known; never content identity.
        info_hash:
          type: string
          minLength: 1
          maxLength: 128
          description: Canonical torrent info hash (v1 SHA-1 or v2 SHA-256 hex).
        expected_payload_digest:
          type: string
          minLength: 71
          maxLength: 71
          pattern: '^sha256:[0-9a-f]{64}$'
          x-mcp-omit: true
          description: >-
            Withheld from MCP tool results (x-mcp-omit), like the seed view's
            digest: a seed reference is resolved server-side and needs none.
            Canonical SHA-256 digest of the exact .torrent payload bytes in the
            same `sha256:<64 hex>` wire form the provider preview emits, so a
            preview row can be submitted as a selected seed verbatim. The
            server still verifies the fetched payload against it.
    OneShotAdmissionResult:
      type: object
      additionalProperties: false
      required:
        [one_shot_id, managed_anime_id, subscription_id, rss_source_id,
         release_id, state]
      properties:
        one_shot_id:
          $ref: '#/components/schemas/ID'
        managed_anime_id:
          $ref: '#/components/schemas/ID'
        subscription_id:
          $ref: '#/components/schemas/ID'
        rss_source_id:
          $ref: '#/components/schemas/ID'
        release_id:
          $ref: '#/components/schemas/ID'
        download_task_id:
          allOf:
            - $ref: '#/components/schemas/ID'
          nullable: true
          description: >-
            The admitted DownloadTask handle, or null when the selected seed's
            exact target set already existed and the finite command adopted it
            with no DownloadTask, qB work, Artifact or FileOperation. Never a
            fabricated placeholder id.
        state:
          $ref: '#/components/schemas/OneShotAcquisitionState'
    OneShotAcquisitionState:
      type: string
      description: >-
        Internal one-shot marker state. running admits gated effects;
        retention_pending is terminal and drained awaiting bounded batch
        reclamation; cleanup_blocked retains owners with an actionable
        bounded reason; reclaiming is the fenced drain phase that admits no
        new effects; cleaned has no owner graph and keeps anchors plus
        replay evidence until marker purge.
      enum: [running, retention_pending, cleanup_blocked, reclaiming, cleaned]
    OneShotTerminalOutcome:
      type: string
      enum: [succeeded, failed]
    OneShotInputSnapshot:
      type: object
      additionalProperties: false
      required:
        [selected_seed, effective_sections,
         section_versions, section_schemas, effective_digest, config_identity]
      description: >-
        Complete admission input retained by the one-shot marker for durable UI
        readback. A saved-revision admission freezes the exact saved candidate
        revision, selected seed, complete effective sections, provenance,
        parser evidence and target facts. A current_input admission freezes the
        captured unsaved draft (draft + draft_digest) with
        input_source=current_input and null candidate_id/revision; the
        resolved effective sections and the global parser-policy default read
        at admission time are the execution identity. Legacy marker rows may
        return null.
      properties:
        candidate_id:
          allOf:
            - $ref: '#/components/schemas/ID'
          nullable: true
        revision:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        input_source:
          type: string
          enum: [current_input]
          nullable: true
          description: >-
            Config input source of the captured admission; null for the legacy
            saved-revision spelling.
        draft:
          allOf:
            - $ref: '#/components/schemas/AnimeDraft'
          nullable: true
          description: The captured unsaved draft of a current_input admission.
        draft_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          nullable: true
          description: Canonical digest of the captured draft; the replay identity input.
        selected_seed:
          $ref: '#/components/schemas/SelectedSeed'
        episode_offset:
          type: integer
          minimum: -1000
          maximum: 1000
          description: >-
            The frozen one-shot episode offset from the admission request. Legacy
            marker rows omit it.
        effective_sections:
          type: object
          additionalProperties: true
        section_versions:
          type: object
          additionalProperties:
            type: integer
            format: int64
        section_schemas:
          type: object
          additionalProperties:
            type: string
        effective_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        config_identity:
          $ref: '#/components/schemas/ConfigRevisionIdentity'
        parser:
          allOf:
            - $ref: '#/components/schemas/ParserProvenance'
          nullable: true
        target_facts:
          allOf:
            - $ref: '#/components/schemas/TargetFactsSnapshot'
          nullable: true
    OneShotAcquisitionView:
      type: object
      additionalProperties: false
      required:
        [one_shot_id, state, managed_anime_id, subscription_id, rss_source_id,
         release_id, version, created_at, updated_at]
      properties:
        version:
          $ref: '#/components/schemas/Version'
          description: >-
            Current marker version. It advances on every marker transition
            (admission, drain, reclamation).
        current_attempt_id:
          allOf:
            - $ref: '#/components/schemas/ID'
          nullable: true
          description: >-
            Current execution attempt (EXEC-001 attempts model) whose terminal
            evidence the terminal_outcome projection mirrors; null only for
            legacy rows before their backfilled attempt resolves.
        failed_stage:
          type: string
          nullable: true
          enum: [download, artifact, planning, file_execution, placement]
          description: >-
            First failed stage of the anchored chain; null while no stage has
            failed. A failed post-processing plan surfaces as planning without
            rewriting the verified artifact fact.
        input_snapshot:
          allOf:
            - $ref: '#/components/schemas/OneShotInputSnapshot'
          nullable: true
          description: Complete admission input for UI readback; null for legacy rows.
        one_shot_id:
          $ref: '#/components/schemas/ID'
        state:
          $ref: '#/components/schemas/OneShotAcquisitionState'
        terminal_outcome:
          allOf:
            - $ref: '#/components/schemas/OneShotTerminalOutcome'
          nullable: true
        terminal_reason_code:
          type: string
          nullable: true
          maxLength: 128
        terminal_reason:
          type: string
          nullable: true
          maxLength: 1024
        managed_anime_id:
          $ref: '#/components/schemas/ID'
        subscription_id:
          $ref: '#/components/schemas/ID'
        rss_source_id:
          $ref: '#/components/schemas/ID'
        release_id:
          $ref: '#/components/schemas/ID'
        download_task_id:
          allOf:
            - $ref: '#/components/schemas/ID'
          nullable: true
          description: >-
            The anchored DownloadTask id, or null when the acquisition adopted
            an already-satisfied exact target set and created no download
            chain. Null therefore also means "no Artifact/FileOperation".
        download_task:
          allOf:
            - $ref: '#/components/schemas/DownloadTask'
          nullable: true
          description: Current DownloadTask view while the temporary owner exists.
        artifact:
          allOf:
            - $ref: '#/components/schemas/Artifact'
          nullable: true
          description: Current Artifact view once artifact work has started.
        file_operation:
          allOf:
            - $ref: '#/components/schemas/FileOperation'
          nullable: true
          description: Current FileOperation view once the file effect has started.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OneShotExecutionAttemptSummary:
      type: object
      additionalProperties: false
      required:
        [id, sequence, mode, state, input_digest, created_at]
      properties:
        id:
          $ref: '#/components/schemas/ID'
        sequence:
          type: integer
          format: int64
          minimum: 1
        previous_attempt_id:
          allOf:
            - $ref: '#/components/schemas/ID'
          nullable: true
        mode:
          type: string
          enum: [initial, retry, replan]
        resume_stage:
          type: string
          nullable: true
          enum: [download, artifact, planning, file_execution, placement]
        state:
          type: string
          enum: [running, succeeded, failed]
        input_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        created_at:
          type: string
          format: date-time
        terminal_at:
          type: string
          format: date-time
          nullable: true
        failed_stage:
          type: string
          nullable: true
          enum: [download, artifact, planning, file_execution, placement]
        reason_code:
          type: string
          nullable: true
          maxLength: 128
    OneShotExecutionAttemptPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/OneShotExecutionAttemptSummary'
        next_cursor:
          type: string
          nullable: true
          maxLength: 512
    OneShotExecutionAttempt:
      type: object
      additionalProperties: false
      required:
        [id, acquisition_id, sequence, mode, state, input_digest, created_at,
         updated_at]
      properties:
        id:
          $ref: '#/components/schemas/ID'
        acquisition_id:
          $ref: '#/components/schemas/ID'
        sequence:
          type: integer
          format: int64
          minimum: 1
        previous_attempt_id:
          allOf:
            - $ref: '#/components/schemas/ID'
          nullable: true
        mode:
          type: string
          enum: [initial, retry, replan]
        resume_stage:
          type: string
          nullable: true
          enum: [download, artifact, planning, file_execution, placement]
        state:
          type: string
          enum: [running, succeeded, failed]
        input_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        input_snapshot:
          allOf:
            - $ref: '#/components/schemas/OneShotInputSnapshot'
          nullable: true
          description: >-
            Redacted frozen input of this attempt; never raw payloads, secrets,
            lease tokens, or private paths.
        failed_stage:
          type: string
          nullable: true
          enum: [download, artifact, planning, file_execution, placement]
        outcome_code:
          type: string
          nullable: true
          maxLength: 128
        outcome_reason:
          type: string
          nullable: true
          maxLength: 1024
        terminal_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        field:
          type: string
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        start:
          type: integer
          minimum: 0
          description: Byte offset where a template source diagnostic starts in the template named by field.
        end:
          type: integer
          minimum: 0
          description: Byte offset where a template source diagnostic ends in the template named by field.
        paths:
          type: array
          description: >-
            Absolute paths this detail is about, when a refusal names specific
            files (the managed files inside a refused directory, for example).
          maxItems: 64
          items:
            type: string
            maxLength: 4096
    NamingVarsVersion:
      type: object
      additionalProperties: false
      required: [revision, digest, runtime, origin, note, source_bytes, created_at, activated_at, active]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
          description: Publication number; the compare-and-swap token of the active pointer.
        digest:
          type: string
          description: Canonical source fingerprint, the identity frozen evaluations record.
        runtime:
          type: string
          enum: [naming-vars-v1]
        origin:
          type: string
          enum: [file, editor, import]
        note:
          type: string
          maxLength: 200
        source_bytes:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        activated_at:
          type: string
          format: date-time
          nullable: true
        active:
          type: boolean
    NamingVarsProgram:
      type: object
      additionalProperties: false
      required: [version, source]
      properties:
        version:
          $ref: '#/components/schemas/NamingVarsVersion'
        source:
          type: string
          description: Canonical program text (LF line endings).
    NamingVarsInputFact:
      type: object
      additionalProperties: false
      required: [path, type, nullable, label_key, description_key]
      properties:
        path:
          type: string
          description: Fact path under input, for example anime.title.
        type:
          type: string
          enum: [string, integer, timestamp, boolean, list]
        nullable:
          type: boolean
        sample_value:
          type: string
        label_key:
          type: string
        description_key:
          type: string
    NamingVarsSample:
      type: object
      additionalProperties: false
      required: [ref, release_title, file_count]
      properties:
        ref:
          type: string
        release_title:
          type: string
        file_count:
          type: integer
          minimum: 0
    NamingVarsLimits:
      type: object
      additionalProperties: false
      required: [max_source_bytes, max_output_bytes, max_collection, timeout_ms, max_note_length, max_targets]
      properties:
        max_source_bytes:
          type: integer
        max_output_bytes:
          type: integer
        max_collection:
          type: integer
        timeout_ms:
          type: integer
        max_note_length:
          type: integer
        max_targets:
          type: integer
    NamingVarsState:
      type: object
      additionalProperties: false
      required: [active, versions, input_facts, samples, limits]
      properties:
        active:
          $ref: '#/components/schemas/NamingVarsProgram'
        versions:
          type: array
          description: Newest first, at most 200.
          items:
            $ref: '#/components/schemas/NamingVarsVersion'
        input_facts:
          type: array
          items:
            $ref: '#/components/schemas/NamingVarsInputFact'
        samples:
          type: array
          items:
            $ref: '#/components/schemas/NamingVarsSample'
        limits:
          $ref: '#/components/schemas/NamingVarsLimits'
    NamingVarsSaveInput:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source:
          type: string
        note:
          type: string
          maxLength: 200
    NamingVarsActivateInput:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
    NamingVarsDryRunFile:
      type: object
      additionalProperties: false
      required: [path, size]
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 1024
        size:
          type: integer
          format: int64
          minimum: 0
    NamingVarsDryRunTarget:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [sample, release, custom]
        sample:
          type: string
          description: Sample ref, for kind sample.
        release_id:
          type: string
          description: Persisted release id, for kind release.
        title:
          type: string
          maxLength: 1024
          description: Release title, for kind custom.
        files:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/NamingVarsDryRunFile'
    NamingVarsDryRunInput:
      type: object
      additionalProperties: false
      required: [source, targets]
      properties:
        source:
          type: string
        targets:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/NamingVarsDryRunTarget'
    NamingVarsDiagnostic:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [source_empty, source_too_large, syntax_error, unbounded_expansion, dynamic_execution, too_many_assignments, evaluation_failed, output_missing, output_not_scalar, output_invalid, interrupted]
        message:
          type: string
        start:
          type: integer
          minimum: 0
          description: Byte offset where the finding starts in the LF-normalized source; absent when it has no place.
        end:
          type: integer
          minimum: 0
    NamingVarsDryRunTargetResult:
      type: object
      additionalProperties: false
      required: [kind, ref, title, file_count, status, output, diagnostics]
      properties:
        kind:
          type: string
          enum: [sample, release, custom]
        ref:
          type: string
        title:
          type: string
        file_count:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [ok, error, interrupted, unavailable]
        output:
          type: object
          description: The vars produced, by group and key; empty unless status is ok.
          additionalProperties:
            type: object
            additionalProperties:
              type: string
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/NamingVarsDiagnostic'
        reason:
          type: string
          enum: [release_not_found, inventory_missing, parser_unavailable, evidence_unreadable]
          description: Why a release could not be evaluated, when status is unavailable.
    NamingVarsDryRunResult:
      type: object
      additionalProperties: false
      required: [diagnostics, targets]
      properties:
        digest:
          type: string
          description: Fingerprint of the draft; absent when the draft failed static validation.
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/NamingVarsDiagnostic'
        targets:
          type: array
          items:
            $ref: '#/components/schemas/NamingVarsDryRunTargetResult'
    NamingVarsReleaseOption:
      type: object
      additionalProperties: false
      required: [id, title, anime_title]
      properties:
        id:
          type: string
        title:
          type: string
        anime_title:
          type: string
    NamingVarsDocument:
      type: object
      additionalProperties: false
      required: [format, format_version, runtime, digest, revision, note, exported_at, source]
      properties:
        format:
          type: string
          enum: [bansoko-naming-vars]
        format_version:
          type: integer
          minimum: 1
        runtime:
          type: string
          description: Input contract the program was written for.
        digest:
          type: string
        revision:
          type: integer
          format: int64
          minimum: 0
        note:
          type: string
          maxLength: 200
        exported_at:
          type: string
          format: date-time
        source:
          type: string
    FileManagerMountKind:
      type: string
      description: >-
        What a quick entry points at: the filesystem root, one download
        connection's application-side root, or one work's tree top.
      enum: [root, download, anime]
    FileManagerMountUnavailable:
      type: string
      description: Why a mount cannot be browsed.
      enum: [not_configured, missing, not_directory]
    FileManagerMount:
      type: object
      additionalProperties: false
      required: [key, kind, path, available]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 160
        kind:
          $ref: '#/components/schemas/FileManagerMountKind'
        connection_id:
          description: Download connection of a download mount.
          allOf:
            - $ref: '#/components/schemas/ID'
        label:
          type: string
          description: Connection name of a download mount, or the work's title for a work mount.
          maxLength: 256
        path:
          type: string
          description: Absolute path the mount points at.
          maxLength: 4096
        managed_anime_id:
          description: The work a work mount belongs to.
          allOf:
            - $ref: '#/components/schemas/ID'
        available:
          type: boolean
        unavailable_reason:
          $ref: '#/components/schemas/FileManagerMountUnavailable'
    FileManagerMountList:
      type: object
      additionalProperties: false
      required: [mounts]
      properties:
        mounts:
          type: array
          maxItems: 512
          items:
            $ref: '#/components/schemas/FileManagerMount'
    FileManagerEntryKind:
      type: string
      description: Lstat type; a symlink is described, never followed.
      enum: [directory, file, symlink, other]
    FileManagerEntryState:
      type: string
      description: >-
        Derived ownership state (first match wins): in_progress when an
        unfinished owner holds the path; managed for an active placement of a
        subscribed (active or stopped) anime; detached otherwise, including
        released files (an unknown file is released at import) and files a
        one-shot acquisition placed. A directory takes the strongest state below it. A
        bound sidecar has no record of its own and follows its video.
      enum: [in_progress, managed, detached]
    FileManagerEntryRole:
      type: string
      description: What owner records say a file is.
      enum: [video, subtitle, sidecar]
    FileManagerEntry:
      type: object
      additionalProperties: false
      required: [name, path, kind, state, locked]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 1024
        path:
          type: string
          description: Absolute path of the entry.
          minLength: 1
          maxLength: 4096
        kind:
          $ref: '#/components/schemas/FileManagerEntryKind'
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        modified_at:
          type: string
          format: date-time
        state:
          $ref: '#/components/schemas/FileManagerEntryState'
        role:
          $ref: '#/components/schemas/FileManagerEntryRole'
        companion_of:
          type: string
          description: Absolute path of the video a bound sidecar follows.
          maxLength: 4096
        not_aligned:
          type: boolean
          description: A bound sidecar whose path no longer matches its video.
        locked:
          type: boolean
          description: >-
            The product manages this entry: a managed or in-progress file, or a
            directory whose subtree holds one. Its move, rename and delete are
            409 FILE_MANAGER_ENTRY_LOCKED until a user unlocks it; the file
            itself (and a copy of it) may still be read.
        managed_anime_id:
          description: The work that manages a locked file, when owner facts name one.
          allOf:
            - $ref: '#/components/schemas/ID'
    FileManagerListing:
      type: object
      additionalProperties: false
      required: [path, entries, truncated]
      properties:
        path:
          type: string
          description: Absolute path of the listed directory.
          maxLength: 4096
        entries:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/FileManagerEntry'
        next_cursor:
          type: string
          minLength: 1
          maxLength: 512
        truncated:
          type: boolean
    FileManagerAnimeRef:
      type: object
      additionalProperties: false
      required: [managed_anime_id, title, ended]
      properties:
        managed_anime_id:
          $ref: '#/components/schemas/ID'
        title:
          type: string
          maxLength: 512
        subscription_state:
          $ref: '#/components/schemas/SubscriptionState'
        ended:
          type: boolean
          description: The subscription was ended (unsubscribed).
    FileManagerInProgressKind:
      type: string
      enum: [file_operation, placement_handoff, alignment, cleanup, replacement, offset_migration, user_operation]
    FileManagerInProgressOwner:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          $ref: '#/components/schemas/FileManagerInProgressKind'
        acquisition_id:
          $ref: '#/components/schemas/ID'
    FileManagerDetachedReason:
      type: string
      description: >-
        Why a file is detached. `released` is a placement whose management a
        user ended (design §5); its bound sidecars follow it. `displaced` is
        a placement another file replaced at its path; `redownloaded` one
        whose episode a user downloaded again, the new file elsewhere.
      enum: [no_record, subscription_ended, anime_removed, one_shot, replaced, companion_ended, released, displaced, redownloaded]
    FileManagerLinkedFile:
      type: object
      additionalProperties: false
      required: [role, present]
      properties:
        role:
          $ref: '#/components/schemas/FileManagerEntryRole'
        path:
          type: string
          description: Absolute path of the related file.
          maxLength: 4096
        present:
          type: boolean
        not_aligned:
          type: boolean
    FileManagerOperation:
      type: string
      enum: [scan, align, copy, move, rename, delete, release, match]
    FileManagerOperationBlock:
      type: string
      description: >-
        Why an operation is refused: the file is locked because the product
        manages it (unlock it first) or an unfinished owner holds it; a sidecar
        follows its video; alignment is disabled by the effective file
        maintenance policy.
      enum: [in_progress, managed, follows_video, alignment_disabled]
    FileManagerOperationRule:
      type: object
      additionalProperties: false
      required: [operation, allowed]
      properties:
        operation:
          $ref: '#/components/schemas/FileManagerOperation'
        allowed:
          type: boolean
        blocked_reason:
          $ref: '#/components/schemas/FileManagerOperationBlock'
    FileManagerEpisodeEvidence:
      type: object
      additionalProperties: false
      description: >-
        The episode identity frozen for this file when its acquisition recorded
        it. It is read as frozen and never re-derived from the filename at read
        time; it explains why a file the parser could not classify is
        unrecognized.
      required: [state]
      properties:
        state:
          type: string
          description: >-
            The frozen identity state. `resolved` means the acquisition
            established the file's episode; the other states carry the reason
            it did not.
          enum: [resolved, unresolved, invalid, unsupported, conflict]
        failure_code:
          type: string
          description: >-
            The stable failure code frozen with the identity. Absent when the
            identity resolved.
          minLength: 1
          maxLength: 128
        raw_value:
          type: string
          description: >-
            The raw episode text the frozen identity selected or refused, as
            the acquisition captured it. Absent when no raw value was read.
          minLength: 1
          maxLength: 128
        shape:
          type: string
          description: >-
            The shape of the captured episode evidence, frozen with the
            identity.
          enum: [single, range, list, season_only, special, unknown]
    FileManagerEntryDetail:
      type: object
      additionalProperties: false
      required: [entry, in_progress, companions, operations, revision]
      properties:
        entry:
          $ref: '#/components/schemas/FileManagerEntry'
        anime:
          $ref: '#/components/schemas/FileManagerAnimeRef'
        acquisition_id:
          $ref: '#/components/schemas/ID'
        detached_reason:
          $ref: '#/components/schemas/FileManagerDetachedReason'
        in_progress:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/FileManagerInProgressOwner'
        video:
          $ref: '#/components/schemas/FileManagerLinkedFile'
        companions:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/FileManagerLinkedFile'
        operations:
          type: array
          description: >-
            Operations the state allows or refuses (design §4); files only.
            The server re-derives the state on every write.
          maxItems: 16
          items:
            $ref: '#/components/schemas/FileManagerOperationRule'
        revision:
          type: string
          description: >-
            Opaque token of the entry's derived state and file metadata. Every
            write names it as expected_revision; a changed entry is a typed 409
            FILE_MANAGER_ENTRY_CHANGED and nothing is written.
          minLength: 1
          maxLength: 128
        last_operation:
          $ref: '#/components/schemas/FileManagerOperationView'
        match_default_anime:
          description: >-
            The anime a match of this file starts from: the anime of the
            placement it came from, when that anime still takes new files.
          allOf:
            - $ref: '#/components/schemas/FileManagerAnimeRef'
        episode:
          description: >-
            The episode identity frozen for this file at acquisition, when one
            was recorded. It is read as frozen; a read never re-parses the
            filename.
          allOf:
            - $ref: '#/components/schemas/FileManagerEpisodeEvidence'
    FileManagerConflictChoice:
      type: string
      description: >-
        What happens when the target is occupied. `block` cancels the
        operation and changes nothing; `version` gives the new file a version
        suffix and keeps the existing one. A user operation never overwrites.
      enum: [block, version]
    FileManagerTarget:
      type: object
      additionalProperties: false
      required: [path, conflict]
      properties:
        path:
          type: string
          description: Absolute target file path.
          minLength: 1
          maxLength: 4096
        conflict:
          $ref: '#/components/schemas/FileManagerConflictChoice'
    FileManagerUserOperation:
      type: string
      enum: [move, rename, copy, delete, match]
    FileManagerOperationRequestKind:
      type: string
      description: Operations submitted here; a match has its own endpoint.
      enum: [move, rename, copy, delete]
    FileManagerOperationRequest:
      type: object
      additionalProperties: false
      required: [operation, path, expected_revision]
      properties:
        operation:
          $ref: '#/components/schemas/FileManagerOperationRequestKind'
        path:
          type: string
          description: Absolute source file path.
          minLength: 1
          maxLength: 4096
        expected_revision:
          type: string
          minLength: 1
          maxLength: 128
        target:
          description: Required for move, rename and copy; absent for delete.
          allOf:
            - $ref: '#/components/schemas/FileManagerTarget'
    FileManagerOperationState:
      type: string
      enum: [ready, running, completed, blocked, failed]
    FileManagerOperationFailure:
      type: string
      description: >-
        Typed outcome of a blocked or failed operation: the target was
        occupied, the source changed or disappeared, an owner took the file
        over, the file effect failed, or the anime a match targets no longer
        takes files.
      enum: [target_occupied, source_changed, source_missing, source_managed, execute_failed, anime_unavailable]
    FileManagerOperationView:
      type: object
      additionalProperties: false
      required: [id, operation, state, path, created_at]
      properties:
        id:
          $ref: '#/components/schemas/ID'
        operation:
          $ref: '#/components/schemas/FileManagerUserOperation'
        state:
          $ref: '#/components/schemas/FileManagerOperationState'
        path:
          type: string
          description: Absolute source path.
          maxLength: 4096
        target_path:
          type: string
          description: Absolute requested target.
          maxLength: 4096
        result_path:
          type: string
          description: >-
            Absolute path where the file landed (with a version suffix when one
            was added).
          maxLength: 4096
        failure:
          $ref: '#/components/schemas/FileManagerOperationFailure'
        match:
          description: The chosen anime, season and episode of a match.
          allOf:
            - $ref: '#/components/schemas/FileManagerMatchChoice'
        created_directories:
          type: array
          description: >-
            Absolute directories a settled match created for its target,
            parents first.
          maxItems: 64
          items:
            type: string
            maxLength: 4096
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
    FileManagerMatchChoice:
      type: object
      additionalProperties: false
      required: [managed_anime_id, season, episode]
      properties:
        managed_anime_id:
          $ref: '#/components/schemas/ID'
        season:
          type: integer
          minimum: 0
          maximum: 9999
        episode:
          type: integer
          minimum: 1
          maximum: 99999
    FileManagerMatchMediaKind:
      type: string
      description: Only `tv` exists; the value is reserved for movie naming.
      enum: [tv]
    FileManagerMatchPreviewRequest:
      type: object
      additionalProperties: false
      required: [path, season, episode]
      properties:
        path:
          type: string
          description: Absolute path of the detached video.
          minLength: 1
          maxLength: 4096
        managed_anime_id:
          description: >-
            The anime to match into; omitted takes the anime the file came
            from (409 FILE_MANAGER_MATCH_ANIME_REQUIRED when there is none).
          allOf:
            - $ref: '#/components/schemas/ID'
        media_kind:
          $ref: '#/components/schemas/FileManagerMatchMediaKind'
        season:
          type: integer
          description: Final season number; 0 is specials.
          minimum: 0
          maximum: 9999
        episode:
          type: integer
          description: Final episode number; no offset applies.
          minimum: 1
          maximum: 99999
    FileManagerMatchBlockerCode:
      type: string
      description: >-
        Why a preview cannot be submitted: the template reads facts the evidence
        lacks (`facts_missing`, with their paths) or does not render
        (`template_invalid`), the rendered path is not a usable target, or the
        file is already at it.
      enum: [facts_missing, template_invalid, target_invalid, target_is_source]
    FileManagerMatchBlocker:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          $ref: '#/components/schemas/FileManagerMatchBlockerCode'
        facts:
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 128
    FileManagerMatchConflict:
      type: object
      additionalProperties: false
      required: [occupied_by]
      properties:
        occupied_by:
          type: string
          enum: [file, managed, in_progress]
        version_path:
          type: string
          description: >-
            Absolute path where the file would land under the `version` choice
            (advisory; the worker takes the first free suffix when it runs).
          maxLength: 4096
    FileManagerMatchPreview:
      type: object
      additionalProperties: false
      required: [revision, anime, media_kind, season, episode, directories_to_create, blockers, subtitles_left_behind, from_lineage]
      properties:
        revision:
          type: string
          description: Revision of the entry to submit with.
          minLength: 1
          maxLength: 128
        anime:
          $ref: '#/components/schemas/FileManagerAnimeRef'
        media_kind:
          $ref: '#/components/schemas/FileManagerMatchMediaKind'
        season:
          type: integer
        episode:
          type: integer
        target_path:
          type: string
          description: Rendered absolute target; absent when a blocker stops the render.
          maxLength: 4096
        directories_to_create:
          type: array
          description: Absolute directories the match would create, parents first.
          maxItems: 64
          items:
            type: string
            maxLength: 4096
        conflict:
          $ref: '#/components/schemas/FileManagerMatchConflict'
        blockers:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/FileManagerMatchBlocker'
        subtitles_left_behind:
          type: array
          description: Subtitle files beside the video that follow its name; they do not move with it.
          maxItems: 20
          items:
            type: string
            maxLength: 4096
        from_lineage:
          type: boolean
          description: Release-level facts came from the file's own acquisition.
    FileManagerMatchRequest:
      type: object
