    CatalogSnapshot:
      type: object
      additionalProperties: false
      required: [id, season, status, provider, observed_at, source_version, contract_version, health_state, health_checked_at, version, stale]
      properties:
        id:
          type: string
        season:
          type: string
        status:
          type: string
          enum: [fresh, stale, withdrawn, outage, zero_result]
        provider:
          type: string
          enum: [anibt, mikan]
        observed_at:
          type: string
          format: date-time
        source_version:
          type: string
        cursor:
          type: string
          nullable: true
        etag:
          type: string
          nullable: true
        last_modified:
          type: string
          nullable: true
        contract_version:
          type: string
        health_state:
          type: string
          enum: [unknown, ready, degraded, failed]
        health_code:
          type: string
          nullable: true
        health_message:
          type: string
          nullable: true
        health_checked_at:
          type: string
          format: date-time
        error_code:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        version:
          type: integer
          format: int64
          minimum: 1
        refresh_id:
          type: string
          nullable: true
        trace_id:
          type: string
          nullable: true
        last_success_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Observation time of the latest successful refresh (fresh,
            withdrawn or zero_result) of this provider season, including a 304
            revalidation. Null when no refresh has succeeded yet.
        stale:
          type: boolean
          description: >-
            True when last_success_at is null or older than 24 hours. Time
            based only; independent of status and health_state.
    CatalogItem:
      type: object
      additionalProperties: false
      required: [kind, provider, title, provider_entry_ref, broadcast_day, catalog_state, preference, allowed_actions, instances]
      description: >-
        One external provider catalog entry. It may be associated with zero or
        more existing formal ManagedAnime owners; provider_entry_ref is only the
        external browse key. Formal owner identity is managed_anime.id, exposed
        in each instances element as managed_anime_ref.
      properties:
        kind:
          type: string
          enum: [anibt_entry, mikan_entry]
        origin:
          type: string
        provider:
          type: string
          enum: [anibt, mikan]
        title:
          type: string
        original_title:
          type: string
          nullable: true
        provider_entry_ref:
          type: string
          description: External catalog-entry key; non-unique across formal owners and never an owner identity.
        bgm_id:
          type: string
          nullable: true
        poster_url:
          type: string
          nullable: true
          description: Server-local poster proxy path (/api/v1/images/poster/...), present only when the item has a Bangumi binding.
        cover_url:
          type: string
          nullable: true
          description: Server-local cover proxy path (/api/v1/images/cover/...) for the provider's own catalog cover, present whenever the provider states one. Cards render it first and fall back to poster_url, then a placeholder. Never a third-party URL; the frontend loads it with the session.
        broadcast_day:
          $ref: '#/components/schemas/BroadcastDay'
        release_format:
          allOf:
            - $ref: '#/components/schemas/ReleaseFormat'
          description: >-
            Release format the provider catalog states for this entry. Absent
            when the provider states none; never inferred from titles.
        release_state:
          type: string
          enum: [has_releases, no_releases]
          description: >-
            Whether the provider itself lists any release for this entry, read
            from the stored catalog snapshot (AniBT hasRelease; Mikan's
            greyed-out "no works" entries). Absent means unknown (the provider
            did not state it, a search hit, or a snapshot taken before this
            fact was recorded); it is never inferred from titles.
        release_count:
          type: integer
          minimum: 0
          description: AniBT's RSS release count for the entry, present only when AniBT states it.
        update_text:
          type: string
          minLength: 1
          maxLength: 64
          description: Mikan's raw update display string (the site's date text without the trailing 更新), present only when Mikan shows one. Display-only; not a parsed date.
        catalog_state:
          type: string
        observed_at:
          type: string
          format: date-time
          nullable: true
        managed_anime_ref:
          type: string
          nullable: true
          description: >-
            Compatibility summary of the sole associated owner when instances
            has exactly one element. This is the formal owner identity and is
            null when there are zero or multiple associations.
        subscription_ref:
          type: string
          nullable: true
          description: >-
            Compatibility summary of the Subscription belonging to the sole
            associated owner; it is not a replacement for managed_anime_ref.
        subscription_state:
          allOf:
            - $ref: '#/components/schemas/SubscriptionState'
          nullable: true
        preference:
          type: string
          enum: [neutral, watchlisted, ignored]
        allowed_actions:
          type: array
          items:
            type: string
        instances:
          type: array
          description: >-
            Lossless association projection from this one external catalog entry
            to zero or more existing formal owners, active first then creation
            order. An element does not create or identify an owner by its
            provider ref or locator: managed_anime_ref is the referenced
            managed_anime.id and the sole formal owner identity. The singular
            managed_anime_ref/subscription_ref/subscription_state fields are a
            compatibility summary populated ONLY when exactly one association
            exists; with several associations this array is authoritative and
            the singular fields stay null. Consumers must act on a specific
            owner by managed_anime_ref, never on an arbitrary first row, and
            each element carries that owner's subscription_version for CAS.
          items:
            $ref: '#/components/schemas/CatalogItemInstance'
    CatalogItemInstance:
      type: object
      additionalProperties: false
      description: >-
        One association between an external catalog entry and an existing formal
        owner. It is not an owner-creation identity; managed_anime_ref is the
        sole owner identity used for actions.
      required: [managed_anime_ref, subscription_ref, subscription_state, lifecycle_state, lifecycle_epoch, subscription_version]
      properties:
        managed_anime_ref:
          $ref: '#/components/schemas/ID'
          description: Referenced managed_anime.id, the sole formal owner identity.
        subscription_ref:
          $ref: '#/components/schemas/ID'
          description: Subscription row belonging to this formal owner.
        subscription_state:
          $ref: '#/components/schemas/SubscriptionState'
        lifecycle_state:
          type: string
          enum: [active, retired]
          description: >-
            The referenced owner's managed lifecycle boundary. It is not a
            Subscription.state value: a retired association stays listable for
            historical inspection but admits no start/stop/config/unsubscribe
            mutation. Only the provider browse action (assembling a brand-new
            candidate and owner) remains available.
        lifecycle_epoch:
          type: integer
          format: int64
          minimum: 1
          description: >-
            The owner's current lifecycle fence epoch, the version identity a
            consumer must compare before acting on the association.
        subscription_version:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Current Subscription CAS version for the exact owner association,
            required for state changes and deletion. It belongs to that
            Subscription/owner row, never to the external provider entry, so a
            consumer acting on one of several owners always sends that owner's
            own version.
    CatalogWorkspace:
