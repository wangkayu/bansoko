      x-scope: write
      x-mcp:
        tool: activate_candidate
        group: subscription
        write: true
        idempotency: required
        description: >-
          Activate a saved candidate: atomically creates the anime, Subscription,
          sources, metadata, and sparse overrides, and links the candidate's activation.
          The idempotency_key is REQUIRED (caller-supplied) so replaying the same key
          returns the first result. Call get_candidate first to obtain expected_version
          (the candidate version) and the exact revision. The subscription is created
          pending (not started): nothing runs until patch_subscription sets state active.
          Pass start: true to start it at once when the saved configuration is complete.
          Optional initial_state 'stopped' creates a one-off instance that runs no
          automatic work but accepts manual commands.
      description: >-
        Activate exactly the saved revision named by the request. The server
        locks the candidate and revision, requires the requested revision to be
        the candidate's current pointer, and materializes it into the new
        instance-owned configuration: every rules section and subgroups are
        stored as the draft's complete values (tag_filters too; a draft without
        one stores the built-in default). Nothing follows Global afterwards. The owner set and
        the candidate's activated_managed_anime_id link are committed in one
        transaction, and the candidate changes atomically from working to
        dormant. The caller MUST pass revision, If-Match with the candidate
        version it read, and Idempotency-Key; the activation identity includes
        all three plus the effective digest, so stale or wrong revisions fail
        closed with no owner effect and exact replay remains stable. A candidate
        whose draft has the oneshot origin is refused with 422
        ORIGIN_NOT_SUBSCRIBABLE.
      parameters:
        - $ref: '#/components/parameters/CandidateID'
        - $ref: '#/components/parameters/IfMatchVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateSubscribeInput'
      responses:
        '201':
          description: The complete owner set created in one local transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscribeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
