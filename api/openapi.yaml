      type: object
      additionalProperties: false
      required: [adapter_kind, bot_token]
      properties:
        adapter_kind:
          type: string
          enum: [telegram]
        bot_token:
          type: string
          format: password
          minLength: 1
          maxLength: 4096
          writeOnly: true
    FeishuSecretValue:
      type: object
      additionalProperties: false
      required: [adapter_kind, webhook_url]
      properties:
        adapter_kind:
          type: string
          enum: [feishu]
        webhook_url:
          type: string
          format: uri
          pattern: '^https://'
          minLength: 1
          maxLength: 2048
          writeOnly: true
        signing_secret:
          type: string
          format: password
          minLength: 1
          maxLength: 4096
          writeOnly: true
    WebhookSecretValue:
      type: object
      additionalProperties: false
      required: [adapter_kind, endpoint_url]
      properties:
        adapter_kind:
          type: string
          enum: [webhook]
        endpoint_url:
          type: string
          format: uri
          pattern: '^https://'
          minLength: 1
          maxLength: 2048
          writeOnly: true
        auth_value:
          type: string
          format: password
          minLength: 1
          maxLength: 4096
          writeOnly: true
        signing_secret:
          type: string
          format: password
          minLength: 16
          maxLength: 512
          writeOnly: true
          description: |
            Optional HMAC-SHA256 signing secret. When set, every attempt carries
            X-Webhook-Signature: sha256=<hex HMAC-SHA256(secret, "<X-Webhook-Timestamp>.<raw body>")>.
            Never returned; reads expose has_signing_secret only.
