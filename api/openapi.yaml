  /provider-feed-snapshots/{snapshot_id}/seeds/{stable_seed_key}/download:
    post:
      tags: [Anime]
      operationId: downloadSnapshotSeed
      x-scope: write
      x-mcp:
        tool: download_snapshot_seed
        group: one_shot
        write: true
        description: >-
          Admit the one-shot download of one chosen seed from an exact
          persisted snapshot. This is the delivery step: expand_seed first if
          the row is still pending, so the files and targets were reviewed,
          then submit the edited draft here. The torrent bytes come from the
          same verified cache expansion filled, and a snapshot or identity
          the server can no longer prove fails closed with zero writes.
      description: >-
        Finite one-shot download of one seed that already exists in an exact
        persisted provider feed snapshot. The request carries identities only:
        the locator, title, published time and strong content identity are read
        server-side from that snapshot. The torrent bytes are the ones the lazy
        expansion cache holds for that locator: an already expanded seed is
        served from cache, and a seed that was never expanded is fetched once
        with the identity verification the expand endpoint applies and then
        cached, so the download and the row the user reviewed never disagree.
        A missing, stale, superseded, unexpandable or mismatching snapshot is a
        typed refresh-required failure with zero owner or qBittorrent writes.
        A keyword search snapshot follows the same rules: expansion caches its
        seed's verified bytes and this endpoint downloads them, so a searched
        release needs no separate download path. A search admission must be a
        current_input one-shot carrying the complete draft.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: snapshot_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ID'
        - name: stable_seed_key
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnapshotSeedDownloadInput'
      responses:
        '201':
          description: >-
            The admitted one-shot handle. Replaying the same Idempotency-Key
            with the same body returns the original handle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneShotAdmissionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
  /provider-feed-snapshots/{snapshot_id}/seeds/{stable_seed_key}/expand:
    post:
      tags: [Anime]
      operationId: expandSnapshotSeed
      x-scope: write
      x-mcp:
        tool: expand_seed
        group: one_shot
        write: true
        description: >-
          Fetch and cache the exact torrent of one seed in an exact persisted
          snapshot and return its file manifest. A cached locator returns
          without any provider request. The result is a state, not an error:
          unavailable carries torrent_fetch_failed (network),
          torrent_parse_failed (corrupt payload) or torrent_missing (upstream
          404). Call it after selecting a seed and before rss_list_view so the
          row renders its files and targets; selecting a seed from
          rss_list_view alone does not download anything.
      description: >-
        Lazy expansion of one seed's torrent. The list read never fetches a
        torrent: it renders RSS facts and marks every unexpanded seed pending.
        Expansion reads the locator from the named snapshot server-side (the
        request carries identities only), serves it from the locator-keyed
        cache when it was already fetched and verified, and otherwise fetches
        it once, verifies the identity the snapshot published for that seed,
        caches the bytes and returns the derived file projection. The endpoint
        is naturally idempotent (the cache is keyed by locator), so it takes
        no Idempotency-Key. It writes no snapshot row, no owner state and no
        WorkItem, and an unexpandable locator is cached nowhere: the next read
        renders that seed pending again.
      parameters:
        - name: snapshot_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ID'
        - name: stable_seed_key
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnapshotSeedExpandInput'
      responses:
        '200':
          description: >-
            The expansion result. available carries the manifest the row
            renders; unavailable carries the bounded reason this locator could
            not be expanded, and nothing was cached for it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotSeedExpandResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
