      properties:
        admission_mode:
          $ref: '#/components/schemas/RetentionAdmissionMode'
        quality_profile:
          $ref: '#/components/schemas/QualityProfile'
        cleanup_policy:
          type: object
          additionalProperties: false
          required: [version, effect, grace_seconds]
          properties:
            version: {type: string}
            effect: {type: string, enum: [quarantine, unlink, purge]}
            grace_seconds: {type: integer, format: int64, minimum: 0}
    QualityProfile:
      type: object
      additionalProperties: false
      required: [version, items]
      description: >-
        The replacement comparison profile (profile-v1): ordered comparison
        items. Items compare in order and the first item that ranks two
        releases differently decides; all items equal, the larger size wins;
        still equal, the existing file stays.
      properties:
        version:
          type: string
          enum: [profile-v1]
        items:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/QualityCompareItem'
    QualityCompareItem:
      type: object
      additionalProperties: false
      required: [key, ranks]
      description: >-
        One comparison item. ranks lists value sets best first; a release hits
        an entry when its values contain every value of the entry
        (order- and case-insensitive) and takes its best-ranked hit; a release
        that hits nothing, or has no value, ranks last. Only multi-valued items
        (anibt.language, rt.sub_lang) take entries of several values; a
        duplicate value set is rejected. subgroup.score and release.revision
        take no ranks (subscription subgroup score; numeric vN, absent = v1).
      properties:
        key:
          $ref: '#/components/schemas/QualityCompareKey'
        ranks:
          type: array
          maxItems: 64
          items:
            type: array
            minItems: 1
            maxItems: 8
            items:
              type: string
              minLength: 1
              maxLength: 128
    QualityCompareKey:
      type: string
      enum: [subgroup.score, release.lang, release.resolution, release.revision, anibt.resolution, anibt.language, anibt.subtitle, anibt.format, rt.resolution, rt.sub_lang, rt.source, rt.codec]
    RetentionCompareVocabulary:
      type: object
      additionalProperties: false
      required: [items]
      description: >-
        Candidate values per ranked comparison item: release.* from the active
        attribute rules, anibt.* from values seen on releases (of the anime
        when one is named), rt.* from the pinned reltitle dictionary (empty
        when it is unavailable). Values are suggestions; any value can be
        ranked.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RetentionCompareVocabularyItem'
    RetentionCompareVocabularyItem:
      type: object
      additionalProperties: false
      required: [key, values]
      properties:
        key:
          $ref: '#/components/schemas/QualityCompareKey'
        values:
          type: array
          items:
            type: string
