  /releases/{release_id}/retry:
    post:
      tags: [Releases]
      operationId: retryRelease
      x-scope: write
      x-mcp:
        tool: retry_release
        group: subscription
        write: true
        description: >-
          Run one release through normal acceptance again. Allowed while the release has
          no download in progress and its last download failed or it never had one.
          Rules, the metadata hold and fill-missing deduplication apply exactly as for
          automatic acceptance; it also works while the subscription is stopped. Returns
          the outcome: accepted (with the new download_task_id), filtered, held, present
          or failed with its reason_code. A release that may not be retried now fails
          with RELEASE_NOT_RETRYABLE and the reason.
      description: >-
        Runs the Release through normal acceptance again, synchronously. It is
        allowed while the Release has no download in progress and either never
        had a download or its last download failed; it never bypasses rules,
        the metadata hold or fill-missing deduplication, and works while the
        subscription is stopped. Accepted creates a new DownloadTask and keeps
        the failed one as a record. Filtered, held, present and failed are
        results, not errors. Replaying the same Idempotency-Key returns the
        first result. A Release that may not be retried now answers 409
        RELEASE_NOT_RETRYABLE with the reason in details[0].code.
      parameters:
        - $ref: '#/components/parameters/ReleaseID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Acceptance result of the retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseRetryResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
