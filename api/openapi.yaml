      required: [managed_anime, subscription, metadata, rss_sources, effective_config_versions]
      properties:
        managed_anime:
          $ref: '#/components/schemas/ManagedAnime'
        subscription:
          $ref: '#/components/schemas/Subscription'
        metadata:
          $ref: '#/components/schemas/AnimeMetadata'
        rss_sources:
          type: array
          items:
            $ref: '#/components/schemas/RSSSource'
        effective_config_versions:
          $ref: '#/components/schemas/EffectiveConfigVersions'
    MetadataMatchInput:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version:
          $ref: '#/components/schemas/Version'
    MetadataMatchOutcome:
      type: string
      enum: [complete, partial, no_result, config_error, provider_error]
    MetadataMatch:
      type: object
      additionalProperties: false
      required: [bgm, tmdb]
      properties:
        bgm:
          $ref: '#/components/schemas/NullableBGMBinding'
        tmdb:
          $ref: '#/components/schemas/NullableTMDBBinding'
    MetadataMatchResult:
      type: object
      additionalProperties: false
      required: [managed_anime_id, outcome, metadata]
      properties:
        managed_anime_id:
          $ref: '#/components/schemas/ID'
        outcome:
          $ref: '#/components/schemas/MetadataMatchOutcome'
        metadata:
          $ref: '#/components/schemas/AnimeMetadata'
        match:
          $ref: '#/components/schemas/MetadataMatch'
        reason:
          type: string
          minLength: 1
          maxLength: 512
    AnimeMetadataPatch:
      type: object
      additionalProperties: false
      required: [expected_version, bgm, tmdb]
      properties:
        expected_version:
          $ref: '#/components/schemas/Version'
        bgm:
          $ref: '#/components/schemas/NullableBGMBinding'
        tmdb:
          $ref: '#/components/schemas/NullableTMDBBinding'
        media_kind_override:
          type: string
          nullable: true
          enum: [tv, movie]
          description: >-
            Complete owner value of the pin: null clears it, a value
            (tv | movie) replaces it. It never rewrites the TMDB tuple.
        total_episodes:
          type: integer
          nullable: true
          minimum: 0
          description: NULL clears; a non-null value (including 0) replaces.
        year:
          type: integer
          nullable: true
          minimum: 1900
          maximum: 2100
          description: >-
            Complete owner value of the naming year (anime.year): null or an
            omitted field clears it, a value replaces it.
        season:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            Complete owner value of the naming season (anime.season; 0 is the
            specials season): null or an omitted field clears it, a value
            replaces it. It never rewrites the TMDB tuple, and the TMDB tuple
            never rewrites it.
        title_override:
          type: string
          nullable: true
          minLength: 1
          maxLength: 512
          description: >-
            The anime's fixed title (anime.title_override), written when the
            anime is created. A value replaces it; null or an omitted field
            keeps the stored title. It cannot be cleared.
    AnimeMetadataPreview:
      type: object
      additionalProperties: false
      required: [bgm, tmdb]
      description: >-
        The complete unsaved metadata value an owner_draft RSS list read
        previews with: the AnimeMetadataPatch fields without expected_version,
        with the same complete-value semantics (null or an omitted field
        clears, except title_override, where null keeps the fixed title). It
        replaces the persisted metadata for the read only. The
        read consumes title_override (anime.title_override), year (anime.year),
        season (anime.season and the season composites), bgm (bgm.* facts and the metadata hold), tmdb (tmdb.* facts, the
        bound season and media kind of episode parsing, and the metadata hold)
        and media_kind_override (the media kind of episode parsing).
        total_episodes is validated but does not change a
        preview. No value is filled from network metadata.
      properties:
        bgm:
          $ref: '#/components/schemas/NullableBGMBinding'
        tmdb:
          $ref: '#/components/schemas/NullableTMDBBinding'
        media_kind_override:
          type: string
          nullable: true
          enum: [tv, movie]
        total_episodes:
          type: integer
          nullable: true
          minimum: 0
        year:
          type: integer
          nullable: true
          minimum: 1900
          maximum: 2100
        season:
          type: integer
          nullable: true
          minimum: 0
        title_override:
          type: string
          nullable: true
          minLength: 1
          maxLength: 512
    SubgroupsPatch:
      type: object
      additionalProperties: false
      required: [expected_version, subgroups, group_actions]
      properties:
        expected_version:
          $ref: '#/components/schemas/Version'
        subgroups:
