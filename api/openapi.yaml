          maxLength: 8192
        composed_target:
          type: string
          description: Full relative target for video_filename previews (directory composed with the sample default rules).
        empty_facts:
          type: array
          maxItems: 64
          items:
            type: string
            minLength: 1
            maxLength: 128
          description: >-
            Naming facts (catalog paths such as anime.year) that had no value
            for the sample and rendered empty in rendered. A failure that empty
            facts caused is an error with code NAMING_FACT_MISSING; a variable
            the sample does not define is NAMING_FACT_UNDEFINED, and both list
            the facts here.
        locked_directory:
          type: string
          description: Bound-video directory echoed for subtitle_suffix previews; subtitles never rename it.
        locked_basename:
          type: string
        locked_extension:
          type: string
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/TemplateWarning'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/TemplateSourceError'
        resolved_values:
          type: array
          items:
            $ref: '#/components/schemas/NamingResolvedValue'
    NamingResolvedValue:
      type: object
      additionalProperties: false
      required: [key, state]
      properties:
        key:
          type: string
          minLength: 1
          description: Resolver key such as parsed.episode or derived.effective_title.
        state:
          type: string
          enum: [value, null, conflict]
        value:
          type: string
          description: Bounded scalar summary of the resolved value.
        source:
          type: string
          description: Layer 1 input path the resolver consumed, e.g. Release.OriginalTitle.
        evidence:
          type: string
          description: Bounded human-readable evidence summary (rule id, matched span, captures).
    ArtifactFileSubtitleBinding:
      type: object
      additionalProperties: false
      required: [state, diagnostics]
      properties:
        state:
          type: string
          enum: [not_applicable, bound, missing, ambiguous]
        bound_video_file_ref:
          type: string
          description: Same-artifact video file ref; present iff state is bound.
        method:
          type: string
          description: Binder decision method such as basename_match or episode_match.
        confidence:
          type: number
          description: Binder confidence in the 0..1 range.
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/NamingDiagnostic'
    NamingDiagnostic:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
        path:
          type: string
          description: Optional template path or input path the diagnostic refers to.
    MetadataDetailsStatus:
      type: string
      enum: [available, empty, error, not_applicable]
      description: >-
        Status of the bounded provider-details enrichment. available means the
        candidate has one or more real seasons; empty means details succeeded
        but the provider returned no seasons; error means details failed; and
        not_applicable means the candidate does not use TV details enrichment.
    MetadataSearchSeason:
      type: object
      additionalProperties: false
      required: [season_number, name, episode_count, air_date, is_special]
      properties:
        season_number:
          type: integer
        name:
          type: string
        episode_count:
          type: integer
        air_date:
          type: string
        is_special:
          type: boolean
          description: True when season_number is 0.
    MetadataSearchCandidate:
      type: object
      additionalProperties: false
      required: [provider, provider_work_id, title, media_kind, details_status, score]
      properties:
        provider:
          type: string
          enum: [bgm, tmdb]
        provider_work_id:
          type: string
        title:
          type: string
        original_title:
          type: string
        overview:
          type: string
        poster_url:
          type: string
          description: |
            Server-local proxy path for the candidate poster: /api/v1/images/poster/{bgm_id}
            for Bangumi, /api/v1/images/cover/{image_key} for TMDB. Never a third-party URL;
            omitted when the provider has no poster.
        media_kind:
          type: string
          enum: [tv, movie]
        details_status:
          $ref: '#/components/schemas/MetadataDetailsStatus'
        seasons:
          type: array
          items:
            $ref: '#/components/schemas/MetadataSearchSeason'
          description: >-
            Real provider seasons. An empty array means details succeeded but
            the work has no seasons; omission means no season list is
            applicable or details enrichment failed.
        suggested_season:
          type: integer
          nullable: true
          description: >-
            Optional season suggestion selected only from the returned seasons;
            it is never inferred as a fixed default.
        year:
          type: integer
          description: >-
            The work's year as the provider reports it: TMDB first_air_date
            (TV) or release_date (movie), Bangumi date. Absent when the
            provider gives no usable date; never defaulted.
        release_format:
          allOf:
            - $ref: '#/components/schemas/ReleaseFormat'
          description: >-
            Bangumi results only: the format mapped exactly from the subject
            platform (TV, 剧场版, OVA, WEB → ona). Absent for TMDB results and
            for any other platform; never guessed.
        score:
          type: number
          format: float
    MetadataSearchResult:
      type: object
      additionalProperties: false
      required: [provider, query, candidates]
      properties:
        provider:
          type: string
          enum: [bgm, tmdb]
        query:
          type: string
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/MetadataSearchCandidate'
    ReconciliationScanSubmitInput:
      type: object
      additionalProperties: false
      required: [managed_anime_id]
      properties:
        managed_anime_id:
          $ref: '#/components/schemas/ID'
        tree_top:
          type: string
          minLength: 1
          maxLength: 4096
          description: >-
            The scope of the scan: the directory the work's own files live in
            (its tree top). Omitted for an instance with a previous scan: the
            last scan scope's tree top is reused (the fingerprint is computed
            over the effective tree top).
        trigger:
          type: string
          enum: [manual, periodic]
          default: manual
          description: >-
            Trigger identity of this submission. A manual request replayed
            with the same request_id reuses the completed generation; a
            periodic scheduler tick always creates a new generation.
        request_id:
          type: string
          minLength: 1
          maxLength: 128
          description: >-
            Stable identity of one request. Replaying the same request_id with
            the same input returns the original completed generation; a new
            independent request_id starts a strictly newer generation.
    ReconciliationPathDiffView:
      type: object
      additionalProperties: false
      required: [file_path, disposition, differs]
      properties:
        file_path:
          type: string
        disposition:
          type: string
        expected_path:
          type: string
        differs:
          type: boolean
        companions:
          description: Registered companion sidecars of this video observed by the generation; each expected path derives from the video's expected path.
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/ReconciliationCompanionPathDiffView'
    ReconciliationCompanionPathDiffView:
      type: object
      additionalProperties: false
      required: [file_path, media_kind, state, differs]
      properties:
        file_path:
          type: string
        expected_path:
          type: string
        media_kind:
          type: string
          enum: [subtitle, other]
        state:
          type: string
          enum: [present, missing, size_mismatch]
        differs:
          type: boolean
    PlacementIssueView:
      type: object
      additionalProperties: false
      required: [placement_id, file_path, reason_code, redownload_requested]
      properties:
        placement_id:
          $ref: '#/components/schemas/ID'
        file_path:
          type: string
        reason_code:
          type: string
          enum: [missing, fingerprint_conflict]
        redownload_requested:
          type: boolean
          description: A redownload was accepted and its new file has not been placed yet.
    PlacementReleaseResult:
      type: object
      additionalProperties: false
      required: [placement_id, managed_anime_id, released]
      properties:
        placement_id:
          $ref: '#/components/schemas/ID'
        managed_anime_id:
          $ref: '#/components/schemas/ID'
        released:
          type: integer
          minimum: 0
          description: Placement rows released at the path (the owner row and its scan projections).
    AnimeFileAction:
      type: object
      additionalProperties: false
      required: [available]
      properties:
        available:
          type: boolean
        reason_code:
          type: string
          description: Why the action is unavailable (a reason code, shown through the copy catalog).
    AnimeFileAlignment:
      type: object
      additionalProperties: false
      required: [state]
      description: The latest scan's alignment of this file when it has not completed.
      properties:
        state:
          type: string
          enum: [in_progress, failed]
        reason_code:
          type: string
    AnimeFileCompanion:
      type: object
      additionalProperties: false
      required: [id, media_kind, path, relative_path, size_bytes, status]
      properties:
        id:
          $ref: '#/components/schemas/ID'
        media_kind:
          type: string
          enum: [subtitle, other]
        path:
          type: string
        relative_path:
          type: string
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        status:
          type: string
          enum: [unscanned, aligned, misaligned, missing, size_mismatch]
        target_path:
          type: string
        target_relative_path:
          type: string
        alignment:
          $ref: '#/components/schemas/AnimeFileAlignment'
    AnimeFileActions:
      type: object
      additionalProperties: false
      required: [align, rerun, release, recover]
      properties:
        align:
          $ref: '#/components/schemas/AnimeFileAction'
        rerun:
          $ref: '#/components/schemas/AnimeFileAction'
        release:
          $ref: '#/components/schemas/AnimeFileAction'
        recover:
          $ref: '#/components/schemas/AnimeFileAction'
          description: >-
            Confirm the recovery of the file the scan found at the rendered
            target (row has `recovery`). Unavailable with nothing_to_recover
            when the scan froze no candidate for the row.
    AnimeFile:
      type: object
      additionalProperties: false
      required: [placement_id, media_kind, episodes, path, relative_path, status, actions, companions]
      properties:
        placement_id:
          $ref: '#/components/schemas/ID'
        release_id:
          $ref: '#/components/schemas/ID'
        group_name:
          type: string
          description: >-
            Subtitle group of the placement's release: the display name its
            rss_sources row records, the same value anime.group renders. Empty
            when the placement names no release. Never derived from the release
            title.
        release_title:
          type: string
          description: Feed title of the placement's release; absent when unknown.
        media_kind:
          type: string
          enum: [tv, movie, unresolved]
        season:
          type: integer
          minimum: 0
        episodes:
          type: array
          items:
            type: string
        path:
          type: string
        relative_path:
          type: string
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        status:
          type: string
          enum: [unscanned, aligned, misaligned, missing, changed, no_target]
        status_reason:
          type: string
          description: Why a no_target row has no target (coverage_unresolved, render_facts_unavailable, target_render_failed).
        target_path:
          type: string
        target_relative_path:
          type: string
        alignment:
          $ref: '#/components/schemas/AnimeFileAlignment'
        recovery:
          $ref: '#/components/schemas/AnimeFileRecovery'
          description: >-
            The frozen recovery candidate when the latest scan found the
            file's rendered target missing and observed a file exactly there.
            Present only then; the confirm action acts on it.
        actions:
          $ref: '#/components/schemas/AnimeFileActions'
        companions:
          type: array
          items:
            $ref: '#/components/schemas/AnimeFileCompanion'
    AnimeFileRecovery:
      type: object
      additionalProperties: false
      required: [generation, target_path, target_relative_path, size_bytes,
                 placement_version, fingerprint, companions]
      properties:
        generation:
          type: integer
          format: int64
          minimum: 1
          description: >-
            The scan generation that froze the candidate; pass it to the
            recover endpoint.
        target_path:
          type: string
          description: >-
            The rendered target where the scan found the complete file group.
        target_relative_path:
          type: string
          description: >-
            target_path relative to the view root; display this instead of
            composing a path on the client.
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        placement_version:
          type: integer
          format: int64
          minimum: 0
          description: The placement row version frozen with the candidate;
            pass it to the recover endpoint.
        fingerprint:
          type: string
          description: Metadata fingerprint the scan observed at the target;
            pass it to the recover endpoint.
        companions:
          type: integer
          minimum: 0
          description: >-
            Companion files frozen with the candidate. The confirm succeeds
            only when every companion still sits at its frozen path; if one
            is missing or changed, nothing is recovered.
    AnimeFilesScan:
      type: object
      additionalProperties: false
      required: [state, generation, rescan_required]
      properties:
        state:
          type: string
          enum: [idle, running, failed]
        generation:
          type: integer
          format: int64
          minimum: 0
          description: The calibrated scan generation the statuses come from (0 = never scanned).
        scanned_at:
          type: string
          format: date-time
        failure_code:
          type: string
        rescan_required:
          type: boolean
          description: >-
            This generation's alignment finished and moved at least one file,
            so the rows still describe the paths that existed before the move
            and only a new scan shows the result. The server reports it because
            an alignment can start and settle between two reads: a client that
            inferred the rescan from an in-flight flag alone would miss it.
    AnimeFilesView:
      type: object
      additionalProperties: false
      required: [managed_anime_id, root, scan, aligning, scan_action, align_all_action, files]
      properties:
        managed_anime_id:
          $ref: '#/components/schemas/ID'
        root:
          type: string
          description: >-
            The deepest directory holding every listed path, raised so each
            path keeps its last three segments (anime folder / season folder /
            file); relative paths are relative to it.
        scan:
          $ref: '#/components/schemas/AnimeFilesScan'
        aligning:
          type: boolean
        scan_action:
          $ref: '#/components/schemas/AnimeFileAction'
        align_all_action:
          $ref: '#/components/schemas/AnimeFileAction'
        files:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/AnimeFile'
    AnimeFilesAlignInput:
      type: object
      additionalProperties: false
      required: [generation]
      properties:
        generation:
          type: integer
          format: int64
          minimum: 1
          description: The scan generation the caller read (AnimeFilesView.scan.generation).
        placement_ids:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/ID'
          description: Align only these files; omitted or empty aligns every misaligned file.
        refresh_metadata:
          type: boolean
          default: false
          description: >-
            The 对齐（刷新元数据）variant: re-pull the bound works (Bangumi subject,
            TMDB tv/movie) straight from their providers bypassing the positive
            caches, update the cached work titles and episode title rows, and
            admit the alignment only after the re-pull succeeded. The plain
            action (false, the default) stays cache-first. A failed re-pull is
            a typed reason and the alignment is never admitted.
    AnimeFilesAlignResult:
      type: object
      additionalProperties: false
      required: [generation, admitted]
      properties:
        generation:
          type: integer
          format: int64
          minimum: 1
        admitted:
          type: integer
          minimum: 0
          description: Alignment operations newly admitted (files and bound subtitles).
    AnimeFileRecoverInput:
      type: object
      additionalProperties: false
      required: [placement_id, generation, target_path, fingerprint,
                 placement_version]
      properties:
        placement_id:
          $ref: '#/components/schemas/ID'
          description: >-
            The file row whose frozen recovery candidate is confirmed
            (AnimeFile.placement_id).
        generation:
          type: integer
          format: int64
          minimum: 1
          description: >-
            The scan generation the caller read (AnimeFile.recovery.generation);
            a newer generation answers scan_changed.
        target_path:
          type: string
          description: The rendered target the caller read
            (AnimeFile.recovery.target_path); a mismatch answers target_changed.
        fingerprint:
          type: string
          description: The metadata fingerprint the caller read
            (AnimeFile.recovery.fingerprint); a mismatch answers target_changed.
        placement_version:
          type: integer
          format: int64
          minimum: 0
          description: The placement row version the caller read
            (AnimeFile.recovery.placement_version); a mismatch answers
            placement_changed.
    AnimeFileRecoverResult:
      type: object
      additionalProperties: false
      required: [placement_id, generation, target_path, replay, companions]
      properties:
        placement_id:
          $ref: '#/components/schemas/ID'
        generation:
          type: integer
          format: int64
          minimum: 1
          description: The confirmed candidate's scan generation.
        target_path:
          type: string
          description: >-
            The path the file now owns (the candidate's rendered target).
        recovered_at:
          type: string
          format: date-time
        replay:
          type: boolean
          description: >-
            True when this confirm had already committed; the same result
            replays.
        companions:
          type: integer
          minimum: 0
          description: Companion files re-attached with the video (a missing
            companion would have refused the confirm).
    CompanionIssueView:
      type: object
      additionalProperties: false
      required: [video_path, file_path, media_kind, reason_code]
      properties:
        video_path:
          type: string
        file_path:
          type: string
        expected_path:
          type: string
        media_kind:
          type: string
          enum: [subtitle, other]
        reason_code:
          type: string
          enum: [companion_missing, companion_size_mismatch, companion_not_aligned]
    ReconciliationScanView:
      type: object
      additionalProperties: false
      required: [managed_anime_id, state, generation, input_fingerprint, progress, capacity_stats, version]
      properties:
        managed_anime_id:
          $ref: '#/components/schemas/ID'
        state:
          type: string
          enum: [idle, running, completed, failed, canceled]
        generation:
          type: integer
          minimum: 0
        input_fingerprint:
          type: string
        progress:
          type: object
        capacity_stats:
          type: object
        failure_code:
          type: string
          nullable: true
        failure_reason:
          type: string
          nullable: true
        version:
          type: integer
          minimum: 1
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
    ReconciliationObservation:
      type: object
      additionalProperties: false
      required: [file_path, fingerprint, size_bytes, observed_at]
      properties:
        file_path:
          type: string
        fingerprint:
          type: string
        size_bytes:
          type: integer
          minimum: 0
        facts:
          type: object
        observed_at:
          type: string
          format: date-time
    ReconciliationObservationPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ReconciliationObservation'
    ReplacementDecisionView:
      type: object
      additionalProperties: false
      required: [id, managed_anime_id, candidate_release_id, coverage_key, policy_version, profile_version, admission_mode, verdict, state, version, created_at]
      properties:
        id:
          type: string
        managed_anime_id:
          type: string
        candidate_release_id:
          type: string
        coverage_key:
          type: string
          description: >-
            The one coverage key this decision freezes; "unresolved" for a
            release without resolvable coverage.
        candidate_placement_id:
          type: string
        policy_version:
          type: integer
        profile_version:
          type: string
        subscription_version:
          type: integer
        input_digest:
          type: string
        snapshot_generation:
          type: integer
        admission_mode:
          type: string
          enum: [all, per_group, single_copy]
        verdict:
          type: string
          enum: [keep, retain, queue, replace, blocked]
        state:
          type: string
          enum: [admitted, queued, settled, stale, blocked, failed]
        stale_reason:
          type: string
        pools:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ReplacementPoolEvidence'
        version:
          type: integer
        created_at:
          type: string
          format: date-time
    ReplacementPoolEvidence:
      type: object
      additionalProperties: false
      required: [pool_key, verdict]
      properties:
        pool_key:
          type: string
        verdict:
          type: string
          enum: [replace, retain, keep, blocked, queue]
        reason:
          type: string
        winner:
          $ref: '#/components/schemas/ReplacementPlacementRef'
        losers:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ReplacementPlacementRef'
        steps:
          type: array
          maxItems: 16
          description: >-
            The comparison steps that decided the pool, in item order; the
            last step decides (key "size" is the size tiebreak).
          items:
            $ref: '#/components/schemas/ReplacementCompareStep'
    ReplacementCompareStep:
      type: object
      additionalProperties: false
      required: [key, result]
      properties:
        key:
          type: string
        candidate:
          type: string
        current:
          type: string
        candidate_listed:
          type: boolean
        current_listed:
          type: boolean
        result:
          type: string
          enum: [better, worse, equal, skipped]
    ReplacementPlacementRef:
      type: object
      additionalProperties: false
      required: [placement_id, version, fingerprint]
      properties:
        placement_id:
          type: string
        version:
          type: integer
        fingerprint:
          type: string
    ReplacementEvaluateInput:
      type: object
      additionalProperties: false
      required: [managed_anime_id, candidate_release_id]
      properties:
        managed_anime_id:
          $ref: '#/components/schemas/ID'
        candidate_release_id:
          $ref: '#/components/schemas/ID'
    OffsetMigrationPlanView:
      type: object
      additionalProperties: false
      required: [id, placement_id, policy_version, raw_episode, new_episode, old_target_path, new_target_path, state, version, created_at]
      properties:
        id:
          type: string
        placement_id:
          type: string
        managed_anime_id:
          type: string
        policy_version:
          type: integer
          minimum: 1
        raw_episode:
          type: string
        new_episode:
          type: string
        old_target_path:
          type: string
        new_target_path:
          type: string
        state:
          type: string
          enum: [planned, ready, running, waiting_retry, effect_unknown, applied, blocked, failed, superseded]
        failure_reason:
          type: string
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OffsetMigrationGenerationView:
      type: object
      additionalProperties: false
      required: [id, managed_anime_id, scope_kind, scope_owner_id, policy_version, old_offset, new_offset, state, version, created_at]
      properties:
        id:
          type: string
        managed_anime_id:
          type: string
        scope_kind:
          type: string
          enum: [rss_source]
        scope_owner_id:
          type: string
        policy_version:
          type: integer
          minimum: 1
        old_offset:
          type: integer
        new_offset:
          type: integer
        state:
          type: string
          enum: [pending, planning, ready, running, completed, completed_with_blocks, failed, superseded]
        reason_code:
          type: string
        reason:
          type: string
        planned_count:
          type: integer
          minimum: 0
        blocked_count:
          type: integer
          minimum: 0
        applied_count:
          type: integer
          minimum: 0
        superseded_count:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
    PlacementView:
      type: object
      additionalProperties: false
      required: [id, physical_path, managed_anime_id, source_evidence_type, source_owner_ref, target_fingerprint, facts_version, verification_state, state, version, created_at]
      properties:
        id:
          type: string
        physical_path:
          type: string
        managed_anime_id:
          type: string
        source_evidence_type:
          type: string
          enum: [file_operation, reconciliation]
        source_owner_ref:
          type: string
        target_fingerprint:
          type: string
        facts_version:
          type: string
        verification_state:
          type: string
          enum: [verified, unverified, excluded]
        state:
          type: string
          enum: [active, superseded, released, displaced]
          description: >-
            `superseded` lost a quality replacement; `released` is a user
            release from management; `displaced` lost its file to another
            file at its path (overwrite setting) or to a redownload. A
            displaced placement covers nothing and is never cleaned up.
        version:
          type: integer
        created_at:
          type: string
          format: date-time
    PlacementCoverageView:
      type: object
      additionalProperties: false
      required: [observation_key, coverage_ordinal, facts_version, evidence_ref]
      properties:
        observation_key:
          type: string
        coverage_ordinal:
          type: integer
        facts_version:
          type: string
        evidence_ref:
          type: string
    ReconciliationConsumerStateView:
      type: object
      additionalProperties: false
      required: [managed_anime_id, generation, consumer, state, version, updated_at]
