      properties:
        client_ref:
          type: string
          minLength: 1
          maxLength: 256
        name:
          type: string
          minLength: 1
          maxLength: 8192
          description: Logical filename/path text; never opened by the server.
        size_bytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        media_kind_hint:
          type: string
          nullable: true
    MediaRecognitionContext:
      type: object
      additionalProperties: false
      required: [work_kind]
      properties:
        work_kind:
          type: string
          enum: [tv, movie]
        season:
          type: integer
          minimum: 0
        season_bound:
          type: boolean
          default: false
        episode_offset:
          type: integer
          default: 0
    ParserSelection:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
          minLength: 1
        config:
          type: object
          additionalProperties: true
    ParserCatalogEntry:
      type: object
      additionalProperties: false
      required: [id, implementation_version, output_contract_version, display_name, capabilities, config_version]
      properties:
        id:
          type: string
        implementation_version:
          type: string
        output_contract_version:
          type: string
        display_name:
          type: string
        capabilities:
          type: array
          items:
            type: string
        config_version:
          type: string
    MediaRecognitionPreviewResult:
      type: object
      additionalProperties: false
      required: [items, parser_version, resolver_version]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MediaRecognitionItemResult'
        parser_version:
          type: string
        resolver_version:
          type: string
    MediaRecognitionItemResult:
      type: object
      additionalProperties: false
      required: [client_ref, media_kind, disposition, parser_status, parser_shape, identity_state, parser_version, resolver_version, input_digest]
      properties:
        client_ref:
          type: string
        media_kind:
          type: string
        disposition:
          type: string
          enum: [classified, unclassified]
        parser_status:
          type: string
        parser_shape:
          type: string
        raw_capture:
          type: string
        episode:
          type: string
          nullable: true
        identity_state:
          type: string
        final_episode:
          type: string
          nullable: true
        coverage_key:
          type: string
          nullable: true
        warnings:
          type: array
          items:
            type: string
        parser_version:
          type: string
        resolver_version:
          type: string
        input_digest:
          type: string
    ParseReleaseTitleInput:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 1024
    ParseReleaseTitleResult:
      type: object
      additionalProperties: false
      required: [facts, parser_version]
      properties:
        facts:
          $ref: '#/components/schemas/ParsedReleaseFacts'
        parser_version:
          type: string
          minLength: 1
        episode:
          $ref: '#/components/schemas/EpisodeParseResult'
    EpisodeParseResult:
      type: object
      additionalProperties: false
      required: [matched, episode_number]
      properties:
        matched:
          type: boolean
        episode_number:
          type: number
          minimum: 0
        confidence:
          type: string
        evidence:
          type: string
    ParseTorrentFilesInput:
      type: object
      additionalProperties: false
      required: [torrent_url]
      properties:
        torrent_url:
          type: string
          minLength: 1
          maxLength: 2048
          description: Absolute HTTP(S) torrent URL. The server fetches and bencode-validates it.
    ParseTorrentFilesResult:
      type: object
      additionalProperties: false
      required: [info_hash_v1, torrent_name, torrent_version, total_size_bytes, files, digest, parser_version]
      properties:
        info_hash_v1:
          type: string
          minLength: 1
        info_hash_v2:
          type: string
        torrent_name:
          type: string
        torrent_version:
          type: string
        total_size_bytes:
          type: integer
          format: int64
          minimum: 0
        files:
          type: array
          items:
            $ref: '#/components/schemas/ParseTorrentFile'
        digest:
          type: string
          minLength: 1
          description: sha256 digest of the fetched bencoded payload.
        parser_version:
          type: string
          minLength: 1
    ParseTorrentFile:
      type: object
      additionalProperties: false
      required: [path, name, size_bytes]
      properties:
        path:
          type: string
        name:
          type: string
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        media_kind:
          type: string
        language:
          type: string
    Release:
      type: object
      additionalProperties: false
      required:
        - id
        - rss_source_id
        - stable_item_key
        - raw_facts
        - source_facts
        - verdict
        - reason_code
        - version
      properties:
        id:
          $ref: '#/components/schemas/ID'
        rss_source_id:
          $ref: '#/components/schemas/ID'
        stable_item_key:
          type: string
          minLength: 1
          x-mcp-omit: true
          x-secret: true
          description: >-
            RSS item identity key (guid, else enclosure or link URL, else
            content hash). Withheld from MCP tool results (x-mcp-omit): a URL
            fallback can embed a passkey; agents address releases by release_id.
        raw_facts:
          $ref: '#/components/schemas/RawReleaseFacts'
        source_facts:
          $ref: '#/components/schemas/SourceFacts'
        parsed_facts:
          $ref: '#/components/schemas/ParsedReleaseFacts'
        verdict:
          $ref: '#/components/schemas/ReleaseVerdict'
        reason_code:
          type: string
          minLength: 1
        reason_detail:
          type: string
        evaluation_version:
          type: string
          minLength: 1
        download_task_id:
          $ref: '#/components/schemas/ID'
        acquisition_id:
          description: Newest execution record accepted from this release; absent when none was.
          $ref: '#/components/schemas/ID'
        release_files:
          type: array
          items:
            $ref: '#/components/schemas/ReleaseFile'
        acquisition_targets:
          type: array
          items:
            $ref: '#/components/schemas/AcquisitionTarget'
        target_observations:
          type: array
          items:
            $ref: '#/components/schemas/TargetObservation'
        version:
          $ref: '#/components/schemas/Version'
    AcquisitionTarget:
      type: object
      additionalProperties: false
      required: [id, release_id, target_ref, source_path, media_kind, target_path, expected_size_bytes, intent, collision_policy, spec_digest, version]
      properties:
        id:
          $ref: '#/components/schemas/ID'
        release_id:
          $ref: '#/components/schemas/ID'
        target_ref:
          type: string
          minLength: 1
        source_path:
          type: string
          description: Redacted torrent-relative source path.
        media_kind:
          type: string
          enum: [video, subtitle, other]
        target_path:
          type: string
          description: Redacted canonical target path.
        expected_size_bytes:
          type: integer
          format: int64
          minimum: 0
        intent:
          type: string
          enum: [ensure_present, replace]
        collision_policy:
          type: string
          enum: [block, version, overwrite]
        spec_digest:
          type: string
          minLength: 8
        version:
          $ref: '#/components/schemas/Version'
    TargetObservation:
      type: object
      additionalProperties: false
      required: [target_id, state, observed_at, version]
      properties:
        target_id:
          $ref: '#/components/schemas/ID'
        state:
          type: string
          enum: [missing, present_matched, present_mismatched, unreadable]
        observed_size_bytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        reason_code:
          type: string
          nullable: true
        observed_at:
          type: string
          format: date-time
        version:
          $ref: '#/components/schemas/Version'
    TargetDiagnostic:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
          maxLength: 256
        source_path:
          type: string
          description: Torrent-relative source path for the affected file.
    ReleaseFile:
      type: object
      additionalProperties: false
      required: [path, filename, media_kind]
      properties:
        path:
          type: string
          description: Source path inside the torrent.
        filename:
          type: string
        size_bytes:
          type: integer
          format: int64
          nullable: true
        media_kind:
          type: string
          enum: [video, subtitle, other]
        target_path:
          type: string
          description: Frozen canonical target path when target rendering succeeded.
        target_diagnostic:
          $ref: '#/components/schemas/TargetDiagnostic'
        episode:
          type: string
          description: >-
            Best-effort per-file episode parsed from the filename at read time.
            Absent when the filename yields no episode.
        resolution:
          type: string
          description: Best-effort per-file resolution (e.g. 1080p) parsed at read time.
        revision:
          type: string
          description: Best-effort per-file revision marker (e.g. v2) parsed at read time.
        language:
          type: string
          description: Best-effort per-file language (subtitle files) parsed at read time.
        outcome:
          $ref: '#/components/schemas/ReleaseFileOutcome'
        outcome_reason:
          type: string
          description: >-
            Stable reason code of a file the accepted plan does not place
            (e.g. covered_existing, target_collision_blocked). Absent for a
            planned file.
    ReleaseFileOutcome:
      type: string
      description: >-
        Per-file conclusion of the batch plan the release was accepted with.
        Absent when the release has no accepted plan.
      enum:
        - planned
        - ignored_nested
        - ignored_kind
        - excluded_by_rule
        - episode_unrecognized
        - covered_existing
        - covered_in_flight
        - target_collision
        - subtitle_follows
        - subtitle_unbound
    ParserProvenance:
      type: object
      additionalProperties: false
      required: [kind]
      description: >-
        Exact parser/profile evidence used by admission. It is evidence, not a
        live policy lookup: retries and downstream owners must use this frozen
        selection instead of current instance parser configuration.
      properties:
        kind:
          type: string
          minLength: 1
        config:
          type: object
          additionalProperties: true
          description: >-
            The exact frozen parser configuration the selection ran with
            (absent when the profile carried no config). A retry/replay rebuilds
            the selection from this frozen value instead of current instance
            parser configuration.
        config_fingerprint:
          type: string
          minLength: 1
        config_version:
          type: string
          minLength: 1
        implementation_version:
          type: string
          minLength: 1
        output_contract_version:
          type: string
          minLength: 1
        normalizer_version:
          type: string
          minLength: 1
        resolver_version:
          type: string
          minLength: 1
        offset:
          type: integer
          description: >-
            The episode offset this selection resolved with: the RSS link's
            offset, or the one-shot input's own offset (0 when neither). The
            resolver applies it exactly once; downstream owners consume this
            frozen value.
        source_version:
          type: integer
          format: int64
          minimum: 0
          description: >-
            The RSS source CAS version the offset was read from at selection
            time (0 when unknown).
        parse_status:
          type: string
          enum: [value, missing, invalid, unsupported, conflict]
          description: The selected parser's typed result status.
        parse_shape:
          type: string
          enum: [single, range, list, season_only, special, unknown]
          description: The selected parser's typed result shape.
        media_kind:
          type: string
          enum: [tv, movie]
          description: >-
            The frozen TMDB metadata media kind this identity resolved with
            (absent on legacy rows, meaning the TV default). A movie binding
            short-circuits to the canonical movie:0 identity; downstream owners
            consume this frozen value instead of current metadata.
        season:
          type: integer
          description: >-
            The bound metadata season frozen at evaluation time (0 when
            unbound or on legacy rows).
        season_bound:
          type: boolean
          description: >-
            Whether a bound season 0 was preserved for a continuous-SP
            subscription instead of defaulting to season 1.
        policy_version:
          type: integer
          minimum: 0
          description: The instance parser-policy owner CAS version (evidence only).
        profile_version:
          type: integer
          minimum: 0
          description: The resolved effective parser-section version that supplied the episode patterns (evidence only).
        rules_owner_version:
          type: integer
          format: int64
          minimum: 0
          description: The CAS version of the anime rules config owner the profile was resolved from (evidence only).
        input_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        result_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
    ConfigRevisionIdentity:
      type: object
      additionalProperties: false
      required: [identity_kind, effective_digest]
      description: >-
        Explicit immutable configuration identity used for admission. A
        candidate revision is identified by candidate_id plus revision; a direct
        instance is identified by its materialized managed_anime_id; a captured
        unsaved current_input admission carries only its effective_digest. The
        CAS version is deliberately not an identity field.
      properties:
        identity_kind:
          type: string
          enum: [candidate_revision, instance_materialized, current_input]
        candidate_id:
          allOf:
            - $ref: '#/components/schemas/ID'
          nullable: true
        revision:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        managed_anime_id:
          allOf:
            - $ref: '#/components/schemas/ID'
          nullable: true
        effective_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
    TargetFact:
      type: object
      additionalProperties: false
      required: [target_ref, source_path, target_path, media_kind, expected_size_bytes, intent, collision_policy, spec_digest]
      properties:
        target_ref:
          type: string
          minLength: 1
        source_path:
          type: string
          minLength: 1
        target_path:
          type: string
          minLength: 1
        media_kind:
          type: string
          enum: [video, subtitle, other]
        expected_size_bytes:
          type: integer
          format: int64
          minimum: 0
        intent:
          type: string
          enum: [ensure_present, replace]
        collision_policy:
          type: string
          enum: [block, version, overwrite]
        spec_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
    TargetFactsSnapshot:
      type: object
      additionalProperties: false
      required: [admission, targets, observations]
      description: Complete target-set and observation facts frozen before qB admission.
      properties:
        target_set_digest:
          type: string
          nullable: true
          pattern: '^sha256:[0-9a-f]{64}$'
        admission:
          type: string
          enum: [adopted_existing, download_required, acquisition_failed]
        reason:
          type: string
          nullable: true
        targets:
          type: array
          items:
            $ref: '#/components/schemas/TargetFact'
        observations:
          type: array
          items:
            $ref: '#/components/schemas/TargetObservation'
    SelectedReleaseIdentity:
      type: object
      additionalProperties: false
      required: [release_id, rss_source_id, stable_item_key, release_version, subscription_id, managed_anime_id]
      description: Public identity projection of the exact persisted release selected at admission; private execution facts remain only in the internal frozen owner snapshot.
      properties:
        release_id:
          $ref: '#/components/schemas/ID'
        rss_source_id:
          $ref: '#/components/schemas/ID'
        stable_item_key:
          type: string
          minLength: 1
          x-mcp-omit: true
          x-secret: true
          description: >-
            RSS item identity key (guid, else enclosure or link URL, else
            content hash). Withheld from MCP tool results (x-mcp-omit): a URL
            fallback can embed a passkey; agents address releases by release_id.
        release_version:
          $ref: '#/components/schemas/Version'
        subscription_id:
          $ref: '#/components/schemas/ID'
        managed_anime_id:
          $ref: '#/components/schemas/ID'
    DownloadAdoptionProvenance:
      type: object
      additionalProperties: false
      required: [kind, provider_task_id, provider_info_hash, operation_key_checked]
      description: Safe provenance showing that this owner independently adopted one external downloader fact; it is not owner identity and carries no prior local outcome.
      properties:
        kind:
          type: string
          enum: [unique_infohash_path]
        provider_task_id:
          type: string
          minLength: 1
        provider_info_hash:
          type: string
          minLength: 1
        operation_key_checked:
          type: string
          minLength: 1
    FrozenDownloadInput:
      type: object
      additionalProperties: false
      required: [release_stable_item_key, source_locator_display]
      properties:
        release_stable_item_key:
          type: string
          minLength: 1
          x-mcp-omit: true
          x-secret: true
          description: >-
            RSS item identity key of the frozen release (guid, else enclosure or
            link URL, else content hash). Withheld from MCP tool results
            (x-mcp-omit): a URL fallback can embed a passkey.
        source_locator_display:
          type: string
          x-mcp-omit: true
          x-secret: true
          description: >-
            Redacted display form of the frozen release's torrent URL. Withheld
            from MCP tool results (x-mcp-omit): a path can still embed a key.
        selected_url_digest:
          type: string
        selected_release:
          allOf:
            - $ref: '#/components/schemas/SelectedReleaseIdentity'
          nullable: true
        selected_seed:
          allOf:
            - $ref: '#/components/schemas/SelectedSeed'
          nullable: true
        target_facts:
          allOf:
            - $ref: '#/components/schemas/TargetFactsSnapshot'
          nullable: true
        torrent_input_id:
          $ref: '#/components/schemas/ID'
        torrent_payload_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        torrent_filename:
          type: string
        torrent_parser_version:
          type: string
        torrent_version:
          type: string
        info_hash_v1:
          type: string
        info_hash_v2:
          type: string
        adoption_provenance:
          allOf:
            - $ref: '#/components/schemas/DownloadAdoptionProvenance'
          nullable: true
        release_files:
          type: array
          items:
            $ref: '#/components/schemas/ReleaseFile'
    FrozenPolicySnapshot:
      type: object
      additionalProperties: false
      required: [rules_version, metadata_version, effective_sections, section_versions, section_schemas, effective_digest, config_identity]
      properties:
        rules_version:
          $ref: '#/components/schemas/Version'
        metadata_version:
          $ref: '#/components/schemas/Version'
        evaluator_version:
          type: string
          minLength: 1
        effective_sections:
          type: object
          additionalProperties: true
        section_versions:
          type: object
          additionalProperties:
            type: integer
            format: int64
        section_schemas:
          type: object
          additionalProperties:
            type: string
        effective_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        config_identity:
          $ref: '#/components/schemas/ConfigRevisionIdentity'
        parser:
          allOf:
            - $ref: '#/components/schemas/ParserProvenance'
          nullable: true
    ProviderCorrelation:
      type: object
      additionalProperties: false
      properties:
        external_id:
          type: string
        info_hash:
          type: string
        stable_tag:
          type: string
    DownloadTask:
      type: object
      additionalProperties: false
      required:
        - id
        - release_id
        - frozen_input
        - frozen_policy
        - state
        - idempotency_key
        - version
      properties:
        id:
          $ref: '#/components/schemas/ID'
        release_id:
          $ref: '#/components/schemas/ID'
        provider_correlation:
          $ref: '#/components/schemas/ProviderCorrelation'
        frozen_input:
          $ref: '#/components/schemas/FrozenDownloadInput'
        frozen_policy:
          $ref: '#/components/schemas/FrozenPolicySnapshot'
        state:
          type: string
          enum: [queued, submitting, downloading, completed, waiting_retry, failed]
        idempotency_key:
          type: string
          minLength: 1
        failure_code:
          type: string
        failure_reason:
          type: string
        version:
          $ref: '#/components/schemas/Version'
        failed_work_item_id:
          description: Opaque handle of the terminal failed work item accepted by this owner's manual-retry endpoint; absent when the owner has no failed work item.
          $ref: '#/components/schemas/ID'
    Fingerprint:
      type: object
      additionalProperties: false
      required: [algorithm, value, size_bytes]
      properties:
        algorithm:
          type: string
          enum: [sha256]
        value:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'
        size_bytes:
          type: integer
          format: int64
          minimum: 0
    ArtifactFile:
      type: object
      additionalProperties: false
      required: [ref, path, media_kind, fingerprint]
      properties:
        ref:
          type: string
          minLength: 1
        path:
          type: string
          description: Redacted canonical source path.
        media_kind:
          type: string
          enum: [video, subtitle, other]
        fingerprint:
          $ref: '#/components/schemas/Fingerprint'
        subtitle_binding:
          description: Subtitle-to-video binding decision; present on every file, not_applicable for non-subtitle files.
          $ref: '#/components/schemas/ArtifactFileSubtitleBinding'
    Artifact:
      type: object
      additionalProperties: false
      required: [id, download_task_id, files, fingerprints, state, version]
      properties:
        id:
          $ref: '#/components/schemas/ID'
        download_task_id:
          $ref: '#/components/schemas/ID'
        files:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactFile'
        fingerprints:
          type: array
          items:
            $ref: '#/components/schemas/Fingerprint'
        state:
          type: string
          enum: [pending, verified, waiting_retry, failed]
        failure_code:
          type: string
        failure_reason:
          type: string
        version:
          $ref: '#/components/schemas/Version'
        failed_work_item_id:
          description: Opaque handle of the terminal failed work item accepted by this owner's manual-retry endpoint; absent when the owner has no failed work item.
          $ref: '#/components/schemas/ID'
    CollisionPolicy:
      type: string
      enum: [fail, versioned, overwrite]
      description: >-
        What an import or an alignment does when its target path already
        holds a file: `fail` skips that file, `versioned` adds a version
        number, `overwrite` replaces the existing file and permanently
        deletes it. A video and its subtitles are handled as one unit. This
        includes a file the library already manages: its placement becomes
        `displaced` (the episode leaves that instance's coverage, its
        subtitles become unmanaged files) unless an approved version
        replacement names it, which supersedes it instead. File manager
        operations never overwrite.
    FrozenRenderSnapshot:
      type: object
      additionalProperties: false
      required: [renderer_version, directory, filename]
      properties:
        renderer_version:
          type: string
          minLength: 1
        directory:
          type: string
        filename:
          type: string
    FrozenFileConfigSnapshot:
      type: object
      additionalProperties: false
      required: [rules_version, safety_version]
      properties:
        rules_version:
          $ref: '#/components/schemas/Version'
        safety_version:
          type: string
          minLength: 1
    FileOperation:
      type: object
      additionalProperties: false
      required:
        - id
        - artifact_id
        - artifact_file_ref
        - operation
        - source_path
        - target_path
        - source_fingerprint
        - collision_policy
        - frozen_render_snapshot
        - frozen_config_snapshot
        - state
        - idempotency_key
        - version
      properties:
        id:
          $ref: '#/components/schemas/ID'
        artifact_id:
          $ref: '#/components/schemas/ID'
        artifact_file_ref:
          type: string
          minLength: 1
        operation:
          type: string
          enum: [copy, move, hardlink]
        source_path:
          type: string
          description: Redacted canonical source path.
        target_path:
          type: string
          description: Redacted canonical path under an allowed root.
        source_fingerprint:
          $ref: '#/components/schemas/Fingerprint'
        target_fingerprint:
          $ref: '#/components/schemas/Fingerprint'
        collision_policy:
          $ref: '#/components/schemas/CollisionPolicy'
        expected_size_bytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        observed_target_size_bytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        intent:
          type: string
          enum: [ensure_present, replace, explicit]
        frozen_render_snapshot:
          $ref: '#/components/schemas/FrozenRenderSnapshot'
        frozen_config_snapshot:
          $ref: '#/components/schemas/FrozenFileConfigSnapshot'
        state:
          type: string
          enum: [pending, running, completed, waiting_retry, failed]
        observed_at:
          type: string
          format: date-time
        failure_code:
          type: string
        failure_reason:
          type: string
        idempotency_key:
          type: string
          minLength: 1
        version:
          $ref: '#/components/schemas/Version'
        failed_work_item_id:
          description: Opaque handle of the terminal failed work item accepted by this owner's manual-retry endpoint; absent when the owner has no failed work item.
          $ref: '#/components/schemas/ID'
    AutomationSchedule:
      type: object
      additionalProperties: false
      required: [kind, enabled, interval_value, interval_unit, version]
      properties:
        kind:
          $ref: '#/components/schemas/AutomationKind'
        enabled:
          type: boolean
        interval_value:
          type: integer
          minimum: 1
        interval_unit:
          $ref: '#/components/schemas/AutomationIntervalUnit'
        next_run_at:
          type: string
          nullable: true
          format: date-time
        last_dispatch_at:
          type: string
          nullable: true
          format: date-time
        last_run_outcome:
          description: Summary of the most recent dispatch run for this kind, present once any run exists.
          allOf:
            - $ref: '#/components/schemas/AutomationRunOutcome'
          nullable: true
        version:
          $ref: '#/components/schemas/Version'
    AutomationRunOutcome:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          $ref: '#/components/schemas/AutomationState'
        started_at:
          type: string
          nullable: true
          format: date-time
        finished_at:
          type: string
          nullable: true
          format: date-time
    UpdateAdmitInput:
      type: object
      additionalProperties: false
      required: [target_release_id, manifest_digest]
      properties:
        target_release_id:
          type: string
        manifest_digest:
          type: string
    UpdateCheck:
      type: object
      description: A successful check result. Fetch or validation failures are returned as the standard error response, not as a partial 200 result.
      additionalProperties: false
      required: [status, current, compatibility, checked_at]
      properties:
        status:
          type: string
          enum: [up_to_date, update_available, base_image_required]
        current:
          $ref: '#/components/schemas/UpdateCurrent'
        candidate:
          $ref: '#/components/schemas/UpdateCandidate'
        compatibility:
          $ref: '#/components/schemas/UpdateCompatibility'
        checked_at:
          type: string
          format: date-time
        active_operation:
          $ref: '#/components/schemas/EmbeddedUpdateStatus'
    UpdateCurrent:
      type: object
      additionalProperties: false
      required: [version, release_id, image_compatibility]
      properties:
        version: {type: string}
        release_id: {type: string}
        image_compatibility: {type: string}
    UpdateCandidate:
      type: object
      additionalProperties: false
      required: [release_id, version, release_sequence, published_at, target_migration_version, required_downtime, backup_required, rollback_class, manifest_digest, payload_size]
      properties:
        release_id: {type: string}
        version: {type: string}
        release_sequence: {type: integer, format: int64}
        published_at: {type: string, format: date-time}
        target_migration_version: {type: string}
        required_downtime: {type: boolean}
        backup_required: {type: boolean}
        rollback_class: {type: string}
        manifest_digest: {type: string}
        payload_size: {type: integer, format: int64}
    UpdateCompatibility:
      type: object
      additionalProperties: false
      required: [kind, min_image_version, reason]
      properties:
        kind:
          type: string
          enum: [overlay, base_image_required, incompatible]
        min_image_version: {type: string}
        reason: {type: string}
    EmbeddedUpdateStatus:
      type: object
      additionalProperties: false
      required: [operation_id, channel, step, target_release_id, created_at, updated_at]
      properties:
        operation_id:
          type: string
        channel:
          type: string
          description: Update channel that admitted the operation (embedded).
        step:
          type: string
          description: Durable step of the embedded update state machine.
        target_release_id:
          type: string
        target_version:
          type: string
        target_schema_version:
          type: string
        last_error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AutomationDispatchRun:
      type: object
      additionalProperties: false
      required: [id, kind, trigger, state, target_count, enqueued_count, merged_count, skipped_count, dispatch_error_count, retention_until]
      properties:
        id:
          $ref: '#/components/schemas/ID'
        kind:
          $ref: '#/components/schemas/AutomationKind'
        trigger:
          $ref: '#/components/schemas/AutomationTrigger'
        state:
          $ref: '#/components/schemas/AutomationState'
        target_count:
          type: integer
          minimum: 0
        enqueued_count:
          type: integer
          minimum: 0
        merged_count:
          type: integer
          minimum: 0
        skipped_count:
          type: integer
          minimum: 0
        dispatch_error_count:
          type: integer
          minimum: 0
        started_at:
          type: string
          nullable: true
          format: date-time
        finished_at:
          type: string
          nullable: true
          format: date-time
        retention_until:
          type: string
          format: date-time
    SubscriptionLogDetails:
      type: object
      additionalProperties: false
      properties:
        reason_code:
          type: string
          minLength: 1
          maxLength: 128
        reason_detail:
          type: string
          minLength: 1
          maxLength: 2048
        item_count:
          type: integer
          minimum: 0
        error_count:
          type: integer
          minimum: 0
        verdict:
          type: string
          minLength: 1
          maxLength: 64
        metadata_missing:
          type: array
          uniqueItems: true
          description: >-
            Which metadata bindings held a release evaluation (verdict
            waiting_metadata): the same missing set as MetadataHold at the time
            of the evaluation. Absent on every other record and on records
            written before it was introduced.
          items:
            type: string
            enum: [bgm, tmdb]
        evaluation_version:
          type: string
          minLength: 1
          maxLength: 128
        episode_state:
          type: string
          enum: [resolved, unresolved, invalid, unsupported, conflict]
        episode_shape:
          type: string
          enum: [single, range, list, season_only, special, unknown]
        parser:
          allOf:
            - $ref: '#/components/schemas/ParserProvenance'
          nullable: true
          description: >-
            The frozen selected-parser evidence of a release evaluation. It is
            the same value frozen into the media facts, the download policy, and
            the FileOperation config snapshot; ordinary read models show the
            parser name/result status only, never a raw internal row id.
        group_name:
          type: string
          minLength: 1
          maxLength: 256
          description: >-
            Display name of the subgroup the record is about, frozen at write
            time: the RSS source group of a download run step (download,
            verification, file result, placement, replacement, settlement) or
            of an RSS source policy change. Absent on records written before it
            was introduced.
        episodes:
          type: array
          maxItems: 500
          description: >-
            Episode numbers of a download run step, ascending and unique: the
            frozen batch plan of the release's media fact snapshot (the same
            projection the execution records use). Absent when the plan covers
            no numbered TV episode.
          items:
            type: integer
            minimum: 0
        release_title:
          type: string
          minLength: 1
          maxLength: 1024
          description: The torrent title of a download run step's release.
        size_bytes:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Byte size of the step's subject: the torrent's file list total for
            download and verification steps, the file for a file result.
        file_name:
          type: string
          minLength: 1
          maxLength: 1024
          description: Base name of the file a file result or placement step is about.
        library_folder:
          type: string
          minLength: 1
          maxLength: 1024
          description: >-
            The last two directory levels of the library target of a file
            result or placement (for example "Title/Season 2"), without the
            private root.
        version_count:
          type: integer
          minimum: 0
          description: >-
            Replacement result: the number of versions of the episode kept after
            the decision, written only when the candidate is already placed and
            no version was replaced.
        replaced_files:
          type: array
          maxItems: 64
          description: Replacement result, verdict replace - base names of the versions the candidate replaces.
          items:
            type: string
            minLength: 1
            maxLength: 1024
        kept_file:
          type: string
          minLength: 1
          maxLength: 1024
          description: Replacement result, verdict keep/retain - base name of the existing version kept.
        changed_sections:
          type: array
          uniqueItems: true
          description: >-
            Settings change: which rules sections the save actually changed,
            compared with the stored values in the same transaction.
          items:
            type: string
            enum: [parser, release_rules, file_rules, naming_rules, file_effect, tag_filters]
    SubscriptionLogEntry:
      type: object
      additionalProperties: false
      required: [id, subscription_id, managed_anime_id, kind, outcome, occurred_at, title, summary, dedupe_key, retention_until]
      properties:
        id:
          $ref: '#/components/schemas/ID'
        subscription_id:
          $ref: '#/components/schemas/ID'
        managed_anime_id:
          $ref: '#/components/schemas/ID'
        kind:
          $ref: '#/components/schemas/SubscriptionLogKind'
        outcome:
          $ref: '#/components/schemas/SubscriptionLogOutcome'
        occurred_at:
          type: string
          format: date-time
        title:
          type: string
          minLength: 1
          maxLength: 256
        summary:
          type: string
          minLength: 1
          maxLength: 2048
        rss_source_id:
          allOf:
            - $ref: '#/components/schemas/ID'
          nullable: true
        release_id:
          allOf:
            - $ref: '#/components/schemas/ID'
          nullable: true
        group_ref:
          type: string
          nullable: true
          minLength: 1
          maxLength: 256
        details:
          allOf:
            - $ref: '#/components/schemas/SubscriptionLogDetails'
          nullable: true
        reason_code:
          type: string
          nullable: true
          minLength: 1
          maxLength: 128
          description: Owner-first stable reason code persisted with the record; never derived at read time.
        subject_type:
          type: string
          nullable: true
          minLength: 1
          maxLength: 128
        subject_id:
          type: string
          nullable: true
          minLength: 1
          maxLength: 128
        subject_version:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        correlation_id:
          type: string
          nullable: true
          minLength: 1
          maxLength: 128
        causation_type:
          type: string
          nullable: true
          minLength: 1
          maxLength: 128
        causation_id:
          type: string
          nullable: true
          minLength: 1
          maxLength: 128
        dedupe_key:
          type: string
          minLength: 1
          maxLength: 512
        retention_until:
          type: string
          format: date-time
    SubgroupScoreEntry:
      type: object
      additionalProperties: false
      required: [provider, group_ref, display_name, selection_mode, effective_selected, score, count_in_limit]
      properties:
        provider:
          $ref: '#/components/schemas/ProviderKind'
        group_ref:
          type: string
          minLength: 1
          maxLength: 256
        display_name:
          type: string
          minLength: 1
          maxLength: 256
        selection_mode:
          $ref: '#/components/schemas/SelectionMode'
        manual_selected:
          type: boolean
          nullable: true
        effective_selected:
          type: boolean
        score:
          type: integer
          minimum: 1
          maximum: 100
        count_in_limit:
          type: boolean
    SubgroupsSection:
      type: object
      additionalProperties: false
      required: [max_rss, entries]
      properties:
        max_rss:
          type: integer
          minimum: 0
        entries:
          type: array
          items:
            $ref: '#/components/schemas/SubgroupScoreEntry'
        provider_defaults:
          $ref: '#/components/schemas/ProviderGroupDefaults'
        name_keywords:
          $ref: '#/components/schemas/ProviderNameKeywordRules'
    SubgroupGroupCandidateSource:
      type: string
      description: >-
        Which layer of the subgroup dictionary an entry belongs to. collected is
        the snapshot published with the release: reference data that is read
        only and cannot be removed. user is an entry a user retrieved from the
        provider and added; those entries can be removed.
      enum: [collected, user]
    SubgroupGroupCandidate:
      type: object
      additionalProperties: false
      required: [provider, group_ref, display_name, source, available]
      properties:
        provider:
          $ref: '#/components/schemas/ProviderKind'
        group_ref:
          type: string
          maxLength: 256
          description: >-
            The provider's own subgroup key: the Mikan numeric id or the AniBT
            slug. This is the value the subgroup list stores; the display name
            is never stored.
        display_name:
          type: string
          maxLength: 256
          description: >-
            The display name the provider publishes for this key. It is empty
            when the provider publishes none, which is the case for a retired
            Mikan subgroup id; the client then renders the key alone.
        source:
          $ref: '#/components/schemas/SubgroupGroupCandidateSource'
        available:
          type: boolean
          description: >-
            Whether the provider serves the group: a live read for a retrieved
            entry, the liveness observed at the snapshot for a collected one. A
            candidate that is not available is reported, not hidden, so a
            retired Mikan id remains selectable evidence rather than silently
            disappearing.
    SubgroupGroupCandidateList:
      type: object
      additionalProperties: false
      required: [candidates]
      properties:
        candidates:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/SubgroupGroupCandidate'
    SubgroupGroupCandidatePage:
      type: object
      additionalProperties: false
      required: [candidates, next_offset, total]
      properties:
        candidates:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/SubgroupGroupCandidate'
        next_offset:
          type: integer
          minimum: 0
          nullable: true
          description: >-
            The offset of the following page, or null when this page is the
            last.
        total:
          type: integer
          minimum: 0
          description: >-
            How many entries the listing matches across all pages.
    SubgroupGroupRetrievalInput:
      type: object
      additionalProperties: false
      required: [provider, query]
      properties:
        provider:
          $ref: '#/components/schemas/ProviderKind'
        query:
          type: string
          minLength: 1
          maxLength: 256
          description: >-
            A provider group key (Mikan numeric id, AniBT slug) or the URL of a
            provider group page. A free-form name is refused.
    ParserRules:
      type: object
      additionalProperties: false
      required: [episode_patterns]
      properties:
        episode_patterns:
          type: array
          items:
            type: string
    RegexFilter:
      type: object
      additionalProperties: false
      required: [must_contain, not_in]
      description: >-
        go-re2-v1 search matching with one pattern per field. Empty means
        unrestricted; not_in takes precedence. Case is controlled only by
        inline flags such as (?i). Invalid or over-budget patterns are rejected.
        Each pattern is bounded to 4096 UTF-8 bytes (not Unicode characters).
        Separate policy instances match the exact release title (8192 bytes
        maximum) or the filename of a first-level video (the part after the last
        separator of the torrent-relative path; never a directory, the torrent
        name, or an OS absolute source path). A file rule containing "/"
        is rejected on save with the typed validation code
        FILE_RULE_PATH_SEPARATOR. File rules do not apply to subtitles, which
        follow a selected video by filename prefix; files below the first level
        and files that are neither video nor subtitle are never processed.
        File policies only select organization: no selected video means no
        download; partial selection downloads and verifies the complete torrent
        inventory. No manual file selection or filter override is part of this
        shape.
      properties:
        must_contain:
          type: string
        not_in:
          type: string
    ReleaseFilterRules:
      $ref: '#/components/schemas/RegexFilter'
    FileFilterRules:
      $ref: '#/components/schemas/RegexFilter'
    NamingVariant:
      type: object
      additionalProperties: false
      required: [directory_template, video_filename_template]
      properties:
        directory_template:
          type: string
          description: >-
            Directory template body. A template value is the body of one
            JavaScript template literal — the text as it reads between the
            backticks, `${...}` interpolations included; the server supplies
            the enclosing backticks. A backtick outside an interpolation is
            refused (TEMPLATE_COMPILE_ERROR); write a literal one as \\`.
        video_filename_template:
          type: string
          description: >-
            Video filename template body, written like directory_template
            (interpolations included, no outer backticks).
    NamingRules:
      type: object
      additionalProperties: false
      required: [language, tv, movie, unknown, subtitle_suffix_template]
      properties:
        language:
          type: string
          enum: [js-naming-1]
          description: Naming template language. js-naming-1 reads the unified fact vocabulary; every template value is the body of one JavaScript template literal, without the outer backticks.
        unknown:
          $ref: '#/components/schemas/NamingVariant'
        tv:
          $ref: '#/components/schemas/NamingVariant'
        movie:
          $ref: '#/components/schemas/NamingVariant'
        subtitle_suffix_template:
          type: string
          description: Suffix-only template body attached to the bound video basename; empty keeps the video basename unchanged.
        preset:
          type: string
          description: >-
            Legacy reference kept for stored values; it never changes
            evaluation because the concrete tv/movie/subtitle templates are
            always authoritative. Naming templates do not set it and nothing
            links an anime value to a template.
    NamingTemplate:
      type: object
      additionalProperties: false
      required: [key, name, rules]
      properties:
        key:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
          description: Stable key, chosen by the client when the template is added.
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Display name, unique in the library after trimming.
        rules:
          $ref: '#/components/schemas/NamingRules'
    NamingTemplateLibraryView:
      type: object
      additionalProperties: false
      required: [default_key, templates, version]
      properties:
        default_key:
          type: string
          description: Key of the default template, whose body is the global naming.
        templates:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/NamingTemplate'
        version:
          type: integer
          format: int64
          minimum: 1
    NamingTemplateLibraryInput:
      type: object
      additionalProperties: false
      required: [default_key, templates]
      properties:
        default_key:
          type: string
        templates:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/NamingTemplate'
    FileEffectRules:
      type: object
      additionalProperties: false
      required: [operation, collision_policy]
      properties:
        operation:
          type: string
          enum: [copy, move, hardlink]
        collision_policy:
          $ref: '#/components/schemas/CollisionPolicy'
    ParserRulesReplace:
      type: object
      additionalProperties: false
      required: [mode, value]
      properties:
        mode: { type: string, enum: [replace] }
        value: { $ref: '#/components/schemas/ParserRules' }
    ParserRulesOverride:
      oneOf:
        - $ref: '#/components/schemas/ParserRulesReplace'
    ReleaseFilterRulesReplace:
      type: object
      additionalProperties: false
      required: [mode, value]
      properties:
        mode: { type: string, enum: [replace] }
        value: { $ref: '#/components/schemas/ReleaseFilterRules' }
    ReleaseFilterRulesOverride:
      oneOf:
        - $ref: '#/components/schemas/ReleaseFilterRulesReplace'
    FileFilterRulesReplace:
      type: object
      additionalProperties: false
      required: [mode, value]
      properties:
        mode: { type: string, enum: [replace] }
        value: { $ref: '#/components/schemas/FileFilterRules' }
    FileFilterRulesOverride:
      oneOf:
        - $ref: '#/components/schemas/FileFilterRulesReplace'
    NamingRulesReplace:
      type: object
      additionalProperties: false
      required: [mode, value]
      properties:
        mode: { type: string, enum: [replace] }
        value: { $ref: '#/components/schemas/NamingRules' }
    NamingRulesOverride:
      oneOf:
        - $ref: '#/components/schemas/NamingRulesReplace'
    FileEffectRulesReplace:
      type: object
      additionalProperties: false
      required: [mode, value]
      properties:
        mode: { type: string, enum: [replace] }
        value: { $ref: '#/components/schemas/FileEffectRules' }
    FileEffectRulesOverride:
      oneOf:
        - $ref: '#/components/schemas/FileEffectRulesReplace'
    TagFilterRow:
      type: object
      additionalProperties: false
      required: [require, exclude]
      description: >-
        One independent tag filter row. Require tags group by dimension: any
        one tag satisfies its dimension (OR) and every named dimension must be
        satisfied (AND); an empty require list constrains nothing, and a non-empty
        one fails a release without any tag. A release carrying any exclude
        tag is filtered. A tag may not appear in both lists. Tags are
        "dimension:value"; matching is case-insensitive on the trimmed text and
        independent of any vocabulary.
      properties:
        require:
          $ref: '#/components/schemas/TagFilterTags'
        exclude:
          $ref: '#/components/schemas/TagFilterTags'
    TagFilterTags:
      type: array
      maxItems: 64
      items:
        type: string
        minLength: 3
        maxLength: 160
        pattern: '^[a-z_]+:\S(.*\S)?$'
    TagFilterRules:
      type: object
      additionalProperties: false
      required: [anibt, title]
      description: >-
        The tag_filters rules section (schema tag-filters-v2). anibt applies
        to AniBT-source releases only; its dimensions are resolution,
        subtitle, language, format, then codec, bitdepth, audio, source,
        platform and subformat (AniBT customTag values split by the server's
        classification table) and tag (every other customTag value). A
        `tag:<value>` entry whose value the table lists is read, matched and
        returned as its sub-dimension. title is the
        title-parse row: it applies to every release, AniBT ones included, and
        matches the non-episode attributes the pinned reltitle parser reads
        from the release title (dimensions and values from
        getTitleTagVocabulary; a write outside that vocabulary is rejected).
        Both rows run at Release evaluation before release_filter, AniBT row
        first; every row must pass. Default: two empty rows.
      properties:
        anibt:
          $ref: '#/components/schemas/TagFilterRow'
        title:
          $ref: '#/components/schemas/TagFilterRow'
    TagFilterRulesReplace:
      type: object
      additionalProperties: false
      required: [mode, value]
      properties:
        mode: { type: string, enum: [replace] }
        value: { $ref: '#/components/schemas/TagFilterRules' }
    TagFilterRulesOverride:
      oneOf:
        - $ref: '#/components/schemas/TagFilterRulesReplace'
    DownloadCompletionAction:
      type: string
      enum: [seed, pause, remove, remove_with_data]
    DownloadCompletionRules:
      type: object
      additionalProperties: false
      required: [action]
      description: >-
        The Global download_completion setting (schema download-completion-v2),
        edited only in the settings page; there is no per-anime override and no
        draft field. It decides what happens to the qBittorrent task after an
        acquisition succeeded and all its file operations are terminal. seed
        keeps the task running (the default). pause stops it, keeping task and
        files. remove deletes the task and keeps its files. remove_with_data
        asks qBittorrent to delete the task together with the task's own files;
        unclassified files, kinds the product does not process and files in
        sub-folders go with it. remove_with_data refuses when it cannot prove no
        media-library file lies inside the task's content. seed may carry
        seed_limits, which are written to qBittorrent once at completion;
        qBittorrent applies them, the product runs no timer. The value is
        resolved and frozen when the release is accepted; a later edit never
        changes an accepted acquisition. Only a succeeded acquisition acts; a
        failed one keeps its task so a retry can adopt it again.
      properties:
        action:
          $ref: '#/components/schemas/DownloadCompletionAction'
        seed_limits:
          $ref: '#/components/schemas/DownloadCompletionSeedLimits'
    DownloadCompletionSeedLimits:
      type: object
      additionalProperties: false
      required: [at_limit]
      description: >-
        Optional share limits of the seed action; allowed only with action
        seed and at least one limit must be set. At completion the product sets
        them on the qBittorrent task (torrents/setShareLimits) and detaches.
        at_limit is sent as the task's own limit action only when the
        qBittorrent WebAPI is 2.12.0 or newer; on an older qBittorrent the
        limits are set and qBittorrent's global limit action applies (result
        seed_limits_set_global_action). remove_with_data runs the same library
        safety check as the remove_with_data action when the limits are set and
        refuses with its typed code.
      properties:
        seeding_time_minutes:
          type: integer
          format: int64
          minimum: 1
          maximum: 525600
        ratio:
          type: number
          format: double
          minimum: 0.01
          maximum: 9998
        at_limit:
          type: string
          enum: [stop, remove, remove_with_data]
    AniBTTagFacts:
      type: object
      additionalProperties: false
      required: [tags]
      description: >-
        The AniBT structured tags frozen when the release was observed
        through an AniBT source. An empty list is a real fact (no tags);
        diagnostic explains why (anibt_namespace_legacy,
        anibt_namespace_absent, anibt_tags_absent, anibt_tag_value_dropped).
      properties:
        schema:
          type: string
          description: anibt-rss-1.0 when the current AniBT namespace was recognized.
        tags:
          type: array
          items:
            type: string
        diagnostic:
          type: string
    TitleTagFacts:
      type: object
      additionalProperties: false
      required: [schema, implementation, tags]
      description: >-
        The title-parse tags frozen when the release was observed, with the
        parser that read them. An empty list is a real fact; diagnostic
        (reltitle_unavailable, reltitle_parse_failed) explains a failed read.
      properties:
        schema:
          type: string
          description: >-
            reltitle-attrs-v1. The block also freezes the reltitle title,
            group and release version for the reltitle naming namespace; they
            are not filter tags and are not listed here.
        implementation:
          type: string
          description: Pinned parser, "reltitle@<commit>".
        config_digest:
          type: string
          description: '"lexicon:sha256:<hex>" over the embedded dictionary bundle.'
        tags:
          type: array
          items:
            type: string
        diagnostic:
          type: string
    TitleTagVocabulary:
      type: object
      additionalProperties: false
      required: [implementation, config_digest, dimensions]
      description: >-
        The title-parse row vocabulary: every dimension and canonical value
        of the pinned reltitle dictionary, in dictionary order.
      properties:
        implementation:
          type: string
        config_digest:
          type: string
        dimensions:
          type: array
          items:
            $ref: '#/components/schemas/TitleTagDimension'
    TitleTagDimension:
      type: object
      additionalProperties: false
      required: [dimension, values]
      properties:
        dimension:
          type: string
        values:
          type: array
          items:
            type: string
    RulesSections:
      type: object
      additionalProperties: false
      description: >-
        Per-anime rules sections, each a complete replace value; there is no
        inherit mode and nothing follows Global. An owner rules write requires
        parser, release_filter, file_filter, naming and file_effect
        (OVERRIDE_MODE_INVALID otherwise); an absent tag_filters keeps the
        stored value, and the owner read always returns all six. A draft may
        leave sections absent until load_business_preset copies the Global
        default into them; preview, save, subscribe and one-shot refuse a
        draft whose sections are still absent. A saved revision keeps
        tag_filters in its draft body (the frozen effective sections and
        business snapshot stay the five other rules sections plus subgroups),
        and subscribing stores it (the built-in default when the draft has
        none).
      properties:
        tag_filters:
          $ref: '#/components/schemas/TagFilterRulesOverride'
        parser:
          $ref: '#/components/schemas/ParserRulesOverride'
        release_filter:
          $ref: '#/components/schemas/ReleaseFilterRulesOverride'
        file_filter:
          $ref: '#/components/schemas/FileFilterRulesOverride'
        naming:
          $ref: '#/components/schemas/NamingRulesOverride'
        file_effect:
          $ref: '#/components/schemas/FileEffectRulesOverride'
    RulesDraft:
      type: object
      additionalProperties: false
      required: [sections]
      properties:
        sections:
          $ref: '#/components/schemas/RulesSections'
    AnimeDraft:
      type: object
      additionalProperties: false
      required: [origin, title, metadata, subgroups, rules, rss_sources]
      properties:
        business:
          $ref: '#/components/schemas/BusinessSnapshot'
        business_digest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
        origin:
          $ref: '#/components/schemas/SubscriptionOrigin'
        origin_entry_ref:
          type: string
          nullable: true
          minLength: 1
          maxLength: 256
        title:
          type: string
          minLength: 1
          maxLength: 512
        title_override:
          type: string
          nullable: true
          minLength: 1
          maxLength: 512
        instance_label:
          type: string
          nullable: true
          minLength: 1
          maxLength: 256
        new_releases_only:
          type: boolean
          description: >-
            New releases only (只获取新种子), default false (absent). Subscribe
            freezes it onto the instance with the creation time as baseline:
            releases published before that, or without a publish time, take
            the terminal verdict start_baseline. Releases published while the
            instance is pending count as new.
        metadata:
          $ref: '#/components/schemas/AnimeMetadataDraft'
        subgroups:
          $ref: '#/components/schemas/SubgroupsSection'
        rules:
          $ref: '#/components/schemas/RulesDraft'
        rss_sources:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/RSSSourceDraft'
    CustomSnapshotFetchInput:
      type: object
      additionalProperties: false
      required: [candidate_id, revision, expected_version]
      properties:
        candidate_id:
          $ref: '#/components/schemas/ID'
        revision:
          $ref: '#/components/schemas/Version'
        expected_version:
          $ref: '#/components/schemas/Version'
    RSSListObservationRef:
      type: object
      additionalProperties: false
      required: [provider, provider_entry_ref, snapshot_version]
      description: >-
        One persisted provider group observation: the snapshot group discovery
        wrote for a catalog entry, identified by its version.
      properties:
        provider:
          type: string
          enum: [anibt, mikan]
        provider_entry_ref:
          type: string
          minLength: 1
          maxLength: 256
        snapshot_version:
          $ref: '#/components/schemas/Version'
    RSSListObservation:
      type: object
      additionalProperties: false
      required: [state, provider, provider_entry_ref, snapshot_version, group_count]
      description: The observation an RSS list view was composed with.
      properties:
        state:
          type: string
          enum: [used, not_retained]
          description: >-
            used: its groups are listed. not_retained: the version was purged or
            never existed; ask for a fresh discovery.
        provider:
          type: string
          enum: [anibt, mikan]
        provider_entry_ref:
          type: string
          minLength: 1
          maxLength: 256
        snapshot_version:
          $ref: '#/components/schemas/Version'
        observed_at:
          type: string
          format: date-time
          nullable: true
          description: Present when state is used.
        group_count:
          type: integer
          minimum: 0
          description: Number of groups in the observation; 0 when not retained.
    PreviewFeedSnapshotRef:
      type: object
      additionalProperties: false
      required:
        [provider, provider_entry_ref, provider_group_ref, snapshot_id,
         snapshot_version, content_hash]
      description: >-
        One independently identified provider feed snapshot. The identity is
        snapshot_id + snapshot_version + content_hash; a locator URL is never
        the identity.
      properties:
        provider:
          type: string
          enum: [anibt, mikan, custom]
        provider_entry_ref:
          type: string
          minLength: 1
          maxLength: 256
        provider_group_ref:
          type: string
          minLength: 1
          maxLength: 256
        snapshot_id:
          $ref: '#/components/schemas/ID'
        snapshot_version:
          $ref: '#/components/schemas/Version'
        content_hash:
          type: string
          minLength: 72
          maxLength: 72
          pattern: '^sha256:[0-9a-f]{64}$'
          description: Canonical typed seed-facts digest of the persisted snapshot.
    SubscribeAnimeInput:
      type: object
      additionalProperties: false
      required: [draft]
      properties:
        draft:
          $ref: '#/components/schemas/AnimeDraft'
        start:
          type: boolean
          description: >-
            Start the subscription at once (state active). Omitted or false
            creates it pending (not started) so its configuration can be
            finished first.
    AnimeConfigCandidate:
      type: object
      additionalProperties: false
      description: >-
        A persisted planning draft. It is not a ManagedAnime, Subscription or
        RSSSource: saving one performs no runtime write. activated_managed_anime_id
        is set only by an activation that also created the owner set.
      required:
        [id, origin, origin_entry_ref, title, title_override, instance_label,
         draft, version, activated_managed_anime_id, created_at, updated_at,
         status, draft_digest, current_revision, current_revision_digest,
         last_activity, retention_until, cleanup_eligible_at, cleanup_reason]
      properties:
        id:
          $ref: '#/components/schemas/ID'
        origin:
          $ref: '#/components/schemas/SubscriptionOrigin'
        origin_entry_ref:
          type: string
          nullable: true
          minLength: 1
          maxLength: 256
        title:
          type: string
          minLength: 1
          maxLength: 512
        title_override:
          type: string
          nullable: true
          minLength: 1
          maxLength: 512
        instance_label:
          type: string
          nullable: true
          minLength: 1
          maxLength: 256
        draft:
          $ref: '#/components/schemas/AnimeDraft'
        poster_url:
          type: string
          nullable: true
          description: >-
            Server-local poster proxy path (/api/v1/images/poster/...) for the
            draft's own Bangumi binding (draft.metadata.bgm); null when the draft
            is not BGM-bound. Custom preset cards render it so an unlinked preset
            keeps its poster.
        version:
          $ref: '#/components/schemas/Version'
        activated_managed_anime_id:
          allOf:
            - $ref: '#/components/schemas/ID'
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [working, dormant, archived]
          description: working is the only editable/unlinked lifecycle state.
        draft_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        current_revision:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: Immutable saved revision identity; null means the candidate must be re-saved before execution.
        current_revision_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          nullable: true
          description: Effective digest of current_revision, not the mutable CAS version.
        last_activity:
          type: string
          format: date-time
        retention_until:
          type: string
          format: date-time
          description: Compatibility/read metadata; never cleanup authorization.
        cleanup_eligible_at:
          type: string
          format: date-time
          nullable: true
          description: Explicit local cleanup eligibility; null means the janitor must retain the candidate.
        cleanup_reason:
          type: string
          enum: [user_deleted, provider_owner_retired]
          nullable: true
          description: Explicit cleanup authority paired with cleanup_eligible_at.
    AnimeConfigCandidateList:
      type: object
      additionalProperties: false
      required: [candidates]
      properties:
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/AnimeConfigCandidate'
    SaveAnimeConfigCandidateInput:
      type: object
      additionalProperties: false
      required: [draft]
      properties:
        draft:
          $ref: '#/components/schemas/AnimeDraft'
    PatchAnimeConfigCandidateInput:
      type: object
      additionalProperties: false
      required: [draft]
      properties:
        draft:
          $ref: '#/components/schemas/AnimeDraft'
    MetadataHold:
      type: object
      additionalProperties: false
      required: [held, missing]
      properties:
        held:
          type: boolean
        missing:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [bgm, tmdb]
    BroadcastDay:
      type: string
      description: >-
        Stable broadcast-weekday key, never a display label. The mapping layer
        converts the provider schedule fact onto this vocabulary while the database
        keeps the raw source value: Mikan data-dayofweek 0=周日 … 6=周六 (its
        sections 7 剧场版 and 8 OVA are release formats, not days, and map to
        none); AniBT weekdayLabel 周一 … 周日 with 未定. Custom programs and
        providers without schedule data map to none. Display text belongs to the frontend.
      enum: [mon, tue, wed, thu, fri, sat, sun, tbd, none]
    AnimeListItem:
      type: object
      additionalProperties: false
      required: [managed_anime, subscription, metadata, metadata_hold, broadcast_day]
      properties:
        managed_anime:
          $ref: '#/components/schemas/ManagedAnime'
        subscription:
          $ref: '#/components/schemas/Subscription'
        metadata:
          $ref: '#/components/schemas/AnimeMetadata'
        metadata_hold:
          $ref: '#/components/schemas/MetadataHold'
        subscribed_groups:
          type: array
          description: |
            已订阅的发布组名列表，从 rss_sources 聚合。仅当订阅存在时返回。
          items:
            type: string
        rss_health:
          type: string
          nullable: true
          enum: [ready, degraded, failed]
          description: |
            订阅下所有 RSS 来源中最差的健康状态。null 表示尚无 runtime 数据。
        rss_health_reason:
          type: string
          nullable: true
          description: |
            最差健康状态来源的原因摘要（rss_source_runtime.reason_detail，
            缺失时回退 reason_code）。仅当 rss_health 为 degraded/failed 且
            runtime 行携带原因时返回；用于卡片 hover 提示，不替代执行记录。
        poster_url:
          type: string
          nullable: true
          description: Server-local poster proxy path (/api/v1/images/poster/...), present when the anime has a Bangumi binding.
        cover_url:
          type: string
          nullable: true
          description: |
            Server-local cover proxy path (/api/v1/images/cover/...) for the provider
            catalog cover cached in the latest catalog entry matching the subscription
            origin + origin_entry_ref. Never a third-party URL; null when the entry has
            no cover or its host is not one of the provider's. 已订阅列表卡优先渲染它，
            缺失或加载失败再回退 poster_url；custom 订阅无 provider 封面，该字段为 null。
        broadcast_day:
          $ref: '#/components/schemas/BroadcastDay'
        release_format:
          allOf:
            - $ref: '#/components/schemas/ReleaseFormat'
          description: >-
            Release format stated by the provider catalog entry the subscription
            came from (the latest observed entry for origin + origin_entry_ref).
            Absent when the provider states none and for custom subscriptions.
        episode_progress:
          type: object
          nullable: true
          required: [episodes, done]
          additionalProperties: false
          description: |
            已入库进度：所有完成的文件生效中、偏移后的常规集号升序数组（已排除 special）。
            进度只按数量计：已入库集数 = episodes 的元素个数，与 total 比较；
            不按集号对位，不推导缺集。首集入库前为 null。total 仅在 provider
            目录公布总集数（如 AniBT）时给出。
            done 为读时派生：episodes 非空且 len(episodes) >= total 时为 true。
          properties:
            episodes:
              type: array
              description: |
                已入库的偏移后常规集号数组（升序、去重、排除 special）。
                数组为空表示有完成的文件生效但无可用集号；null 由外层 episode_progress
                为 null 表达。
              items:
                type: integer
                minimum: 0
              uniqueItems: true
            total:
              type: integer
              minimum: 1
            done:
              type: boolean
              description: |
                读时派生（按数量）：episodes 非空且 len(episodes) >= total 时为 true。
                total 为 null 或 0 时为 false。下游自动清理功能可读此字段。
    EffectiveConfigVersions:
      type: object
      additionalProperties: false
      required: [subgroups, parser, release_filter, file_filter, naming, file_effect]
      properties:
        subgroups:
          $ref: '#/components/schemas/Version'
        parser:
          $ref: '#/components/schemas/Version'
        release_filter:
          $ref: '#/components/schemas/Version'
        file_filter:
          $ref: '#/components/schemas/Version'
        naming:
          $ref: '#/components/schemas/Version'
        file_effect:
          $ref: '#/components/schemas/Version'
    SubscribeResult:
      type: object
