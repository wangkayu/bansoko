          type: string
          enum: [directory, video_filename, subtitle_suffix]
        template_source:
          type: string
          maxLength: 4096
          description: >-
            The template body to preview, written like a stored value: the text
            between the backticks with `${...}` interpolations, no outer
            backticks. A value wrapped in its own backticks is refused.
        sample_ref:
          type: string
          description: Optional fixed redacted sample selector from the naming template catalog; omitted uses the default sample.
        language:
          type: string
          enum: [js-naming-1]
          description: Language of template_source; omitted is js-naming-1.
