          enum: [telegram]
        chat_id:
          type: string
          minLength: 1
          maxLength: 256
    FeishuAdapterConfig:
      type: object
      additionalProperties: false
      required: [adapter_kind]
      properties:
        adapter_kind:
          type: string
          enum: [feishu]
    WebhookAdapterConfig:
