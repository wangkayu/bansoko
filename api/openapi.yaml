          nullable: true
        updated_at:
          type: string
          format: date-time
    DiagnosticSeverity:
      type: string
      enum: [warning, error]
    DiagnosticDetailsStatus:
      type: string
      enum: [available, unavailable, invalid]
      description: >-
        Bounded health of the optional details payload. available means the
        stored details decoded into the contract shape; unavailable means the
        episode carries no details; invalid means stored details failed to
        decode and were withheld instead of leaking raw bytes.
    DiagnosticScopeKind:
      type: string
      enum: [global, provider, subscription, rss_source, owner, worker]
    DiagnosticDetails:
      type: object
      additionalProperties: false
      properties:
        reason_code:
          type: string
          maxLength: 128
        reason_detail:
          type: string
          maxLength: 2048
        safe_context:
          type: object
          additionalProperties: false
    DiagnosticEpisode:
      type: object
      additionalProperties: false
      required: [id, severity, component, operation, error_code, scope_kind, scope_id, first_failed_at, last_failed_at, occurrence_count, last_error, details_status, retention_until]
      properties:
        id:
          $ref: '#/components/schemas/ID'
        severity:
          $ref: '#/components/schemas/DiagnosticSeverity'
        component:
          type: string
          minLength: 1
          maxLength: 128
        operation:
          type: string
          minLength: 1
          maxLength: 128
        error_code:
          type: string
          minLength: 1
          maxLength: 128
        scope_kind:
          $ref: '#/components/schemas/DiagnosticScopeKind'
        scope_id:
          type: string
          minLength: 1
          maxLength: 256
        managed_anime_id:
          allOf:
            - $ref: '#/components/schemas/ID'
          nullable: true
        first_failed_at:
          type: string
          format: date-time
        last_failed_at:
          type: string
          format: date-time
        occurrence_count:
          type: integer
          minimum: 1
        last_error:
          type: string
          minLength: 1
          maxLength: 8192
          description: >-
            Bounded diagnostic error text. The storage column allows 8192
            characters, so the contract mirrors that bound; the read boundary
            re-redacts stored text and truncates by runes, and values written
            before the writer's redaction may already have collapsed to the
            redaction marker.
        details:
          allOf:
            - $ref: '#/components/schemas/DiagnosticDetails'
          nullable: true
        details_status:
          $ref: '#/components/schemas/DiagnosticDetailsStatus'
        succeeded_after_at:
          type: string
          format: date-time
          nullable: true
        retention_until:
          type: string
          format: date-time
    ObservabilityRecord:
      description: >-
        Explicit per-contract projection of the four observability record
        sources. Each member is an allowlisted field set: storage-only columns
        such as plugin secret references are never selected, and the transport
        re-projects the stored payload through the typed member so a column
        added later cannot reach a client on its own.
      oneOf:
        - $ref: '#/components/schemas/RoutineRecord'
        - $ref: '#/components/schemas/BusinessRecord'
        - $ref: '#/components/schemas/AutomationRecord'
        - $ref: '#/components/schemas/PluginRecord'
      discriminator:
        propertyName: record_type
        mapping:
          routine: '#/components/schemas/RoutineRecord'
          business: '#/components/schemas/BusinessRecord'
          automation: '#/components/schemas/AutomationRecord'
          plugin: '#/components/schemas/PluginRecord'
    RoutineRecord:
      type: object
      additionalProperties: false
      required: [record_type, routine]
      properties:
        record_type:
          type: string
          enum: [routine]
        routine:
          $ref: '#/components/schemas/RoutineActivity'
    BusinessRecord:
      type: object
      additionalProperties: false
      required: [record_type, entry]
      properties:
        record_type:
          type: string
          enum: [business]
        entry:
          $ref: '#/components/schemas/SubscriptionLogEntry'
    AutomationRecord:
      type: object
      additionalProperties: false
      required: [record_type, run]
      properties:
        record_type:
          type: string
          enum: [automation]
        run:
          $ref: '#/components/schemas/AutomationDispatchRun'
    PluginRecord:
      type: object
      additionalProperties: false
      required: [record_type, delivery]
      properties:
        record_type:
          type: string
          enum: [plugin]
        delivery:
          $ref: '#/components/schemas/PluginDelivery'
    ObservabilityRecordPage:
      type: object
      additionalProperties: false
      required: [records]
      properties:
        records:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ObservabilityRecord'
        next_cursor:
          type: string
          nullable: true
          maxLength: 512
    DiagnosticEpisodePage:
      type: object
      additionalProperties: false
      required: [episodes]
      properties:
