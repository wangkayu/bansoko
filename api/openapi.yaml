        path:
          type: string
          pattern: '^([a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*){1,2}|[A-Z][A-Za-z0-9]*(\.[A-Za-z][A-Za-z0-9]*)+)$'
        label:
          type: string
        type:
          type: string
          enum: [string, integer, number, boolean, timestamp, list]
        nullable:
          type: boolean
        source:
          type: string
          minLength: 1
        sample_value:
          type: string
          nullable: true
        description:
          type: string
        phase:
          $ref: '#/components/schemas/TemplateFactPhase'
        label_key:
          type: string
          description: Copy key of the field label.
        description_key:
          type: string
          description: Copy key of the field description.
    NamingCatalogFunction:
      type: object
      additionalProperties: false
      required: [name, signature, description, arguments]
      properties:
        name:
          type: string
          pattern: '^[A-Za-z_$][A-Za-z0-9_$]*$'
        signature:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        arguments:
          type: array
          items:
            type: string
        example:
          type: string
    NamingCatalogShorthand:
      type: object
      additionalProperties: false
      description: >-
        One registered naming shorthand: the token written inside ${...}, the
        js-naming-1 expression it expands to at compile time, and what that
        expansion renders for the documented sample. Recognition is exact —
        only a whole ${name} interpolation expands — and an unknown season
        the season composite s00e00 reuses the ep.s00e00 composite semantics (bound season SxxEyy, season-less Eyy, movie empty), and the guarded season shorthands sxe, s00 and s render an empty string.
      required: [name, expansion, example]
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9]*$'
        expansion:
          type: string
          minLength: 1
        example:
          type: string
