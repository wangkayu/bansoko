        target_path:
          type: string
        excluded:
          type: boolean
        exclude_reason:
          type: string
        exclude_reason_code:
          type: string
    AcquisitionEntryKind:
      type: string
      enum: [automatic, subscription_add, one_shot]
    AcquisitionRecordState:
      type: string
      enum: [running, succeeded, failed, cancelled]
    AcquisitionRecordOrigin:
      type: string
      enum: [subscription, one_shot]
      description: >-
        Who started the work, derived from entry_kind: automatic and
        subscription_add are subscription, one_shot is one_shot. Every
        entry kind maps to exactly one origin.
    AcquisitionRecordOriginCounts:
      type: object
      additionalProperties: false
      description: >-
        Record totals per origin under the page's anime, state and time
        filters (origin, entry_kind and the cursor do not narrow them), read
        in the same snapshot as the page.
      required: [subscription, one_shot]
      properties:
        subscription:
          type: integer
          format: int64
          minimum: 0
        one_shot:
          type: integer
          format: int64
          minimum: 0
    AcquisitionStageName:
      type: string
      enum: [submit, download_wait, inspect, plan, file_execution, settlement, completion]
    AcquisitionStageState:
      type: string
      enum: [pending, running, succeeded, failed, blocked, cancelled]
    AcquisitionDisplayValue:
      type: object
      additionalProperties: false
      description: Bounded, redacted display text. A redacted or unavailable value carries no text.
      required: [state]
      properties:
        state:
          type: string
          enum: [visible, redacted, unavailable]
        value:
          type: string
          maxLength: 2048
    AcquisitionCounts:
      type: object
      additionalProperties: false
      required: [total, required, excluded, succeeded, failed]
      properties:
        total:
          type: integer
          format: int64
          minimum: 0
        required:
          type: integer
          format: int64
          minimum: 0
        excluded:
          type: integer
          format: int64
          minimum: 0
        succeeded:
          type: integer
          format: int64
          minimum: 0
        failed:
          type: integer
          format: int64
          minimum: 0
    AcquisitionAnimeLink:
      type: object
      additionalProperties: false
      required: [managed_anime_id, title]
      properties:
        managed_anime_id:
          $ref: '#/components/schemas/ID'
        title:
          type: string
    AcquisitionReleaseLink:
      type: object
      additionalProperties: false
      required: [release_id, title]
      properties:
        release_id:
          $ref: '#/components/schemas/ID'
        title:
          $ref: '#/components/schemas/AcquisitionDisplayValue'
    AcquisitionRecordSummary:
      type: object
      additionalProperties: false
      description: >-
        One execution record row. stage/stage_state name where a running
        record is, or where a terminal record failed; both are absent for a
        success.
      required: [acquisition_id, entry_kind, state, record_detail, accepted_at, source_title]
      properties:
        acquisition_id:
          $ref: '#/components/schemas/ID'
        entry_kind:
          $ref: '#/components/schemas/AcquisitionEntryKind'
        state:
          $ref: '#/components/schemas/AcquisitionRecordState'
        record_detail:
          type: string
          enum: [full, compact]
        accepted_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        source_title:
          $ref: '#/components/schemas/AcquisitionDisplayValue'
        anime:
          $ref: '#/components/schemas/AcquisitionAnimeLink'
        stage:
          $ref: '#/components/schemas/AcquisitionStageName'
        stage_state:
          $ref: '#/components/schemas/AcquisitionStageState'
        reason_code:
          type: string
          minLength: 1
        one_shot_id:
          allOf:
            - $ref: '#/components/schemas/ID'
          nullable: true
          description: >-
            One-shot marker handle, present only when entry_kind is one_shot and
            null for every other entry kind. Use it with the one-shot acquisition
            reads (marker and attempts).
        counts:
          $ref: '#/components/schemas/AcquisitionCounts'
        release:
          $ref: '#/components/schemas/AcquisitionReleaseLink'
        episodes:
          $ref: '#/components/schemas/AcquisitionEpisodes'
        transfer:
          $ref: '#/components/schemas/AcquisitionTransfer'
    AcquisitionEpisodes:
      type: array
      description: >-
        The episode numbers this record places, ascending and unique: the
        coverage of the batch plan frozen with the acquisition's release when
        it was accepted (the plan its files are placed by). Display only; a
        read never re-parses a title or filename. Absent when the plan covers
        no numbered TV episode (a movie, an unrecognized seed) or the frozen
        plan is no longer kept; show the release title instead.
      minItems: 1
      maxItems: 500
      items:
        type: integer
        minimum: 0
    AcquisitionTransfer:
      type: object
      additionalProperties: false
      description: >-
        The downloader's last persisted observation of a running download,
        written by the download sync poll (about once a minute); a read never
        calls the downloader. Present only while the record is at the
        download_wait stage and running, and only once the downloader reported
        a byte count; absent on every other record.
      required: [completed_bytes, total_bytes, observed_at]
      properties:
        completed_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Verified content bytes complete (the progress high-water mark).
        total_bytes:
          type: integer
          format: int64
          minimum: 1
          description: Total content bytes of the torrent.
        download_speed:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Download speed in bytes per second the downloader reported at
            observed_at. Absent when that observation carried none.
        observed_at:
          type: string
          format: date-time
    AcquisitionRecordPage:
      type: object
      additionalProperties: false
      required: [as_of, items, origin_counts]
      properties:
        as_of:
          type: string
          format: date-time
        origin_counts:
          $ref: '#/components/schemas/AcquisitionRecordOriginCounts'
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AcquisitionRecordSummary'
        next_cursor:
          type: string
          minLength: 1
          maxLength: 512
    AcquisitionFailure:
      type: object
      additionalProperties: false
      required: [stage, reason_code]
      properties:
        stage:
          $ref: '#/components/schemas/AcquisitionStageName'
        reason_code:
          type: string
          minLength: 1
        file_ref:
          type: string
          minLength: 1
    AcquisitionOutcome:
      type: object
      additionalProperties: false
      description: The immutable terminal receipt; later evidence never rewrites it.
      required: [outcome, requirements_status, effects_complete, has_confirmed_effect, has_unknown_effect, settled_at]
      properties:
        outcome:
          type: string
          enum: [succeeded, failed, cancelled]
        requirements_status:
          type: string
          enum: [not_reached, incomplete, sealed]
        counts:
          $ref: '#/components/schemas/AcquisitionCounts'
        primary_failure:
          $ref: '#/components/schemas/AcquisitionFailure'
        effects_complete:
          type: boolean
        has_confirmed_effect:
          type: boolean
        has_unknown_effect:
          type: boolean
        settled_at:
          type: string
          format: date-time
    AcquisitionImportRetryResult:
      type: object
      additionalProperties: false
      description: >-
        An accepted import-stage retry. attempt is the import attempt it
        started (the first run is 1); version is the record version after it.
      required: [acquisition_id, attempt, retried_files, reopened_placements, version]
      properties:
        acquisition_id:
          $ref: '#/components/schemas/ID'
        attempt:
          type: integer
          format: int64
          minimum: 2
        retried_files:
          type: integer
          format: int64
          minimum: 0
        reopened_placements:
          type: integer
          format: int64
          minimum: 0
        version:
          type: integer
          format: int64
          minimum: 1
    AcquisitionStage:
      type: object
      additionalProperties: false
      description: >-
        One fixed stage. Only a present stage carries a state; done/total is
        the delivered-of-required file progress of file_execution, whose
        attempts_started counts the import runs (1 plus each accepted import
        retry) and whose started_at is the start of the latest run. The
        completion stage is the download-completion action on the
        qBittorrent task: not_applicable unless the record succeeded and
        downloaded, pending/running while the action is queued, succeeded or
        failed with its result in reason_code (seed_kept, seed_limits_set,
        seed_limits_set_global_action, paused, removed, removed_with_data,
        task_absent, skipped_torrent_shared; or a typed refusal such as
        placement_inside_content).
      required: [stage, availability]
      properties:
        stage:
          $ref: '#/components/schemas/AcquisitionStageName'
        availability:
          type: string
          enum: [present, not_reached, not_applicable]
        state:
          $ref: '#/components/schemas/AcquisitionStageState'
        reason_code:
          type: string
          minLength: 1
        attempts_started:
          type: integer
          format: int64
          minimum: 1
        started_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        done:
          type: integer
          format: int64
          minimum: 0
        total:
          type: integer
          format: int64
          minimum: 0
    AcquisitionRequirements:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [not_reached, incomplete, sealed]
        file_count:
          type: integer
          format: int64
          minimum: 0
        required_count:
          type: integer
          format: int64
          minimum: 0
        excluded_count:
          type: integer
          format: int64
          minimum: 0
    AcquisitionRecordDetail:
      type: object
      additionalProperties: false
      description: >-
        Stable detail of one execution record. A compact record has no stages
        or requirements and no file page; it keeps its safe title and outcome.
      required: [acquisition_id, version, entry_kind, execution_branch, state, record_detail, accepted_at, as_of, source_title, stages, files_available, import_retry_available]
      properties:
        acquisition_id:
          $ref: '#/components/schemas/ID'
        version:
          type: integer
          format: int64
          minimum: 1
          description: The record version; an import retry sends it as If-Match.
        import_retry_available:
          type: boolean
          description: >-
            True when POST /acquisitions/{acquisition_id}/import/retry would be
            accepted as of this read: the record has settled, its import stage
            has a failed file or a failed placement handoff, and its owner is
            not retired.
        entry_kind:
          $ref: '#/components/schemas/AcquisitionEntryKind'
        execution_branch:
          type: string
          enum: [download]
        state:
          $ref: '#/components/schemas/AcquisitionRecordState'
        record_detail:
          type: string
          enum: [full, compact]
        accepted_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        compacted_at:
          type: string
          format: date-time
        compact_reason:
          type: string
          enum: [detail_expired, owner_cleanup]
        as_of:
          type: string
          format: date-time
        source_title:
          $ref: '#/components/schemas/AcquisitionDisplayValue'
        anime:
          $ref: '#/components/schemas/AcquisitionAnimeLink'
        release:
          $ref: '#/components/schemas/AcquisitionReleaseLink'
        stage:
          $ref: '#/components/schemas/AcquisitionStageName'
        stage_state:
          $ref: '#/components/schemas/AcquisitionStageState'
        reason_code:
          type: string
          minLength: 1
        one_shot_id:
          allOf:
            - $ref: '#/components/schemas/ID'
          nullable: true
          description: >-
            One-shot marker handle, present only when entry_kind is one_shot and
            null for every other entry kind. Use it with the one-shot acquisition
            reads (marker and attempts).
        outcome:
          $ref: '#/components/schemas/AcquisitionOutcome'
        stages:
          type: array
          maxItems: 7
          items:
            $ref: '#/components/schemas/AcquisitionStage'
        requirements:
          $ref: '#/components/schemas/AcquisitionRequirements'
        files_available:
          type: boolean
        episodes:
          $ref: '#/components/schemas/AcquisitionEpisodes'
        transfer:
          $ref: '#/components/schemas/AcquisitionTransfer'
    AcquisitionFile:
      type: object
      additionalProperties: false
      required: [ordinal, file_ref, relative_path, size_bytes, media_kind, requirement]
      properties:
        ordinal:
          type: integer
          format: int64
          minimum: 0
        file_ref:
          type: string
          minLength: 1
        relative_path:
          $ref: '#/components/schemas/AcquisitionDisplayValue'
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        media_kind:
          type: string
          enum: [video, subtitle, other]
        requirement:
          type: string
          enum: [required, excluded]
        selection_reason_code:
          type: string
          minLength: 1
        operation:
          $ref: '#/components/schemas/AcquisitionFileOperation'
        delivery:
          $ref: '#/components/schemas/AcquisitionFileDelivery'
        handoff:
          $ref: '#/components/schemas/AcquisitionFileHandoff'
        placement_failure:
          $ref: '#/components/schemas/AcquisitionFilePlacementFailure'
        placement_end:
          $ref: '#/components/schemas/AcquisitionFilePlacementEnd'
        placed_path:
          description: >-
            Where the file was placed: the final object its successful
            delivery recorded (after any version suffix the collision setting
            added), shown relative to the library. The server has no
            configured library root, so the root is the deepest folder
            holding the anime's current files and this page's placed paths,
            raised so every path keeps its last three segments (anime folder /
            season folder / file). Credential, URL and other secret markers
            still redact the value whole. Absent until the delivery succeeded.
          allOf:
            - $ref: '#/components/schemas/AcquisitionDisplayValue'
        collision_outcome:
          type: string
          enum: [none, skipped, versioned, overwritten]
          description: >-
            How the target collision setting played out for this file, derived
            only from facts its plan and publication recorded: none (published
            under skip without replacing anything, or under version at the
            target itself), skipped (refused because the target held another
            file under the skip setting), versioned (published under version
            at a suffixed path), overwritten (published under overwrite and the
            publication recorded the replaced file). Absent when the recorded
            facts do not say: not delivered yet, kept or adopted in place,
            another failure, or an older record without the proof.
    AcquisitionFilePlacementEnd:
      type: object
      additionalProperties: false
      description: >-
        Present when the placement this file's operation produced has ended:
        `superseded` (a better version replaced it) or `displaced` (another
        file took its path under the overwrite setting, cause `overwrite`, or
        the user downloaded the episode again, cause `redownload`). successor
        is the instance of the placement that displaced it, absent when that
        instance was deleted.
      required: [state]
      properties:
        state:
          type: string
          enum: [superseded, displaced]
        cause:
          type: string
          enum: [overwrite, redownload]
        successor:
          $ref: '#/components/schemas/AcquisitionAnimeLink'
    AcquisitionFilePlacementFailure:
      type: object
      additionalProperties: false
      description: >-
        Present when the file's completed operation has a terminally failed
        placement handoff. An import retry of the record reopens it.
        reason_code is the handoff's stable reason, when recorded.
      required: [attempts]
      properties:
        attempts:
          type: integer
          format: int64
          minimum: 0
        reason_code:
          type: string
          minLength: 1
          maxLength: 128
    AcquisitionFileOperation:
      type: object
      additionalProperties: false
      required: [state, operation]
      properties:
        state:
          type: string
          enum: [pending, running, completed, waiting_retry, failed]
        operation:
          type: string
          minLength: 1
        reason_code:
          type: string
          minLength: 1
    AcquisitionFileDelivery:
      type: object
      additionalProperties: false
      required: [outcome, effect_class, source_cleanup]
      properties:
        outcome:
          type: string
          enum: [succeeded, failed]
        completion_mode:
          type: string
          enum: [executed, adopted, retain]
        effect_class:
          type: string
          enum: [unknown, no_external_effect, confirmed]
        source_cleanup:
          type: string
          enum: [not_required, completed, failed, uncertain]
        reason_code:
          type: string
          minLength: 1
    AcquisitionFileHandoff:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          type: string
          enum: [pending, adopted, skipped, failed]
        reason_code:
          type: string
          minLength: 1
    AcquisitionFilePage:
      type: object
      additionalProperties: false
      required: [acquisition_id, as_of, items]
      properties:
        acquisition_id:
          $ref: '#/components/schemas/ID'
        as_of:
          type: string
          format: date-time
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AcquisitionFile'
        next_cursor:
          type: string
          minLength: 1
          maxLength: 512
    ReleaseCandidateFactsView:
      type: object
      additionalProperties: false
      required: [release_id, release_version, parser_version, input_fingerprint, facts, coverage_keys]
      properties:
        release_id:
          $ref: '#/components/schemas/ID'
        release_version:
          type: integer
          minimum: 1
        parser_version:
          type: string
        input_fingerprint:
          type: string
        raw_evidence:
          type: object
        facts:
          type: object
        coverage_keys:
          type: array
          items:
            type: string
        resolution:
          type: string
          nullable: true
        revision:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
        language:
          type: string
          nullable: true
        group:
          type: string
          nullable: true
        size_bytes:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
    ReleaseTorrentStructureView:
      type: object
      additionalProperties: false
      required:
        [name, torrent_version, total_size, file_count, files, truncated]
      description: >-
        The one-level structure of one retained torrent payload. Paths are
        relative to the torrent root (the payload's own name is in `name`), so
        a client groups them by their first component. Files beyond the
        documented limit are omitted and `truncated` says so; `file_count`
        always counts the whole payload.
      properties:
        name:
          type: string
        torrent_version:
          type: string
          enum: [v1, v2, hybrid]
        info_hash_v1:
          type: string
          nullable: true
        info_hash_v2:
          type: string
          nullable: true
        total_size:
          type: integer
          format: int64
          minimum: 0
        file_count:
          type: integer
          minimum: 0
        files:
          type: array
          maxItems: 2000
          items:
            $ref: '#/components/schemas/ReleaseTorrentStructureFile'
        truncated:
          type: boolean
    ReleaseTorrentStructureFile:
      type: object
      additionalProperties: false
      required: [path, size_bytes]
      properties:
        path:
          type: string
          description: Path relative to the torrent root.
        size_bytes:
          type: integer
          format: int64
          minimum: 0
    QBittorrentTorrent:
      type: object
      additionalProperties: false
      required: [hash, name, state, progress, size, origin]
      description: >-
        Operational view of a qBittorrent torrent. Passthrough from the qB
        WebUI; does not represent DownloadTask owner truth.
      properties:
        hash:
          type: string
        name:
          type: string
        state:
          type: string
          description: qBittorrent raw state string (e.g. downloading, pausedDL).
        progress:
          type: number
          format: double
          minimum: 0
          maximum: 1
        size:
          type: integer
          format: int64
        downloaded:
          type: integer
          format: int64
        uploaded:
          type: integer
          format: int64
        dlspeed:
          type: integer
          format: int64
        upspeed:
          type: integer
          format: int64
        eta:
          type: integer
          format: int64
        category:
          type: string
        tags:
          type: string
        save_path:
          type: string
        added_on:
          type: integer
          format: int64
        acquisition_owner:
          type: string
          enum: [subscription, one_shot]
          description: >-
            Present while a running subscription or one-shot acquisition owns
            this torrent (post-processing not yet terminal). Absent otherwise.
        origin:
          type: string
          enum: [subscription, one_shot, unknown, external]
          description: >-
            Who created this task, matched like acquisition_owner (correlation
            tag first, then infohash) against every download record on this
            connection, running or finished. subscription: an automatic or
            subscription-add download; one_shot: a one-shot download;
            unknown: the task carries the reserved bansoko- tag but no
            surviving download record names its kind (the record was
            reclaimed after one-shot retention or removed with its
            subscription), or the matching records disagree; external: no
            bansoko tag and no download record (added outside bansoko).
    QBittorrentTorrentFile:
      type: object
      additionalProperties: false
      required: [name, size, progress]
      description: Operational view of a file inside a qBittorrent torrent.
      properties:
        name:
          type: string
        size:
          type: integer
          format: int64
        progress:
          type: number
          format: double
          minimum: 0
          maximum: 1
        priority:
          type: integer
    QBittorrentServerStatus:
      type: object
      additionalProperties: false
      required: [version, connection_status]
      description: Operational view of qBittorrent server status.
      properties:
        version:
          type: string
        connection_status:
          type: string
          description: qBittorrent raw connection status (connected, disconnected).
        dl_speed:
          type: integer
          format: int64
        up_speed:
          type: integer
          format: int64
        free_space:
          type: integer
          format: int64
        total_size:
          type: integer
          format: int64
