    post:
      tags: [FileMaintenance]
      operationId: recoverAnimeFile
      x-scope: write
      x-mcp:
        tool: recover_anime_file
        group: files
        write: true
        description: >
          Confirm the recovery of one file the user adopted by hand: the file
          found at the path the file's latest scan expected but did not find.
          Pass the placement_id, generation, target_path, fingerprint and
          placement_version you read from list_anime_files; the same confirm
          replays as the same result. A refused confirm is 409
          ANIME_FILES_RECOVER_REFUSED with the reason in details[0].code and
          no state changed.
      description: >
        The explicit recovery confirm of a scan alignment recovery candidate.
        The scan froze the candidate (the placement's current and
        provenance locators were all missing, while the COMPLETE file group —
        video and every companion — was found at the paths the current naming
        rules render, free of other owners); this confirm re-verifies
        every frozen fact inside one transaction — the file still sits at the
        target with the observed size and identity, EVERY companion still
        sits at its frozen path with its frozen identity, and no other file
        owns any unit path — and then re-attaches the placement AND its
        companions to those paths together. A single missing or changed
        companion refuses the whole confirm (companion_missing /
        companion_occupied) and nothing is re-attached. No byte is moved,
        copied, overwritten or deleted; only ownership rows re-point.
        Replaying the same confirm returns the same result without a second
        journal entry. A refusal is 409 ANIME_FILES_RECOVER_REFUSED with
        details[0].code one of `owner_retired`, `not_started`,
        `candidate_gone`, `scan_changed`, `scan_running`, `placement_changed`,
        `target_missing`, `target_changed`, `target_occupied`,
        `companion_missing`, `companion_occupied` or
        `placement_handoff_pending`.
      parameters:
        - $ref: '#/components/parameters/ManagedAnimeID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnimeFileRecoverInput'
      responses:
        '200':
          description: The recovery was confirmed (or had already been).
          content:
            application/json:
              schema:
