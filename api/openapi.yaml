openapi: 3.1.0
info:
  title: Bansoko API
  version: 1.0.0
  description: >-
    HTTP API for Bansoko. Product state is read
    directly from anime owners and the source-to-file owner chain. Naming
    configuration errors use TEMPLATE_COMPILE_ERROR for syntax or static
    reference failures and NAMING_VARS_UNKNOWN for Vars keys missing from the
    active startup snapshot. Compilation guarantees syntax and static-reference
    legality, not successful rendering for a concrete file; runtime naming
    errors are returned per file in preview and execution outcomes.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Bootstrap
  - name: Auth
  - name: Configuration
  - name: Anime
  - name: Releases
  - name: Catalog
  - name: Recovery
  - name: Automation
  - name: Observability
  - name: Plugins
  - name: Metadata
  - name: Reconciliation
  - name: FileManager
  - name: Agent
x-mcp-composites:
  - tool: poll_workspace
    group: subscription
    operations: [getAnimeWorkspace]
    description: >-
      Poll one managed anime's subscription workspace until its owner chain
      reaches a stable terminal state (download completed/failed, artifact
      verified/failed, and file operations completed/failed), or the timeout
      elapses. Returns the final workspace snapshot plus a 'stable' flag (true on
      terminal state, false on timeout). Use for managed-anime subscription flows
      after refresh_rss or retry_release; one-shot callers must use
      get_one_shot_acquisition instead.
paths:
  /livez:
    get:
      tags: [System]
      operationId: getLivez
      x-scope: none
      x-surface-keep: "ops: container and deployment liveness probe (Dockerfile HEALTHCHECK, production compose, real-effect lane); not an application caller"
      security: []
      summary: Process and HTTP runtime liveness.
      description: >
        Only proves the process and HTTP runtime are alive. It never touches
        the database, providers or qBittorrent, so a business dependency
        failure is not misreported as a dead process. Use /readyz for
        admission decisions.
      responses:
        '200':
          description: The process and HTTP runtime are alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivezReport'
  /readyz:
    get:
      tags: [System]
      operationId: getReadyz
      x-scope: none
      x-surface-keep: "ops: readiness verdict for deployment probes and agents (503 carries the diagnostic body); no application caller"
      security: []
      summary: Structured service admission evidence.
      description: >
        Machine-readable readiness snapshot consumed by deployment, CI, the
        release bundle builder and the supervisor. Hard failures (database,
        schema, identity, bootstrap state, owner read, maintenance) return
        503 with a stable reason; qBittorrent unavailability is reported as
        degraded and never downgrades the hard verdict on its own.
      responses:
        '200':
          description: The instance is ready (possibly degraded).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessReport'
        '503':
          description: One or more hard readiness checks failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessReport'
  /system/health:
    get:
      tags: [System]
      operationId: getSystemHealth
      x-scope: none
      x-surface-keep: "ops: build and process identity probe for agents and operators; no application caller"
      security: []
      description: >
        Compatibility alias for the readiness contract. Behavior is equivalent
        to the http_alive and postgres checks of /readyz; it is not a broader
        readiness signal and must not be used as production admission evidence.
      responses:
        '200':
          description: The HTTP service and database schema are available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealth'
        '503':
          $ref: '#/components/responses/Unavailable'
  /bootstrap/status:
    get:
      tags: [Bootstrap]
      operationId: getBootstrapStatus
      x-scope: none
      security: []
      responses:
        '200':
          description: Minimal anonymous bootstrap state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapStatus'
  /bootstrap/owner:
    post:
      tags: [Bootstrap]
      operationId: createBootstrapOwner
      x-scope: none
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOwnerInput'
      responses:
        '201':
          description: The first owner account and normal session were created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      x-scope: none
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Authenticated owner session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/account:
    patch:
      tags: [Auth]
      operationId: updateAccount
      x-scope: write
      description: >-
        Change the signed-in owner's username and/or password. The current
        password is always required. Omitted fields stay unchanged. A password
        change revokes every other web session but keeps the current session;
        API tokens are not revoked. Only a signed-in web session may call this
        (an API token gets 403 WEB_SESSION_REQUIRED).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdateInput'
      responses:
        '200':
          description: The updated owner account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountUpdateResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      x-scope: write
      responses:
        '204':
          description: The current session was revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/session:
    get:
      tags: [Auth]
      operationId: getAuthSession
      x-scope: read
      description: >-
        Reports the session the request is authenticated with. The browser uses
        it to decide whether the gate shows the application or the sign-in form
        instead of holding a token in storage. Answers 401 when the request
        carries no valid session; it never creates one.
      responses:
        '200':
          description: The authenticated owner and when the session expires.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api-tokens:
    post:
      tags: [Auth]
      operationId: createApiToken
      x-scope: write
      description: >-
        Issue a long-lived API token for the owner. The raw token is echoed in
        the response and encrypted at rest, so the UI can keep showing and
        copying it for the token's lifetime (GET /api-tokens/{id}/raw). Revoke
        it to invalidate (tokens never expire otherwise). The scope set is
        chosen here and fixed; requesting a scope the caller does not hold is
        403 TOKEN_SCOPE_INSUFFICIENT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTokenCreateInput'
      responses:
        '201':
          description: A new long-lived API token. The raw token is also readable later via the raw endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenCreateResult'
        '403':
          $ref: '#/components/responses/ScopeInsufficient'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    get:
      tags: [Auth]
      operationId: listApiTokens
      x-scope: read
      description: Metadata projection of the active long-lived API tokens. Raw token values are never returned; revoked tokens are deleted and do not appear.
      responses:
        '200':
          description: The owner's active API token metadata list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiToken'
  /api-tokens/{api_token_id}:
    delete:
      tags: [Auth]
      operationId: revokeApiToken
      x-scope: write
      description: >-
        Permanently delete a long-lived API token. The row is removed (no
        tombstone), so a revoked token never appears in the list again.
        Deleting an unknown or already-deleted token is a no-op.
      parameters:
        - $ref: '#/components/parameters/ApiTokenID'
      responses:
        '204':
          description: The API token was revoked (deleted).
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Auth]
      operationId: rotateApiToken
      x-scope: write
      description: >-
        Atomically delete the current API token and issue a fresh one for the
        same owner in one transaction. The new raw token is echoed in the
        response and stored encrypted at rest for later display; the old token
        is invalid from the moment the rotate commits, so rotation is safe to
        retry and cannot leave two active tokens. The old row is removed, not
        tombstoned. The new token keeps the scope set; rotating a token with a
        scope the caller does not hold is 403 TOKEN_SCOPE_INSUFFICIENT.
      parameters:
        - $ref: '#/components/parameters/ApiTokenID'
      responses:
        '200':
          description: A rotated long-lived API token. The new raw token is also readable later via the raw endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenCreateResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeInsufficient'
        '404':
          $ref: '#/components/responses/NotFound'
  /api-tokens/{api_token_id}/raw:
    get:
      tags: [Auth]
      operationId: readApiTokenRaw
      x-scope: secrets
      description: >-
        Return the raw long-lived API token value on demand. The raw value is
        encrypted at rest with the deployment secret key and remains available
        for the token's lifetime, so the UI can keep showing and copying the
        key. A 404 means the token does not exist or the deployment secret key
        (BANSOKO_SECRET_ENCRYPTION_KEY) is not configured on this instance. Needs
        the secrets scope, and the read token's scopes must all be held by the
        caller (403 TOKEN_SCOPE_INSUFFICIENT otherwise).
      parameters:
        - $ref: '#/components/parameters/ApiTokenID'
      responses:
        '200':
          description: The raw API token value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenRaw'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeInsufficient'
        '404':
          $ref: '#/components/responses/NotFound'
  /events/stream:
    get:
      tags: [System]
      operationId: streamEvents
      x-scope: read
      description: >-
        Authenticated server-sent event stream of lightweight read-model
        invalidation signals. Each `data:` payload is one JSON-encoded
        RealtimeEvent.
      responses:
        '200':
          description: Server-sent event stream. Each data event is a JSON RealtimeEvent.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /config/connections:
    get:
      tags: [Configuration]
      operationId: listConnections
      x-scope: read
      responses:
        '200':
          description: Redacted typed connections used by the M1 owner chain.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Connection'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /config/connections/{connection_id}:
    put:
      tags: [Configuration]
      operationId: putConnection
      x-scope: write
      parameters:
        - $ref: '#/components/parameters/ConnectionID'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionInput'
      responses:
        '200':
          description: Redacted saved connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /config/connections/{connection_id}/test:
    post:
      tags: [Configuration]
      operationId: testConnection
      x-scope: read
      parameters:
        - $ref: '#/components/parameters/ConnectionID'
      responses:
        '200':
          description: A redacted observation from testing this connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTestResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /config/connections/{connection_id}/qbittorrent/torrents:
    get:
      tags: [Configuration]
      operationId: listQBittorrentTorrents
      x-scope: read
      description: >-
        Operational passthrough that lists torrents from the qBittorrent WebUI.
        Does not modify DownloadTask owner truth.
      parameters:
        - $ref: '#/components/parameters/ConnectionID'
      responses:
        '200':
          description: qBittorrent torrent list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QBittorrentTorrent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
  /config/connections/{connection_id}/qbittorrent/torrents/{hash}/pause:
    post:
      tags: [Configuration]
      operationId: pauseQBittorrentTorrent
      x-scope: write
      description: Operational passthrough that pauses a qBittorrent torrent.
      parameters:
        - $ref: '#/components/parameters/ConnectionID'
        - $ref: '#/components/parameters/QBHash'
      responses:
        '204':
          description: Torrent pause accepted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
  /config/connections/{connection_id}/qbittorrent/torrents/{hash}/resume:
    post:
      tags: [Configuration]
      operationId: resumeQBittorrentTorrent
      x-scope: write
      description: Operational passthrough that resumes a qBittorrent torrent.
      parameters:
        - $ref: '#/components/parameters/ConnectionID'
        - $ref: '#/components/parameters/QBHash'
      responses:
        '204':
          description: Torrent resume accepted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
  /config/connections/{connection_id}/qbittorrent/torrents/{hash}:
    delete:
      tags: [Configuration]
      operationId: deleteQBittorrentTorrent
      x-scope: write
      description: >-
        Operational passthrough that deletes a qBittorrent torrent. Refused
        with 409 QB_TORRENT_IN_USE (nothing sent to qBittorrent), with or
        without files, while a running subscription or one-shot acquisition
        owns the torrent; allowed once that acquisition is terminal.
      parameters:
        - $ref: '#/components/parameters/ConnectionID'
        - $ref: '#/components/parameters/QBHash'
        - name: delete_files
          in: query
          required: false
          description: Also delete downloaded files from disk.
          schema:
            type: boolean
            default: false
      responses:
        '204':
          description: Torrent delete accepted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
  /config/connections/{connection_id}/qbittorrent/torrents/{hash}/files:
    get:
      tags: [Configuration]
      operationId: getQBittorrentTorrentFiles
      x-scope: read
      description: Operational passthrough that lists files of a qBittorrent torrent.
      parameters:
        - $ref: '#/components/parameters/ConnectionID'
        - $ref: '#/components/parameters/QBHash'
      responses:
        '200':
          description: qBittorrent torrent file list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QBittorrentTorrentFile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
  /config/connections/{connection_id}/qbittorrent/status:
    get:
      tags: [Configuration]
      operationId: getQBittorrentServerStatus
      x-scope: read
      description: >-
        Operational passthrough that returns qBittorrent server status
        (version, connection state, transfer speeds, disk space).
      parameters:
        - $ref: '#/components/parameters/ConnectionID'
      responses:
        '200':
          description: qBittorrent server status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QBittorrentServerStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
  /config/network-routes:
    get:
      tags: [Configuration]
      operationId: listNetworkRoutes
      x-scope: read
      responses:
        '200':
          description: Redacted typed outbound routes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NetworkRoute'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /config/network-routes/{route_id}:
    put:
      tags: [Configuration]
      operationId: putNetworkRoute
      x-scope: write
      parameters:
        - $ref: '#/components/parameters/RouteID'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkRouteInput'
      responses:
        '200':
          description: Redacted saved outbound route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkRoute'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /config/network-routes/{route_id}/test:
    post:
      tags: [Configuration]
      operationId: testNetworkRoute
      x-scope: read
      parameters:
        - $ref: '#/components/parameters/RouteID'
      responses:
        '200':
          description: A redacted observation from testing this route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkRouteTestResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /anime/{managed_anime_id}/business-edit:
    get:
      tags: [Anime]
      operationId: getAnimeBusinessEdit
      x-scope: read
      description: Atomic instance draft and complete expected-version vector for an explicit working revision; no writes.
      parameters:
        - $ref: '#/components/parameters/ManagedAnimeID'
      responses:
        '200':
          description: Exact instance editing baseline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessEditView'
        '409':
          $ref: '#/components/responses/Conflict'
  /config/business-preset:
    get:
      tags: [Configuration]
      operationId: getBusinessPreset
      x-scope: read
      x-mcp:
        tool: get_business_preset
        group: configuration
        write: false
        description: >-
          Read the current Global business preset: the defaults a new
          subscription copies once (complete business snapshot with sections,
          parser policy, retention, file-effect route and program references,
          its digest, and the tag_filters default). Reading creates or applies
          nothing. To put it into a draft with your own edits, use
          load_business_preset, which also computes the digest.
      responses:
        '200':
          description: Atomic complete business preset; reading creates or applies nothing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessPresetView'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /config/business-preset/load:
    post:
      tags: [Configuration]
      operationId: loadBusinessPresetIntoDraft
      x-scope: read
      x-mcp:
        tool: load_business_preset
        group: subscription
        write: false
        description: >-
          Load the current Global business preset into a draft. Returns the
          same draft with business and business_digest set and your edits
          frozen into the snapshot: subgroups.entries you supplied win over the
          preset's (pin a group with selection_mode manual), a rules section
          you set keeps your value, and every section you leave absent
          (tag_filters included) is copied from the preset as a complete
          replace value. The copy is one-time: a later Global save never
          changes the draft or the subscription made from it. Call it after every
          edit, before rss_list_view, create_candidate, patch_candidate or
          acquire_seed_once; preview and one-shot refuse a draft without its
          business snapshot (BUSINESS_SNAPSHOT_REQUIRED). Writes nothing.
      description: >-
        Pure transformation, the server form of the frontend's load + freeze:
        reads the Global business preset in one snapshot and returns the
        submitted draft carrying a complete business snapshot built from it
        with the draft's own subgroups and explicit rules sections frozen in,
        plus the canonical business_digest. Subgroups: the draft's section
        with the preset's name keywords and provider defaults when absent, the
        preset's entries for groups the draft does not name, and effective
        selections normalized. Rules: a present section keeps the draft value
        and is frozen into the snapshot; an absent section (tag_filters
        included) is filled with the preset value as a complete replace.
        Creates, saves and applies nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoadBusinessPresetInput'
      responses:
        '200':
          description: The draft with the Global business loaded and frozen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnimeDraft'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /config/tag-filters/title-vocabulary:
    get:
      tags: [Configuration]
      operationId: getTitleTagVocabulary
      x-scope: read
      responses:
        '200':
          description: The title-parse tag vocabulary of the pinned reltitle parser.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TitleTagVocabulary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /config/notifications/trigger-kinds:
    get:
      tags: [Configuration]
      operationId: listNotificationTriggerKinds
      x-scope: read
      responses:
        '200':
          description: >-
            The closed notification trigger registry in catalog order: every
            trigger kind a notification target may enable, test or carry a
            template for.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTriggerKindVocabulary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /config/subgroups/groups:
    get:
      tags: [Configuration]
      operationId: listSubgroupGroupCandidates
      x-scope: read
      description: >-
        List one page of the subgroup dictionary of one provider: the collected
        snapshot that ships with the release, union the entries a user
        retrieved and added. Purely local — it reads no provider and needs no
        configured connection, so it answers on an install that has saved none.
        Every filter is optional: each response is one page bounded by limit,
        so even an unfiltered listing of both layers (about 1400 Mikan ids, most
        of them retired) is answered in pages. An empty q lists every entry of
        the selected layers; a q filters case-insensitively on the display
        name, with a decimal q also matching a Mikan key prefix. Available
        entries come first, then the user's own additions, then ascending key;
        next_offset continues that order and is null on the last page. An
        empty list means no match, not an error.
      parameters:
        - name: provider
          in: query
          required: true
          description: The provider whose subgroup namespace is listed.
          schema:
            $ref: '#/components/schemas/ProviderKind'
        - name: q
          in: query
          required: false
          description: >-
            A free-form name or keyword, or a provider group key (Mikan numeric
            id, AniBT slug).
          schema:
            type: string
            maxLength: 256
        - name: source
          in: query
          required: false
          description: >-
            Restrict the listing to one dictionary layer. Absent lists both.
          schema:
            $ref: '#/components/schemas/SubgroupGroupCandidateSource'
        - name: hide_retired
          in: query
          required: false
          description: >-
            When true, leave out collected entries the snapshot records as
            retired (available false). The user's own additions are always
            listed. Absent or false lists retired entries after the available
            ones.
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          required: false
          description: >-
            Page size. A value above the maximum is clamped to it; the maximum
            holds every available entry of the largest collected snapshot.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: offset
          in: query
          required: false
          description: >-
            Number of ordered entries to skip; pass the previous page's
            next_offset to continue.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: >-
            One page of dictionary entries; an empty list means no match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubgroupGroupCandidatePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Configuration]
      operationId: retrieveSubgroupGroupCandidate
      x-scope: write
      description: >-
        Discover one subgroup by key and add it to the dictionary — the only
        dictionary operation that may read a provider. The query must name a
        key: a Mikan numeric group id or an AniBT slug, or the group page link
        of either; a free-form name is a 400 SUBGROUP_DISCOVER_KEY_REQUIRED and
        reads nothing (searching by name is the local listing's job). A key the
        dictionary already holds returns that entry with no provider request
        and no write. A key it does not hold is confirmed at the provider (Mikan:
        one read of that group's page; AniBT: one read of its group directory
        page), and a confirmed group is added to the user layer of the
        dictionary and returned, so the dictionary grows on demand instead of
        by crawl. An empty list means the provider confirmed nothing, not an
        error. Idempotent: a key the dictionary already holds is returned as it
        stands and never re-added, so repeating the request succeeds. Writes
        only the dictionary: it never changes the subgroup list, whose entries
        are saved separately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubgroupGroupRetrievalInput'
      responses:
        '200':
          description: >-
            The resolved candidates, at most 50, possibly an empty list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubgroupGroupCandidateList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
