  /catalog/providers/{provider}/seed-search-snapshots:fetch:
    post:
      tags: [Catalog]
      operationId: fetchSeedSearchSnapshot
      x-scope: write
      description: >-
        Run one keyword torrent search against one provider and persist its
        results as an immutable search snapshot. This is a write because it
        contacts the upstream and appends a snapshot row, even though it creates
        no subscription, ownership, group, WorkItem or torrent byte.

        Only the free-text query is caller input: the upstream endpoint, the
        query normalization and the snapshot scope are derived server-side, so a
        request can never name a URL, a catalog entry, a group, a seed key or
        torrent bytes. The two sites are queried the same way (a space-composed
        query of work, subtitle group, episode and resolution); the first
        release offers no source-specific or in-result filter.

        The snapshot identity covers the complete result set, and the response
        renders that complete seed window (both sites answer at most 100 keyword
        results). A search snapshot is a `search`
        kind: it is never a group, a subscription source or a saved-revision
        custom feed, it is not refreshed by provider refresh, and it expires
        after 24 hours. Expanding and downloading a seed from it uses the same
        exact-identity endpoints as a feed seed and the same strong-identity
        verification; there is no second download path. This endpoint is human
        only and has no MCP tool: it persists a batch of seeds, and the first
        release does not expose keyword search to agents.
      parameters:
        - $ref: '#/components/parameters/CatalogProvider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeedSearchSnapshotInput'
      responses:
        '200':
          description: The newly persisted search snapshot and its seed window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeedSearchSnapshotView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
