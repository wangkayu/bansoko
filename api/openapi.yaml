          revision (input_source=saved_revision with candidate_id and revision) or the
          complete current unsaved draft (input_source=current_input with draft). The
          temporary owner graph is reclaimed after completion; frozen input and bounded
          recovery evidence remain on the marker. Select the seed by reference:
          selected_seed carries provider, provider_entry_ref, provider_group_ref,
          snapshot_id, snapshot_version, snapshot_content_hash (the snapshot's
          content_hash) and stable_seed_key from get_feed_snapshot or
          refresh_feed_snapshot; the server resolves the seed from that persisted
          snapshot (SEED_PREVIEW_STALE when it is no longer current). The
          Idempotency-Key is generated automatically unless idempotency_key is
          supplied.
      description: >-
        Finite one-shot seed acquisition from an exact saved candidate
        revision. Downloads exactly one selected seed as one acquisition cycle.
        Admission atomically creates a temporary origin=oneshot stopped mount,
        one placeholder custom_rss source, exactly one selected-seed Release
        with its torrent input, one DownloadTask whose complete input/policy
        and correlation facts freeze before asynchronous work begins, the
        internal one-shot marker owning request replay, and only that seed's
        qb_submit work item. It never creates a long-lived Subscription,
        provider-group selections, ordinary RSS runtimes, or periodic refresh
        work. Admission locks the candidate and requested revision, verifies
        that the revision is still the candidate's current pointer, then
        fetches and bencode-validates the torrent through the bounded SSRF-safe
        payload fetcher before any owner write and exact-compares every
        supplied strong content identity; bencode validity alone never admits
        a seed. A human seed must match the current authorized provider preview
        context (provider, entry, group, locator); a stale or replaced preview
        snapshot is a typed SEED_PREVIEW_STALE failure requiring a fresh seed
        preview before retry. The seed may instead be a snapshot reference
        (SelectedSeedInput without locator); it is resolved from the persisted
        snapshot at the entry point, after which admission, freezing and replay
        are identical to the locator form. Exact replay of the same Idempotency-Key and
        canonical candidate/revision/seed identity returns the original handle
        even after owner reclamation; reusing the key with a different identity
        is a conflict.
        A human custom/oneshot draft is admitted on the same terms: that draft
        is the authorization context and its own frozen custom source supplies
        the entry and group (custom-source/custom-group identities computed by
        the server from the draft's frozen locator and group name), never a
        discoverable provider entry. The seed is identified by its
        stable_seed_key inside that draft's own persisted custom feed snapshot
        plus a strong content identity (infohash or expected_payload_digest).
        The admitted graph is the same temporary origin=oneshot stopped mount
        with one placeholder custom_rss source, exactly one Release and one
        DownloadTask; a custom seed creates no ManagedAnime-resident ownership,
        no provider-group selection, no ordinary RSS runtime and no periodic
        refresh either. The agent authorization boundary is unchanged: a human
        path never gains agent reach, and an agent request still requires a
        complete origin=oneshot draft plus an explicit authorization snapshot.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcquireSeedOnceInput'
      responses:
        '201':
          description: >-
            One-shot acquisition admitted. The temporary owner graph and the
            marker were created atomically; poll the read surface while the
            temporary owner exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneShotAdmissionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: >-
            IDEMPOTENCY_KEY_REUSED: the same Idempotency-Key was used with a
            different canonical body or selected seed. Nothing was created.
            ONE_SHOT_RECLAIMING is a worker-facing typed rejection and never
            an admission result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            Typed admission failure with no writes:
            SEED_IDENTITY_REQUIRED (neither info_hash nor
            expected_payload_digest supplied), SEED_PREVIEW_STALE (the human
            preview snapshot behind the selected seed was replaced or
            superseded), SEED_IDENTITY_MISMATCH (the fetched torrent does not
            match a supplied strong identity, including a locator redirected
            to different content), SEED_LOCATOR_UNSAFE (transport safety
            rejected the locator), TORRENT_FETCH_FAILED (fetch/parse/size
            failure), or DRAFT_INVALID (structurally invalid draft).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /one-shot-acquisitions/{one_shot_id}:
    get:
      tags: [Releases]
      operationId: getOneShotAcquisition
      x-scope: read
      x-mcp:
        tool: get_one_shot_acquisition
        group: one_shot
        write: false
        description: >-
          Read one finite one-shot acquisition by its handle: marker state
          (running/retention_pending/cleanup_blocked/reclaiming/cleaned), terminal
          outcome/reason, and the current owner-chain views while the temporary owner
          exists. Poll this instead of get_workspace for one-shot acquisitions; stop
          polling at the retained terminal outcome or on not-found after marker purge.
          Side-effect free.
      description: >-
        Owner-first read surface for one finite one-shot acquisition.
        Returns marker state, terminal outcome, bounded redacted reasons,
        and the current owner-chain views while the temporary owner graph
        exists. After owner reclamation the retained terminal outcome and
        reason still answer until marker purge removes the replay record;
        afterwards the handle is not found and the request key may start a
        new acquisition. Never exposes worker lease/fencing internals, raw
        payloads, secrets, or private paths.
      parameters:
        - $ref: '#/components/parameters/OneShotID'
      responses:
        '200':
          description: Current one-shot marker and owner-chain status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneShotAcquisitionView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
