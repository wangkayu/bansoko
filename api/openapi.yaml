  /anime/{managed_anime_id}/local-data:
    delete:
      tags: [Anime]
      operationId: cleanupAnimeLocalData
      x-scope: write
      description: >-
        Explicitly authorized physical local cleanup of one RETIRED
        ManagedAnime's local business/config/runtime records: the complete
        leaf-first local owner graph, including work items, reconciliation
        scans/observations/calibrations/checkpoints, placement/replacement/
        cleanup/alignment/offset-migration owners, media fact snapshots/files,
        file operations, artifacts, download tasks, releases, RSS runtime and
        sources, instance configuration and metadata, the subscription and the
        lifecycle row. It never calls qBittorrent and never deletes qB
        torrents/data or media-library files.

        Retirement and cleanup are separate: retirement preserves the graph,
        cleanup deletes it later. Only a retired lifecycle is eligible; active
        or stopped instances return a typed 409. An Idempotency-Key plus the
        retired lifecycle epoch (CAS) and a fixed confirmation string are
        mandatory. A replay with the same key and request returns the original
        success; the same key with a different request is a typed 409; a stale
        epoch is a typed 409.

        Cleanup does not wait for external effects to settle. Retirement's
        lifecycle fence already rejects every owner-row and WorkItem write for
        the retired owner, so a leased or externally-admitted WorkItem, a
        downloading/waiting_retry download, an effect-unknown operation or an
        unknown plugin delivery can no longer write local state; cleanup deletes
        the local graph and the late writer fails on the fence. The transaction
        still serializes on the lifecycle row with any writer that is inside its
        own fenced transaction, so it never races a live local write. A
        relocation whose bytes may still land leaves them untouched: this
        command never deletes qB torrents/data or media-library files.
      parameters:
        - $ref: '#/components/parameters/ManagedAnimeID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalDataCleanup'
      responses:
        '204':
          description: The retired instance's local records were deleted (idempotent replay returns the same result).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
