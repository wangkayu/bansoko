      operationId: redownloadPlacement
      x-scope: write
      x-mcp:
        tool: redownload_placement
        group: files
        write: true
        description: >-
          Download again the episode of a managed video whose latest scan found
          the file missing or with different content (see placement_issues in
          the file-maintenance overview). The release that produced it runs
          through normal acceptance as a new attempt; when the new file is
          placed, the old placement becomes displaced. A file still at the old
          path is handled by the collision setting. Returns the acceptance
          outcome; only accepted keeps the request.
      description: >-
        Requests a new download of one active placement whose latest scan
        observation is `missing` or `fingerprint_conflict`. Nothing is ever
        redownloaded automatically. The placement's Release is evaluated again
        through normal acceptance (rules, metadata hold, deduplication, the
        collision setting); while the request is pending the placement does not
        hold its episodes for deduplication. When the new placement of the
        instance covering one of its episodes activates, this placement becomes
        `displaced` (cause `redownload`) in the same commit. Filtered, held,
        present and failed are results; the request is then withdrawn. A
        placement that is not active or whose file is not missing or mismatched
        answers 409 PLACEMENT_EXIT_UNAVAILABLE with the reason in
        details[0].code (`placement_not_active`, `file_not_missing`,
        `source_release_unavailable`, or a release retry reason such as
        `download_in_progress`). Replaying the same Idempotency-Key returns the
        first result.
