        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /backup/download-ticket:
    post:
      tags: [System]
      operationId: prepareBackupDownload
      x-scope: secrets
      description: >-
        Prepares a backup for a browser download: dumps and verifies it exactly
        like GET /backup/export, keeps the file in a temporary directory, and
        returns a random single-use ticket valid for five minutes. GET
        /backup/download?ticket= then streams that file without an
        Authorization header, so a plain browser navigation can save it to disk.
        An unused prepared file is removed when its ticket expires. Needs the
        secrets scope.
      responses:
        '201':
          description: The backup is prepared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupDownloadTicket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeInsufficient'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /backup/download:
    get:
      tags: [System]
      operationId: downloadPreparedBackup
      x-scope: none
      security: []
      description: >-
        Streams the backup file prepared by POST /backup/download-ticket. The
        ticket is the credential: it is single-use, expires five minutes after
        it was issued, and is consumed when the download starts. An unknown,
        used or expired ticket is 403 BACKUP_TICKET_INVALID.
      parameters:
        - name: ticket
          in: query
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{43}$'
      responses:
        '200':
          description: The backup file.
          headers:
            Content-Disposition:
              description: attachment with the backup file name.
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          description: The ticket is unknown, used or expired (BACKUP_TICKET_INVALID).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /backup/restore:
    post:
      tags: [System]
      operationId: restoreBackup
      x-scope: secrets
      description: >-
        Replaces all current data with an uploaded backup file (the export
        format). The body is the file. Before anything changes the server checks
        the header, refuses a schema_version other than the running schema
        (422 BACKUP_SCHEMA_MISMATCH), stores exactly payload_bytes and checks
        their SHA-256 (422 BACKUP_FILE_INVALID), loads the archive into a new
        database next to the live one and verifies its migration history
        against the running release (422 BACKUP_LOAD_FAILED or
        BACKUP_SCHEMA_MISMATCH). Every refusal leaves the current data as it
        was. On 202 the server stops its background work and HTTP, switches the
        databases by rename and restarts; all sessions are signed out. Only a
        signed-in web session may restore: an API token (and so MCP or any
        agent) gets 403 WEB_SESSION_REQUIRED whatever its scopes. 409
        RESTORE_UNAVAILABLE when this deployment cannot restore, 409
        RESTORE_IN_PROGRESS while another restore runs.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '202':
          description: The backup is verified and loaded; the service restarts on it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupRestoreAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            The caller is an API token (WEB_SESSION_REQUIRED); restore is only
            for a signed-in web session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
