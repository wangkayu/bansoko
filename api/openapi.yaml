        auth_header_name:
          type: string
          nullable: true
          minLength: 1
          maxLength: 128
    PluginAdapterConfig:
      oneOf:
        - $ref: '#/components/schemas/TelegramAdapterConfig'
        - $ref: '#/components/schemas/FeishuAdapterConfig'
        - $ref: '#/components/schemas/WebhookAdapterConfig'
      discriminator:
        propertyName: adapter_kind
        mapping:
          telegram: '#/components/schemas/TelegramAdapterConfig'
          feishu: '#/components/schemas/FeishuAdapterConfig'
          webhook: '#/components/schemas/WebhookAdapterConfig'
    PluginAdapterConfigStatus:
      type: string
      enum: [available, unavailable, invalid]
      description: >-
        Whether the stored adapter config could be projected. The config is a
        closed, allowlisted document dispatched on config_schema_version and
        adapter_kind; `invalid` marks rows that are not provably canonical
        (an undeclared or secret-bearing field, a mismatched inner
        adapter_kind), and their bytes are withheld instead of being returned
        or executed.
