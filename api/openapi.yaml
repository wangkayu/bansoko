        '200':
          description: The entry detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileManagerEntryDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /file-manager/entry/release:
    post:
      tags: [FileManager]
      operationId: releaseFileManagerEntry
      x-scope: write
      x-mcp:
        tool: release_file_entry
        group: files
        write: true
        description: >-
          End the management of one managed video: the file stays on disk and
          becomes detached, its bound subtitles are released with it, and it
          leaves scan observation, alignment, replacement and automatic
          cleanup. A sidecar, an unfinished owner, a retired instance or a
          changed revision is refused and nothing is written.
      description: >-
        Ends the management of one managed video file (design
        §5): every active placement at the path becomes `released` (terminal,
        never reverted), its bound subtitles are released with it, the file is kept, and a timeline entry is written in the same
        transaction. A released file leaves scan observation, alignment,
        replacement evaluation and automatic cleanup admission, and its
        episode can be acquired again while the subscription is active.
        `move_to` additionally admits a user move of the video in the same
        transaction ("release and move to…"); a conflicting move rejects the
        whole request. The server re-derives the entry state: an unfinished
        owner, a retired instance, a sidecar or a changed revision is a typed
        409 and nothing is written. A replay with the same Idempotency-Key and
        request returns the original result.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileManagerReleaseRequest'
      responses:
        '200':
          description: The placement was released (and the move admitted).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileManagerReleaseResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /file-manager/entry/match/preview:
    post:
      tags: [FileManager]
      operationId: previewFileManagerMatch
      x-scope: read
      x-mcp:
        tool: preview_file_match
        group: files
        write: false
        description: >-
          Preview matching a detached video at any absolute path to one season and
          episode of an anime, without writing anything. Give only the anime, the season
          and the episode: the server renders the target with that anime's current TV
          naming template, applies no offset, and reports the target path, the
          directories a match would create, an occupied target, the subtitles beside the
          video that stay where they are, and blockers (for example missing naming
          facts). Applies to a detached video wherever it lies; a managed file is
          aligned instead (FILE_MANAGER_MATCH_REQUIRES_DETACHED). The result
          carries the revision and target_path that match_file needs.
      description: >-
        Shows what matching a detached video to one season and episode of an
        anime would do, and writes nothing. The target is rendered with that
        anime's current TV naming template: the chosen episode is final (no
        offset applies, `ep.source` is `manual`), the anime facts are read now,
        and release-level facts (Vars output, rt and anibt values, release
        title and source group) come from the file's own acquisition when it
        has one and are absent otherwise. A template that needs a fact the
        evidence lacks is a blocker in the answer, not an error. Applies to a detached
        video wherever it lies: a managed file is
        409 FILE_MANAGER_MATCH_REQUIRES_DETACHED (align it instead), and an
        anime that is retired, a one-shot's or not subscribed 409. The answer
        names the target path, the directories a match would create, an
        occupied target, and the subtitles beside the video that stay where
        they are. Agents give only the anime, season and episode.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileManagerMatchPreviewRequest'
      responses:
        '200':
          description: The preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileManagerMatchPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /file-manager/entry/match:
    post:
      tags: [FileManager]
      operationId: matchFileManagerEntry
      x-scope: write
      x-mcp:
        tool: match_file
        group: files
        write: true
        description: >-
          Match a detached video at any absolute path to one season and episode of an
          anime: it is moved to the path the anime's TV naming template renders (missing
          directories are created) and stays detached. Preview
          first with preview_file_match and pass back its revision as expected_revision
          and its target_path as expected_target; a changed file
          (FILE_MANAGER_ENTRY_CHANGED) or a different target
          (FILE_MANAGER_MATCH_TARGET_CHANGED) is refused and nothing is written. An
          occupied target is cancelled (conflict=block) or the file gets a version
          suffix (conflict=version); nothing is ever overwritten. Subtitles beside the
          video do not move. Returns the operation.
      description: >-
        Matches a detached video to one season and episode of an anime: one
        fenced `match` user operation that moves the file to the path the
        anime's TV naming template renders, creating the missing directories
        (never through a symbolic link) and recording
        which it created. The file stays detached: no placement is created and
        no coverage changes. The request names the revision the user saw and the
        previewed target; the server re-derives the entry, renders again
        and refuses a changed entry (FILE_MANAGER_ENTRY_CHANGED) or
        a different target (FILE_MANAGER_MATCH_TARGET_CHANGED). An occupied
        target is cancelled (`block`) or the file takes a version suffix
        (`version`); nothing is ever overwritten. The unfinished-owner and
        detached checks run again in the admission transaction and just before
        the worker acts. Subtitles beside the video do not move. A replay
        with the same Idempotency-Key and request returns the original
        operation.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileManagerMatchRequest'
      responses:
        '202':
          description: The match was admitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileManagerOperationView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /file-manager/operations:
    post:
      tags: [FileManager]
      operationId: submitFileManagerOperation
      x-scope: write
      description: >-
        Admits one user file operation (move, rename, copy or delete) on a
        file. Move, rename and delete apply only to detached files; copy also
        to managed files (the copy is detached). The server
        re-derives the entry state and compares the revision, then freezes the
        operation and its WorkItem in one transaction; the worker freezes the
        source fingerprint durably before the effect. A user
        operation never overwrites: an occupied target is cancelled (`block`)
        or the new file gets a version suffix (`version`); naming another
        target is a new request. A target must be an absolute path other than
        the file itself, outside the browsable refusal zone and the executors'
        own namespaces, and its parent directory must exist without passing a
        symlink; a rename keeps the source directory.
        Delete captures the file and then removes that exact object. A replay
        with the same Idempotency-Key and request returns the original
        operation.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileManagerOperationRequest'
      responses:
        '202':
          description: The operation was admitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileManagerOperationView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /file-manager/operations/{operation_id}:
    get:
      tags: [FileManager]
      operationId: getFileManagerOperation
      x-scope: read
      description: One user file operation and its outcome. Read-only.
      parameters:
        - name: operation_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ID'
      responses:
        '200':
          description: The operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileManagerOperationView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /file-manager/entry/align:
    post:
      tags: [FileManager]
      operationId: alignFileManagerEntry
      x-scope: write
      description: >-
        Aligns a managed video file with its naming rules through the existing
        alignment chain: it submits a manual reconciliation scan of the file's
        anime, whose alignment consumer plans and admits the moves. Requires alignment enabled by the
        effective file maintenance policy. The server re-derives the entry
        state and compares the revision first.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileManagerAlignRequest'
      responses:
        '202':
          description: The alignment scan was submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileManagerAlignResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /file-manager/anime/{managed_anime_id}/location:
    get:
      tags: [FileManager]
      operationId: locateFileManagerAnime
      x-scope: read
      description: >-
        The browsable directory holding one anime's current files: the
        deepest common directory of its active placements, walked up to the
        closest directory that exists. 404 FILE_MANAGER_LOCATION_UNKNOWN when
        none.
      parameters:
        - $ref: '#/components/parameters/ManagedAnimeID'
      responses:
        '200':
          description: The anime's directory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileManagerLocation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Either a short-lived owner session token (POST /auth/login) or a
        long-lived API token (POST /api-tokens). Both are opaque random
        values carried in the Authorization header. Every operation declares
        the scope it needs in x-scope (read, write or secrets; none for the
        anonymous operations). A web session holds every scope; an API token
        holds the scopes chosen at creation. A bearer without the needed scope
        gets 403 TOKEN_SCOPE_INSUFFICIENT with required_scope. Properties
        marked x-secret are returned as the fixed placeholder "[secret]" to a
        bearer without the secrets scope.
      bearerFormat: opaque-token
  parameters:
    FileManagerPath:
      name: path
      in: query
      required: true
      description: >-
        Absolute directory path; `/` is the filesystem root. A path inside the
        refusal set is 400 FILE_MANAGER_PATH_DENIED.
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    ManagedAnimeID:
      name: managed_anime_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    CandidateID:
      name: candidate_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    ConnectionID:
      name: connection_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    RouteID:
      name: route_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    ReleaseID:
      name: release_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    RSSSourceID:
      name: rss_source_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    DownloadTaskID:
      name: download_task_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    ArtifactID:
      name: artifact_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    AcquisitionID:
      name: acquisition_id
      in: path
      required: true
      description: Execution record (acquisition root) id.
      schema:
        $ref: '#/components/schemas/ID'
    OneShotID:
      name: one_shot_id
      in: path
      required: true
      description: Stable one-shot marker handle returned by acquireSeedOnce.
      schema:
        $ref: '#/components/schemas/ID'
    OneShotAttemptID:
      name: attempt_id
      in: path
      required: true
      description: Execution attempt id of the named one-shot acquisition.
      schema:
        $ref: '#/components/schemas/ID'
    AutomationKindPath:
      name: kind
      in: path
      required: true
      description: Automation schedule kind.
      schema:
        $ref: '#/components/schemas/AutomationKind'
    AutomationRunID:
      name: run_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    ApiTokenID:
      name: api_token_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque keyset pagination cursor.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    FromTime:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
    ToTime:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
    PluginTargetID:
      name: plugin_target_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    PluginDeliveryID:
      name: plugin_delivery_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    TriggerKindPath:
      name: trigger_kind
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/NotificationTriggerKind'
    IfMatchVersion:
      name: If-Match
      in: header
      required: true
      description: >-
        Expected current owner version for optimistic concurrency. Use 0 to
        create: the request succeeds only when the owner does not exist yet.
      schema:
        type: integer
        format: int64
        minimum: 0
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    CatalogProvider:
      name: provider
      in: path
      required: true
      description: Provider namespace for the catalog.
      schema:
        type: string
        enum: [anibt, mikan]
    CatalogProviderEntryRef:
      name: provider_entry_ref
      in: path
      required: true
      description: >-
        External provider-scoped catalog-entry reference. Unique only within its
        provider and never a formal ManagedAnime owner identity, so it is always
        paired with the provider path segment.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    CatalogSeason:
      name: season
      in: path
      required: true
      description: >-
        Season identifier in canonical YYYY-term form (e.g. 2026-summer).
        Terms: winter, spring, summer, fall.
      schema:
        type: string
        minLength: 1
        maxLength: 32
    QBHash:
      name: hash
      in: path
      required: true
      description: qBittorrent torrent info hash (SHA1 or SHA256).
      schema:
        type: string
        minLength: 1
        maxLength: 128
  requestBodies:
    ManualRetry:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ManualRetryInput'
  responses:
    Forbidden:
      description: The operation requires a signed-in web session (WEB_SESSION_REQUIRED).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: >-
        This client is being rate limited (LOGIN_RATE_LIMITED for sign-in,
        PROVIDER_RATE_LIMITED when the provider answered 429/503). Retry after
        the Retry-After seconds; when the provider supplied its own wait it is
        that value.
      headers:
        Retry-After:
          description: Seconds before another attempt is accepted.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ScopeInsufficient:
      description: >-
        The bearer is an API token without the scope this operation needs
        (TOKEN_SCOPE_INSUFFICIENT; required_scope names it).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: The request could not be decoded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication failed or is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The requested owner was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Version, uniqueness, state, or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unprocessable:
      description: Typed validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Gone:
      description: The requested detail was reclaimed; only its summary remains.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unavailable:
      description: A required adapter or service is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ManualRetryAccepted:
      description: A new owner-specific recovery attempt was accepted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ManualRetryResult'
  schemas:
    RealtimeEvent:
      type: object
      description: >-
        One invalidation signal on /events/stream. It names the read model to
        re-read and never carries a business object.
      required: [target]
      properties:
        target:
          type: string
          enum: [catalog, subscribed, rss, records]
        managed_anime_id:
          type: string
          description: >-
            Optional scope hint, present only when the change came from one
            managed anime's owner chain (for example an RSS refresh, download,
            artifact or file operation work item). Clients may narrow
            invalidation to that anime; when absent the signal is unscoped and
            clients invalidate the whole target.
    ID:
      type: string
      minLength: 1
      maxLength: 128
    Version:
      type: integer
      format: int64
      minimum: 1
    SnapshotSeedDownloadInput:
      type: object
      additionalProperties: false
      required:
        [provider, provider_entry_ref, provider_group_ref, snapshot_version,
         content_hash, input_source]
      description: >-
        One persisted seed to download. Only identities are accepted: the
        locator, title, published time and strong content identity are read from
        the named snapshot server-side, so a browser never echoes back the raw
        source location. A provider=custom seed names the frozen custom-source
        and custom-group identities of a custom/oneshot draft source's own feed
        snapshot, so the same second step downloads a custom seed without any
        new locator ever leaving the server. A keyword search seed is the same
        shape: provider_entry_ref/provider_group_ref are the derived
        search-scope and search-query refs, the server proves the named snapshot
        is the `search` kind, and the admission must be a current_input one-shot.
      properties:
        provider:
          $ref: '#/components/schemas/SnapshotSeedProvider'
        provider_entry_ref:
          type: string
          minLength: 1
          maxLength: 256
        provider_group_ref:
          type: string
          minLength: 1
          maxLength: 256
        snapshot_version:
          $ref: '#/components/schemas/Version'
        content_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        input_source:
          type: string
          enum: [current_input, candidate_revision]
        draft:
          allOf:
            - $ref: '#/components/schemas/AnimeDraft'
          nullable: true
        candidate_id:
          allOf:
            - $ref: '#/components/schemas/ID'
          nullable: true
        revision:
          allOf:
            - $ref: '#/components/schemas/Version'
          nullable: true
        episode_offset:
          type: integer
          minimum: -1000
          maximum: 1000
          description: >-
            The one episode offset of this one-shot. It is written to the
            one-shot's placeholder RSS link and frozen into the input snapshot
            and the idempotency request identity; it is never read from an
            existing subscription, link or the submitted draft. Omitted means 0.
            Out of range is a 422 OFFSET_OUT_OF_RANGE with zero writes.
    SnapshotSeedExpandInput:
      type: object
      additionalProperties: false
      required:
        [provider, provider_entry_ref, provider_group_ref, snapshot_version,
         content_hash]
      description: >-
        One seed of one exact persisted snapshot to expand. It carries
        identities only, exactly like SnapshotSeedDownloadInput: the stable
        seed key is the path segment and the locator, title and published
        identity are read server-side from the snapshot, so expansion can only
        ever fetch the locator the snapshot already published for that seed. A
        keyword search seed names its derived search-scope/search-query refs the
        same way, and the server proves the snapshot's own kind before expanding.
      properties:
        provider:
          $ref: '#/components/schemas/SnapshotSeedProvider'
        provider_entry_ref:
          type: string
          minLength: 1
          maxLength: 256
        provider_group_ref:
          type: string
          minLength: 1
          maxLength: 256
        snapshot_version:
          $ref: '#/components/schemas/Version'
        content_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
    SnapshotSeedExpandResult:
      type: object
      additionalProperties: false
      required: [state, torrent, cached]
      description: >-
        The outcome of expanding one seed. It is a state, not an error: a
        network failure, a corrupt payload and an upstream 404 are expected
        outcomes of a lazy fetch and are reported as unavailable with a
        bounded error_code and an empty cache, never as a transport error.
        Only a snapshot identity the server can no longer prove is a typed
        failure.
      properties:
        state:
          type: string
          enum: [available, unavailable]
        torrent:
          $ref: '#/components/schemas/RSSListTorrentState'
        error_code:
          type: string
          nullable: true
          description: >-
            torrent_fetch_failed (network or non-2xx upstream),
            torrent_parse_failed (2xx but undecodable or over the size
            bound), torrent_missing (upstream 404) or
            torrent_identity_mismatch (the bytes do not match the identity
            the snapshot published). Present only when state is unavailable.
        error_reason:
          type: string
          nullable: true
        cached:
          type: boolean
          description: >-
            True when the manifest came from the locator cache without any
            provider request, false when this call fetched and verified the
            bytes itself.
    SubgroupsSelectionPreviewInput:
      type: object
      additionalProperties: false
      required: [input_source]
      description: >-
        One group-selection preview request. current_input requires draft and
        accepts observation; owner_draft requires managed_anime_id and the
        complete unsaved subgroups value. This is a pure read and never writes.
      properties:
        input_source:
          type: string
          enum: [current_input, owner_draft]
        draft:
          allOf:
            - $ref: '#/components/schemas/AnimeDraft'
          nullable: true
          description: Required for current_input; unused by owner_draft.
        observation:
          allOf:
            - $ref: '#/components/schemas/RSSListObservationRef'
          nullable: true
          description: >-
            current_input only; the persisted provider group observation whose
            groups are listed next to the configured ones.
        managed_anime_id:
          allOf:
            - $ref: '#/components/schemas/ID'
          nullable: true
          description: Required for owner_draft; unused by current_input.
        subgroups:
          allOf:
            - $ref: '#/components/schemas/SubgroupsSection'
          nullable: true
          description: >-
            owner_draft only; the complete unsaved subgroups value, validated
            like the subgroups PATCH and never written.
    SubgroupsSelectionPreview:
      type: object
      additionalProperties: false
      required: [mode, groups]
      properties:
        mode:
          type: string
          enum: [current_input, owner_draft]
        groups:
          type: array
          items:
            $ref: '#/components/schemas/SubgroupSelectionFact'
    SubgroupSelectionFact:
      type: object
      additionalProperties: false
      required: [provider, group_ref, available, effective_selected, count_in_limit]
      description: >-
        One group's selection under the previewed value, produced by the
        group-selection decision. The browser renders it and never infers
        selection or a reason from the booleans.
      properties:
        provider:
          $ref: '#/components/schemas/ProviderKind'
        group_ref:
          type: string
          minLength: 1
          maxLength: 256
        available:
          type: boolean
          description: False when the provider no longer lists the group.
        effective_selected:
          type: boolean
        count_in_limit:
          type: boolean
        reason_code:
          type: string
          nullable: true
          description: >-
            The decision's own reason for the group's state: policy_always,
            ranked_within_max_rss, policy_never (a per-anime manual exclusion),
            site_blacklisted, site_not_whitelisted, policy_score_negative,
            max_rss_exhausted or provider_group_not_observed. Null when the
            decision does not reproduce the listed state.
        score_breakdown:
          allOf:
            - $ref: '#/components/schemas/SubgroupScoreBreakdown'
          nullable: true
          description: >-
            How the decision scored the group. Null when the server has no
            decision for the listed state.
    SubgroupScoreBreakdown:
      type: object
      additionalProperties: false
      required: [site_mode, site_default_score, list_effect, keywords, entry_override]
      description: >-
        How the group-selection decision scored one group, produced by the
        decision itself so the browser never computes a score. The site parts
        come from the live Global site policy (provider_defaults and
        name_keywords); entry_override is the per-anime manual intent. For a
        ranked group final_score equals pinned_score when the site pins the
        group (keywords is then empty), otherwise site_default_score plus every
        keyword score; an excluded or manually decided group has a null
        final_score and a null pinned_score.
      properties:
        site_mode:
          type: string
          enum: [blacklist, whitelist]
        site_default_score:
          type: integer
        list_effect:
          type: string
          enum: [none, whitelisted, blacklisted, not_whitelisted]
        keywords:
          type: array
          items:
            $ref: '#/components/schemas/NameKeywordRule'
          description: The matched name keywords, each with the score it added.
        entry_override:
          type: string
          enum: [none, always, never]
        pinned_score:
          type: integer
          nullable: true
          description: >-
            The site's pinned score for this group when it decided the score;
            null when the group is not pinned, excluded, or manually decided.
        final_score:
          type: integer
          nullable: true
    RSSListViewInput:
      type: object
      additionalProperties: false
      required: [input_source]
      description: >-
        One RSS list read request. input_source selects current_input,
        candidate_revision, owner, or owner_draft. Provider feed snapshot
        identities are optional and advisory: the server determines selected
        groups, reports selected groups without a supplied snapshot as
        snapshot_required, and returns supplied identities for unselected
        groups in unused_feed_identities. Owner modes require managed_anime_id;
        owner_draft also requires rules_preview (shaped exactly like
        RulesSections), metadata_preview, or both. This is a pure read and
        never writes.
      properties:
        input_source:
          type: string
          enum: [current_input, candidate_revision, owner, owner_draft]
        draft:
          allOf:
            - $ref: '#/components/schemas/AnimeDraft'
          nullable: true
          description: Required for current_input; unused by other modes.
        candidate_id:
          allOf:
            - $ref: '#/components/schemas/ID'
          nullable: true
          description: >-
            Required for candidate_revision. Optional for current_input of a
            custom draft, together with revision: the saved preset revision
            whose source snapshot (POST /catalog/custom/feed-snapshots:fetch)
            the draft's bench reads. The snapshot scope still binds the
            draft's own locator and group, so an unsaved source edit reads no
            snapshot. Rejected for any other current_input draft and for
            one_shot; forbidden in the owner modes.
        revision:
          allOf:
            - $ref: '#/components/schemas/Version'
          nullable: true
          description: >-
            Required for candidate_revision; with candidate_id, the saved
            preset revision that scopes a custom current_input draft's source
            snapshot. Forbidden in the owner modes.
        managed_anime_id:
          allOf:
            - $ref: '#/components/schemas/ID'
          nullable: true
          description: Required for owner and owner_draft modes.
        rules_preview:
          allOf:
            - $ref: '#/components/schemas/RulesSections'
          nullable: true
          description: >-
            owner_draft only; the unsaved Rules sections patch. owner_draft
            requires rules_preview, metadata_preview, or both.
        metadata_preview:
          allOf:
            - $ref: '#/components/schemas/AnimeMetadataPreview'
          nullable: true
          description: >-
            owner_draft only; the complete unsaved metadata value, overlaid on
            the persisted metadata for this read only and never written.
            Validated exactly like the metadata PATCH; an invalid value fails
            the read with 422 field errors under metadata_preview.
        feed:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/PreviewFeedSnapshotRef'
          description: >-
            Optional advisory snapshot identities for current_input,
            candidate_revision, and pending-subscription owner modes. Matched
            to effective-selected groups; absent selected identities require
            snapshot acquisition; unmatched ones return as
            unused_feed_identities.
        observation:
          allOf:
            - $ref: '#/components/schemas/RSSListObservationRef'
          nullable: true
          description: >-
            current_input only. The persisted provider group observation (the
            snapshot_version group discovery returned) whose groups are listed
            next to the draft's configured ones; observed groups nobody
            configured take the provider default policy, ranked with the
            configured ones under max_rss. A pure read: the observation must
            belong to the draft's provider and entry, and one no longer
            retained is reported on the view instead of failing the request.
        limit_per_group:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
          description: >-
            Maximum persisted Release items per group in owner and owner_draft
            modes. Defaults to 100; maximum 500.
        episode_offset:
          type: integer
          nullable: true
          minimum: -1000
          maximum: 1000
          description: >-
            Preview-only episode offset. Shifts the file-level parse and render
            of a group with no offset of its own, so a non-zero offset
            previews exactly what a one-shot request with that offset would
            render. A group's own offset wins: a persisted owner link keeps its
            stored offset and a draft group with a matching draft source keeps
            that source's episode_offset, so the preview never rewrites a
            stored offset or invents a second rule. Omitted or null means 0; a
            pure read that never changes the episode_offset a later one-shot
            request carries. With one_shot it is the offset of every group.
        one_shot:
          type: boolean
          description: >-
            Omitted or false: the ordinary read. current_input only (400 INPUT_SOURCE_INVALID with any other mode).
            Reads the draft as a one-shot browse: a one-shot names its seed
            directly and is not bound by group selection, so every configured
            and observed group is listed with its supplied snapshot and seeds
            regardless of the draft's selection, and its one_shot download
            action never answers group_not_selected. Every group previews with
            episode_offset (the one-shot request's own offset), never a draft
            source's or a link's. A custom draft binds the exact persisted
            custom snapshot its single feed identity names instead of a
            saved-revision scope, so an unsaved one-shot configuration
            previews the seed it will download. An origin=one_shot draft
            binds the exact persisted search snapshot its single feed
            identity names (the refs carry the snapshot's scope/query pair);
            a missing, stale or expired identity fails 409
            FEED_SNAPSHOT_REFRESH_REQUIRED, never re-searched. A pure read.
    RSSListViewVersions:
      type: object
      additionalProperties: false
      required: [parser, evaluator, renderer, safety, torrent_parser]
      description: >-
        The exact version set the whole view was produced by. A consumer can
        tell which derivation produced any file decision from this one block.
      properties:
        parser:
          type: string
          minLength: 1
        evaluator:
          type: string
          minLength: 1
        renderer:
          type: string
          minLength: 1
        safety:
          type: string
          minLength: 1
        torrent_parser:
          type: string
          minLength: 1
    RSSListGroupScope:
      type: object
      additionalProperties: false
      required: [provider, provider_entry_ref, provider_group_ref]
      description: >-
        The full identity of one subgroup. Display name, score and array
        position are never identity: two groups may share a name, and the same
        group appears in many responses.
      properties:
        provider:
          $ref: '#/components/schemas/SubscriptionOrigin'
        provider_entry_ref:
          type: string
          maxLength: 256
          description: Empty for materialized custom/oneshot RSS sources; provider entry reference for anibt/mikan groups.
        provider_group_ref:
          type: string
          minLength: 1
          maxLength: 256
        rss_source_id:
          allOf:
            - $ref: '#/components/schemas/ID'
          nullable: true
          description: Present only for a materialized owner source.
    RSSListGroupSelection:
      type: object
      additionalProperties: false
      required: [effective_selected, selection_mode, count_in_limit, source]
      description: >-
        Server-derived selection state. The browser never infers authorization
        from rank styling: an unselected group's items are readable but can
        never be downloaded.
      properties:
        source:
          type: string
          enum: [configured, observed_default]
          description: >-
            configured: the draft or the Global section configures this group.
            observed_default: the provider lists it but nobody configured it, so
            it took the provider default policy.
        effective_selected:
          type: boolean
        selection_mode:
          $ref: '#/components/schemas/SelectionMode'
        count_in_limit:
          type: boolean
        reason_code:
          type: string
          nullable: true
          description: >-
            Why this group is in its selection state, produced by the same
            group-selection decision as effective_selected. Selected groups
            carry policy_always or ranked_within_max_rss; unselected groups
            carry policy_never, policy_score_negative or max_rss_exhausted;
            provider_group_not_observed means the provider no longer lists the
            group. Null when the decision engine did not cover the group
            (a custom source has no provider competition) or when replaying the
            decision does not reproduce the group's own state.
    RSSListOffset:
      type: object
      additionalProperties: false
      required: [value, editable, source]
      description: >-
        The episode offset this view resolved for one group, and where it came
        from. There is no inheritance and no second rule: the value is the
        group's own offset when it has one (a persisted link's stored offset,
        or the draft source that will become it), otherwise the read input's
        preview-only episode_offset, otherwise 0.
      properties:
        value:
          type: integer
          minimum: -1000
          maximum: 1000
          description: >-
            The effective offset this preview parsed and rendered this group
            with; 0 means no offset.
        source:
          type: string
          enum: [link, draft_source, preview_input, default]
          description: >-
            Provenance of value. link: a persisted RSS link's stored offset.
            draft_source: the matching draft source's episode_offset.
            preview_input: the read input's preview-only episode_offset, used
            only because this group has no offset of its own. default: no
            offset anywhere, value 0.
        editable:
          type: boolean
          description: >-
            True when this group's offset can be saved right now: the group is a
            persisted RSS link whose managed anime is still active, which is the
            same lifecycle fence the offset patch takes. A draft or preview
            group with no persisted link, and a retired anime, report false.
    RSSListFeedStatus:
      type: object
      additionalProperties: false
      required: [state]
      description: >-
        The persisted snapshot state of one group. A refresh failure keeps the
        last good snapshot readable and reports the failed attempt separately,
        so a group is never blanked by a transient provider error. snapshot_required
        means the selected group has no supplied advisory snapshot identity yet.
      properties:
        state:
          type: string
          enum: [fresh, stale, missing, superseded, corrupt, refresh_required, snapshot_required]
        snapshot_id:
          allOf:
            - $ref: '#/components/schemas/ID'
          nullable: true
        snapshot_version:
          allOf:
            - $ref: '#/components/schemas/Version'
          nullable: true
        content_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          nullable: true
        error_code:
          type: string
          nullable: true
        error_reason:
          type: string
          nullable: true
    RSSListSeedFacts:
      type: object
      additionalProperties: false
      required: [title, locator_display]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 512
        published_at:
          type: string
          format: date-time
          nullable: true
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        info_hash:
          type: string
          minLength: 1
          maxLength: 128
        expected_payload_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          x-mcp-omit: true
          description: >-
            SHA-256 digest of the complete persisted torrent bytes. Not part of
            the MCP seed view (x-mcp-omit): a seed reference is resolved
            server-side and needs no digest.
        locator_display:
          type: string
          maxLength: 2048
          x-mcp-omit: true
          x-secret: true
          description: >-
            Redacted display form of the source location. The raw locator stays
            server-side so an ordinary read cannot leak credentials. Withheld
            from MCP tool results (x-mcp-omit): it is the item's torrent URL with
            the query removed, and a path can still embed a key.
        anibt_tags:
          type: array
          description: >-
            The frozen AniBT structured tags ("dimension:value"; customTag values use the TagFilterRules sub-dimensions). Present only
            for releases observed through an AniBT source; may be empty.
          items:
            type: string
        title_tags:
          type: array
          description: >-
            The title-parse tags ("type:value") the title row of tag_filters
            evaluates: the frozen set of a persisted release, otherwise the
            pinned reltitle parser's reading of the seed title. May be empty.
          items:
            type: string
    TorrentManifestView:
      type: object
      additionalProperties: false
      required:
        [payload_digest, parser_version, torrent_version, torrent_name,
         total_size_bytes, file_count, projection_digest]
      description: >-
        The immutable file projection of one exact torrent payload. The payload
        digest binds it to the stored bytes and the projection digest covers the
        file set it declares, so a rendered file tree can always be proven to
        belong to the payload it came from.
      properties:
        payload_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        parser_version:
          type: string
          minLength: 1
        torrent_version:
          type: string
          enum: [v1, v2, hybrid]
        torrent_name:
          type: string
          minLength: 1
          maxLength: 512
        info_hash_v1:
          type: string
          minLength: 40
          maxLength: 40
        info_hash_v2:
          type: string
          minLength: 64
          maxLength: 64
        total_size_bytes:
          type: integer
          format: int64
          minimum: 0
        file_count:
          type: integer
          minimum: 1
        projection_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
    RSSListTorrentState:
      type: object
      additionalProperties: false
      required: [state]
      description: >-
        Torrent acquisition state of one seed. An unusable torrent keeps its
        place in the group with a bounded reason instead of disappearing, and it
        never fabricates a manifest. pending is the view's own state for a seed
        the server has not expanded yet: the persisted snapshot still records
        not_applicable and the row is rendered from RSS facts alone.
      properties:
        state:
          type: string
          enum: [available, unavailable, not_applicable, pending]
        error_code:
          type: string
          nullable: true
        error_reason:
          type: string
          nullable: true
        manifest:
          allOf:
            - $ref: '#/components/schemas/TorrentManifestView'
          nullable: true
    RSSListEvaluation:
      type: object
      additionalProperties: false
      required: [state]
      description: >-
        The parsed and filtered verdict of one seed, with the exact parser
        evidence that produced it. It is computed once from the frozen config
        and snapshot identity; a later read never re-interprets it. pending is
        the evaluation of a seed that was never expanded: neither the title
        parse nor the file filter ran for it.
      properties:
        state:
          type: string
          enum: [evaluated, not_selected, unavailable, reevaluating, pending]
        verdict:
          allOf:
            - $ref: '#/components/schemas/ReleaseVerdict'
          nullable: true
        reason_code:
          type: string
          nullable: true
          description: >-
            Typed verdict reason. Tag filter reasons (verdict filtered):
            anibt_tag_missing (non-empty AniBT require list, release has no
            tag), anibt_tag_whitelist_unmet (reason_detail "missing: <tags>"),
            anibt_tag_blacklisted (reason_detail "blacklisted: <tags>");
            title_tag_missing, title_tag_whitelist_unmet and
            title_tag_blacklisted are the same three outcomes of the
            title-parse row.
        reason_detail:
          type: string
          nullable: true
        parsed_facts:
          allOf:
            - $ref: '#/components/schemas/ParsedReleaseFacts'
          nullable: true
    RSSListFile:
      type: object
      additionalProperties: false
      required: [file_ref, ordinal, source_path, filename, included, safety]
      description: >-
        One projected file of a seed's exact torrent manifest with its own
        filter verdict and rendered target. An excluded or unrenderable file
        stays in the list so the reader can see what was filtered and why. A
        file that failed one of the two hard gates (below the torrent's first
        level, or neither video nor subtitle) is not a candidate and takes no
        row at all: the plan and the download cleanup still classify it, but it
        is never published as an RSS file row. Size and media kind are read from
        that exact manifest: a file the release never parsed keeps them absent,
        so an unknown file is never published as a 0-byte file of kind "other",
        and a seed whose structure was never acquired lists no file row at all.
      properties:
        file_ref:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          description: >-
            Stable identity of this file inside its payload. It is derived from
            the payload digest and the canonical source path, so it survives a
            re-parse and cannot be confused with a same-named file elsewhere.
        ordinal:
          type: integer
          minimum: 0
        source_path:
          type: string
          minLength: 1
          maxLength: 2048
        filename:
          type: string
          minLength: 1
          maxLength: 512
        size_bytes:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Size of this file in bytes, taken from the seed's exact torrent
            manifest. Absent for a file the release never parsed; the preview
            layer does not fabricate 0 for a file it has not read.
        media_kind:
          type: string
          enum: [video, subtitle, other]
          description: >-
            Product classification of this file, taken from the seed's exact
            torrent manifest. Absent for a file the release never parsed, so an
            absent value is never reported as the "other" kind.
        language:
          type: string
        bound_video_source_path:
          type: string
          description: >-
            Source path, inside this same torrent, of the video a bound
            subtitle follows under the plan's own strict-prefix binding. It is
            the server's decision, so the reader lists the subtitle under that
            video instead of binding it again itself. Present only for a
            subtitle bound to a video of the same release; absent for a video
            and for a subtitle bound to no video.
        sub_lang:
          type: string
          description: >-
            A subtitle's resolved language codes (the sub.lang naming fact,
            e.g. JPN+SC): read from the subtitle's own filename tag first,
            otherwise from the release title. Read-only evidence. Absent for a
            video and for a subtitle with no language.
        sub_lang_tag:
          type: string
          description: >-
            The one language tag of sub_lang (the sub.lang_tag naming fact,
            e.g. zh-Hans), the shipped default subtitle suffix. Absent when no
            code has a tag.
        sub_lang_source:
          type: string
          enum: [file, release]
          description: >-
            Where sub_lang was read: the subtitle's own filename tag (file) or
            the release title (release). Absent with sub_lang.
        included:
          type: boolean
        reason_code:
          type: string
        rendered_target:
          type: string
          description: >-
            The target this file would land on. A subtitle bound to a video of
            the same release follows that video: the target is the video's own
            directory and basename, the subtitle suffix the naming rules render
            for it, and the subtitle's own extension (the placement stage's
            companion rule, which the preview and the placement stage compose
            from one shared function), never a render of the subtitle naming
            template, so the preview cannot show a path the placement stage
            would not produce.
        empty_facts:
          type: array
          maxItems: 64
          items:
            type: string
            minLength: 1
            maxLength: 128
          description: >-
            Naming facts (catalog paths such as anime.year) that are defined
            for this file but have no value, so they rendered empty. An empty
            value renders as an empty string and the path is normalized; only
            an invalid result fails. With rendered_target these facts rendered
            empty in it. On a failure they are the facts the failure names:
            reason_code naming_fact_missing_<first fact> when empty values left
            the path invalid, naming_fact_undefined_<first fact> when the
            template reads a variable that is not defined for this file (for
            example bgm.* without a Bangumi binding). Absent when nothing
            rendered empty or when rendered_target is a frozen target.
        render_error:
          type: string
          maxLength: 512
        safety:
          type: string
          enum: [valid, invalid, unsafe]
        in_library:
          type: boolean
          nullable: true
          description: >-
            Read-only library fact of this one file: true when the library
            already holds this file's rendered target under an active verified
            placement, false when the seed's write set was compared and this
            file's target is not held. Null when this file is outside the
            seed's write set (it is not included, or its safety verdict is not
            valid), and null for every file when the seed's library_overlap
            verdict is undetermined: a file the server did not compare is never
            reported as false. In owner mode a file that carries library_path
            is true wherever its placement now sits (an alignment move leaves
            the rendered target behind), and the seed's library_overlap counts
            it as present when it was compared.
        library_path:
          type: string
          maxLength: 4096
          description: >-
            Owner mode only: where an imported file of this release is now,
            the current path of the active placement (video) or active
            companion (subtitle) its file operation produced, relative to the
            library (the same display root as the per-anime files list: the
            deepest folder of the anime's files, keeping anime folder / season
            folder / file). Absent for a file that is not in the library; such
            a file keeps rendered_target.
        library_new_path:
          type: string
          maxLength: 4096
          description: >-
            Owner mode only, with library_path: the path the anime's current
            naming rules render for this file when it differs from
            library_path (pending alignment), relative to the same root. It is
            rendered server-side by the per-anime files list's renderer. Absent
            when the paths agree or the render has no result.
    RSSListDownloadAction:
      type: object
      additionalProperties: false
      required: [allowed, kind]
      description: >-
        Server-derived download capability for one item. The browser explains
        this result; it never reproduces the admission policy itself. A missing
        qBittorrent connection blocks this object only and never the parsing,
        filtering or rendering above it. kind retry runs the owner's Release
        through normal acceptance again (retryRelease); when it is not allowed
        reason_code is one of owner_retired, already_present,
        download_in_progress, processing_in_progress, already_placed,
        post_download_failed, present_at_resume, not_started. A one_shot row that is not allowed instead names
        its own gate: group_not_selected, snapshot_refresh_required,
        seed_not_expanded (the seed exists in a fresh snapshot but was never
        expanded; expand it first, nothing is delivered by this action),
        torrent_payload_unavailable, seed_identity_mismatch (the expanded
        torrent's infohash or digest contradicts the identity the feed
        published), strong_identity_missing (no identity from the feed and
        none computable from the expanded torrent), evaluation_unavailable or
        published_at_missing. A seed's identity is the infohash its feed
        published, else the infohash of its expanded torrent; admission freezes
        that identity.
        Every row of a pending subscription's test bench is kind none with
        reason_code not_started, except that with new_releases_only a row
        published before the instance was created (or without a publish time)
        is kind none with reason_code start_baseline: started, it would take
        the start_baseline verdict.
      properties:
        allowed:
          type: boolean
        kind:
          type: string
          enum: [one_shot, retry, none]
        reason_code:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
    LibraryOverlap:
      type: object
      additionalProperties: false
      required: [verdict]
      description: >-
        Read-only per-seed library overlap fact, computed by the server from
        the placements the library already holds. It only reads: it creates no
        placement, reserves no path and produces no WorkItem, and it is a fact
        rather than a plan, so pending_files counts files this seed would still
        have to write without promising that write. undetermined is a
        first-class answer and is never folded into absent: it means the
        overlap cannot be decided (no write set to compare, or a server with
        no library facts to read at all), and both counts and every per-file
        in_library value are then null.
      properties:
        verdict:
          type: string
          enum: [present, absent, undetermined]
          description: >-
            present: at least one file of this seed's write set already has its
            rendered target held by the library. absent: every write-set file's
            target is decidable and none is held. undetermined: the overlap
            cannot be decided for this seed.
        present_files:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            Number of write-set files whose rendered target the library
            already holds. Null exactly when verdict is undetermined.
        pending_files:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            Number of write-set files the library does not hold yet. Null
            exactly when verdict is undetermined.
        reason_code:
          type: string
          nullable: true
          description: >-
            Stable code explaining an undetermined verdict. Null when the
            verdict needs no explanation. no_rendered_targets: this seed's
            write set cannot be compared, because its structure was never
            established (its torrent facts were not acquired, or it carries no
            file row at all) or because a file it would place has no rendered
            target. library_unavailable: the server has no library facts to
            read at all, so no overlap can be decided.
    RSSListItem:
      type: object
      additionalProperties: false
      required:
        [snapshot_id, stable_seed_key, seed, torrent, evaluation, files,
         download_action, library_overlap]
      description: >-
        One RSS seed with its exact torrent structure, evaluation and rendered
        files. The seed identity is (snapshot_id, stable_seed_key): the stable
        key alone is only unique inside one snapshot. Owner-mode rows
        (snapshot_id "release:<id>") use the release id as the key, never the
        release's item key.
      properties:
        snapshot_id:
          $ref: '#/components/schemas/ID'
        stable_seed_key:
          type: string
          minLength: 1
          maxLength: 256
        seed:
          $ref: '#/components/schemas/RSSListSeedFacts'
        torrent:
          $ref: '#/components/schemas/RSSListTorrentState'
        evaluation:
          $ref: '#/components/schemas/RSSListEvaluation'
        files:
          type: array
          items:
            $ref: '#/components/schemas/RSSListFile'
        download_action:
          $ref: '#/components/schemas/RSSListDownloadAction'
        library_overlap:
          $ref: '#/components/schemas/LibraryOverlap'
    RSSListGroup:
      type: object
      additionalProperties: false
      required: [scope, display_name, selection, offset, feed, items]
      properties:
        scope:
          $ref: '#/components/schemas/RSSListGroupScope'
        display_name:
          type: string
          minLength: 1
          maxLength: 256
        score:
          type: integer
        selection:
          $ref: '#/components/schemas/RSSListGroupSelection'
        offset:
          $ref: '#/components/schemas/RSSListOffset'
        feed:
          $ref: '#/components/schemas/RSSListFeedStatus'
        items:
          type: array
          items:
            $ref: '#/components/schemas/RSSListItem'
    RSSListView:
      type: object
      additionalProperties: false
      required: [mode, config_identity, metadata_hold, versions, generated_at, groups, unused_feed_identities, truncated, limit_per_group]
      description: >-
        The one RSS page read model: subgroup to seed to torrent file. It is a
        composed, non-persisted read result, never an owner state, and is the
        only RSS read model for all four modes. unused_feed_identities lists
        advisory input snapshots that did not match an effective-selected
        group. In owner modes, truncated indicates that at least one group was
        limited to limit_per_group items.
      properties:
        mode:
          type: string
          enum: [current_input, candidate_revision, owner, owner_draft]
        config_identity:
          type: string
          minLength: 1
          description: >-
            The exact configuration identity this view was computed from, so a
            stale response can never be mistaken for the current one.
        metadata_hold:
          $ref: '#/components/schemas/MetadataHold'
        versions:
          $ref: '#/components/schemas/RSSListViewVersions'
        generated_at:
          type: string
          format: date-time
        groups:
          type: array
          items:
            $ref: '#/components/schemas/RSSListGroup'
        unused_feed_identities:
          type: array
          items:
            $ref: '#/components/schemas/PreviewFeedSnapshotRef'
          description: Supplied advisory identities that were not used for a selected group.
        truncated:
          type: boolean
          description: True when an owner-mode group was limited by limit_per_group.
        observation:
          allOf:
            - $ref: '#/components/schemas/RSSListObservation'
          nullable: true
          description: >-
            Present only when the request named an observation: which one the
            view used, or that it is no longer retained and the view was
            composed without it.
        limit_per_group:
          type: integer
          minimum: 1
          maximum: 500
          description: Applied per-group item cap in owner modes; 100 by default.
    SystemHealth:
      type: object
      additionalProperties: false
      required: [status, database, checked_at]
      properties:
        status:
          type: string
          enum: [healthy]
        database:
          type: string
          enum: [healthy]
        checked_at:
          type: string
          format: date-time
    LivezReport:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [alive]
    ReadinessReport:
      type: object
      additionalProperties: false
      required: [ready, reason, checks, checked_at]
      properties:
        ready:
          type: boolean
        reason:
          type: string
          description: >
            "ready", "degraded:<code>", or "not_ready:<comma-separated codes>".
            Stable machine-readable admission verdict.
        checks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ReadinessCheck'
        checked_at:
          type: string
          format: date-time
        deployment_identity:
          description: >
            Three-layer deployment identity of the running process (base image
            digest / selected release and source / payload digest / update
            operation). Present only when the process was launched through the
            update-aware bootstrap wrapper; null otherwise.
          allOf:
            - $ref: '#/components/schemas/DeploymentIdentity'
          nullable: true
    DeploymentIdentity:
      type: object
      additionalProperties: false
      properties:
        base_image_digest:
          type: string
          description: Immutable base image digest layer, when the deployment provides it.
        selected_release_id:
          type: string
          description: Overlay release id this process serves (empty for base launches).
        selected_source:
          type: string
          enum: [base, overlay]
          description: Whether the served tree comes from the base image or the updates-volume overlay.
        payload_digest:
          type: string
          description: Signed payload digest of the selected release (empty when not provable).
        update_operation_id:
          type: string
          description: Durable update operation that produced this selection (empty when not provable).
        process_build_id:
          type: string
          description: Build id of the running server binary (the BuildInfo layer, filled by the server).
    ReadinessCheck:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
        code:
          type: string
          description: Stable per-check status code (ok, unreachable, mismatch,
            serving, maintenance, degraded, ...).
        detail:
          type: string
    BootstrapStatus:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          type: string
          enum: [bootstrap_required, owner_exists]
    CreateOwnerInput:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 12
          maxLength: 1024
        session_transport:
          type: string
          enum: [cookie, token]
          default: cookie
          description: >-
            Where the new session credential goes, exactly as in LoginInput:
            `cookie` (the default) is the browser path, `token` returns it in
            the body for the CLI and scripts.
    LoginInput:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 1
          maxLength: 1024
        session_transport:
          type: string
          enum: [cookie, token]
          default: cookie
          description: >-
            Where the new session credential goes. `cookie` (the default) sets
            an HttpOnly, SameSite=Strict session cookie and omits the token from
            the body: the browser then never holds the credential in script
            reach. `token` returns it in the body for a non-browser client (the
            CLI, a script) that keeps its own store. A browser-issued login that
            omits the field gets a cookie, so a caller that wants the raw token
            has to ask for it.
    OwnerAccount:
      type: object
      additionalProperties: false
      required: [id, username, role]
      properties:
        id:
          $ref: '#/components/schemas/ID'
        username:
          type: string
        role:
          type: string
          enum: [owner]
    LoginResult:
      type: object
      additionalProperties: false
      required: [expires_at, owner]
      properties:
        session_token:
          type: string
          minLength: 32
          description: >-
            Present only when the request asked for `session_transport=token`.
            A cookie-transport login carries the credential in an HttpOnly
            cookie instead, so script never sees it.
        expires_at:
          type: string
          format: date-time
        owner:
          $ref: '#/components/schemas/OwnerAccount'
    AuthSession:
      type: object
      additionalProperties: false
      required: [owner, expires_at]
      properties:
        owner:
          $ref: '#/components/schemas/OwnerAccount'
        expires_at:
          type: string
          format: date-time
    AccountUpdateInput:
      type: object
      additionalProperties: false
      required: [current_password]
      description: >-
        Change the owner username and/or password. At least one of username or
        new_password must be present. The current password is always re-checked.
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 1024
        username:
          type: string
          minLength: 1
          maxLength: 128
        new_password:
          type: string
          minLength: 12
          maxLength: 1024
    AccountUpdateResult:
      type: object
      additionalProperties: false
      required: [owner, other_sessions_revoked]
      properties:
        owner:
          $ref: '#/components/schemas/OwnerAccount'
        other_sessions_revoked:
          type: boolean
          description: >-
            True when a password change revoked at least one other web session.
            The current session and API tokens stay valid.
    ApiTokenScope:
      type: string
      enum: [read, write, secrets]
      description: >-
        read: read-only operations (GET and read-only POST previews). write:
        operations that change state, including starting work. secrets: fields
        marked x-secret are returned as stored instead of the fixed placeholder
        "[secret]". Every token holds read.
    ApiTokenScopes:
      type: array
      minItems: 1
      maxItems: 3
      uniqueItems: true
      items:
        $ref: '#/components/schemas/ApiTokenScope'
    ApiTokenCreateInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        scopes:
          allOf:
            - $ref: '#/components/schemas/ApiTokenScopes'
          description: >-
            Scope set of the new token, fixed for its lifetime (rotation keeps
            it). Must include read. Omitted means [read, write]. A token can
            only be created with scopes the caller itself holds.
    ApiTokenCreateResult:
      type: object
      additionalProperties: false
      required: [token, token_id, scopes, created_at]
      properties:
        scopes:
          $ref: '#/components/schemas/ApiTokenScopes'
        token:
          type: string
          minLength: 32
          maxLength: 128
          description: The raw long-lived API token. Its hash authenticates; the raw value is encrypted at rest so it can be re-shown or copied for the token's lifetime.
        token_id:
          type: string
        created_at:
          type: string
          format: date-time
    ApiTokenRaw:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 128
          description: The raw long-lived API token value, encrypted at rest and returned on demand.
    ApiToken:
      type: object
      additionalProperties: false
      required: [id, name, scopes, created_at]
      description: Metadata of an active long-lived API token. Revoked tokens are deleted and never returned.
      properties:
        id:
          type: string
        name:
          type: string
        scopes:
          $ref: '#/components/schemas/ApiTokenScopes'
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
    ConnectionInput:
      oneOf:
        - $ref: '#/components/schemas/QBittorrentConnectionInput'
        - $ref: '#/components/schemas/RSSHTTPConnectionInput'
        - $ref: '#/components/schemas/TMDBConnectionInput'
        - $ref: '#/components/schemas/AniBTConnectionInput'
        - $ref: '#/components/schemas/MikanConnectionInput'
        - $ref: '#/components/schemas/BGMConnectionInput'
      discriminator:
        propertyName: kind
        mapping:
          qbittorrent: '#/components/schemas/QBittorrentConnectionInput'
          rss_http: '#/components/schemas/RSSHTTPConnectionInput'
          tmdb: '#/components/schemas/TMDBConnectionInput'
          anibt: '#/components/schemas/AniBTConnectionInput'
          mikan: '#/components/schemas/MikanConnectionInput'
          bgm: '#/components/schemas/BGMConnectionInput'
    ConnectionSecretKeep:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [keep]
    ConnectionSecretReplace:
      type: object
      additionalProperties: false
      required: [mode, value]
      properties:
        mode:
          type: string
          enum: [replace]
        value:
          type: string
          minLength: 1
          maxLength: 1024
    ConnectionSecretRemove:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [remove]
    ConnectionSecret:
      oneOf:
        - $ref: '#/components/schemas/ConnectionSecretKeep'
        - $ref: '#/components/schemas/ConnectionSecretReplace'
        - $ref: '#/components/schemas/ConnectionSecretRemove'
      discriminator:
        propertyName: mode
        mapping:
          keep: '#/components/schemas/ConnectionSecretKeep'
          replace: '#/components/schemas/ConnectionSecretReplace'
          remove: '#/components/schemas/ConnectionSecretRemove'
    QBittorrentConnectionInput:
      type: object
      additionalProperties: false
      required: [kind, name, enabled, base_url, username, secret]
      properties:
        kind:
          type: string
          enum: [qbittorrent]
        name:
          type: string
          minLength: 1
          maxLength: 128
        enabled:
          type: boolean
        base_url:
          type: string
          format: uri
        username:
          type: string
          maxLength: 256
        secret:
          $ref: '#/components/schemas/ConnectionSecret'
        route_id:
          $ref: '#/components/schemas/ID'
        download_root:
          type: string
          minLength: 1
          maxLength: 1024
        downloader_root:
          type: string
          minLength: 1
          maxLength: 1024
          description: >-
            Optional host-readable root that maps download_root (the savepath
            handed to the download client, which may live in a container) onto
            the app filesystem. Empty means the same-path convention:
            download_root is already host-readable.
        category:
          type: string
          maxLength: 256
        user_tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 256
    RSSHTTPConnectionInput:
      type: object
      additionalProperties: false
      required: [kind, name, enabled]
      properties:
        kind:
          type: string
          enum: [rss_http]
        name:
          type: string
          minLength: 1
          maxLength: 128
        enabled:
          type: boolean
        route_id:
          $ref: '#/components/schemas/ID'
    TMDBConnectionInput:
      type: object
      additionalProperties: false
      required: [kind, name, enabled, base_url, secret]
      properties:
        kind:
          type: string
          enum: [tmdb]
        name:
          type: string
          minLength: 1
          maxLength: 128
        enabled:
          type: boolean
        base_url:
          type: string
          format: uri
        secret:
          $ref: '#/components/schemas/ConnectionSecret'
        route_id:
          $ref: '#/components/schemas/ID'
    AniBTConnectionInput:
