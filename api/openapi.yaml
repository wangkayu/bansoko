    GlobalSectionName:
      type: string
      description: >-
        One typed global config section. download_timeouts (schema
        download-timeouts-v1, value DownloadTimeouts) and metadata_refresh
        (schema metadata-refresh-v1, value MetadataRefresh) are Global-only:
        they have no per-anime override, no draft field and are not part of the
        business snapshot.
      enum: [subgroups, parser, release_rules, file_rules, naming_rules, file_effect, tag_filters, download_completion, download_timeouts, metadata_refresh]
    GlobalSectionView:
      type: object
      additionalProperties: false
      required: [section_name, schema_version, value, version, saved]
      properties:
        section_name:
          $ref: '#/components/schemas/GlobalSectionName'
        schema_version:
          type: string
        value:
          type: object
          additionalProperties: true
          description: The stored section object.
        version:
          type: integer
          format: int64
        saved:
          type: boolean
          description: >-
            True when a persisted global row exists for the section; false when
            the value is the built-in code default. The version alone cannot tell
            them apart, because a first save is stored at version 1.
    GlobalSectionInput:
      type: object
      additionalProperties: false
      required: [schema_version, value]
      properties:
        schema_version:
          type: string
        value:
          type: object
          additionalProperties: true
          description: The complete section object to store.
    DownloadTimeouts:
      type: object
      additionalProperties: false
      required: [stall_seconds, download_wait_seconds]
      description: >-
        The Global download_timeouts setting (schema download-timeouts-v1),
        edited only in the settings page. stall_seconds is how long a download
        may make no progress before it fails as stalled; download_wait_seconds
        is the longest an accepted download may wait in total. stall_seconds
        must not exceed download_wait_seconds (SECTION_VALUE_INVALID on
        value.stall_seconds). Acceptance reads the setting once and freezes
        both values into the acquisition limits, so a later save only affects
        downloads accepted after it; one-shot acquisitions use the same values.
        A missing row is the default (21600 / 604800). Waiting for a preferred
        group and a fallback after a timeout are not part of this setting.
      properties:
        stall_seconds:
          type: integer
          format: int64
          minimum: 600
          maximum: 604800
        download_wait_seconds:
          type: integer
          format: int64
          minimum: 3600
          maximum: 2592000
    MetadataRefresh:
      type: object
      additionalProperties: false
      required: [enabled]
      description: >-
        The Global metadata_refresh setting (schema metadata-refresh-v1),
        edited only in the settings page. enabled turns on the background sweep
        that re-pulls the bound Bangumi and TMDB works (titles and episode
        titles) of active subscriptions every 24 hours; stopped subscriptions
        are never refreshed. A missing row is the default (false). The sweep
        only updates cache rows, never bindings or owner records, and a failed
        re-pull is diagnosed once and retried by the next cycle.
      properties:
        enabled:
          type: boolean
    ProviderKind:
      type: string
      enum: [anibt, mikan]
    SnapshotSeedProvider:
      type: string
      description: >-
        Provenance provider of one selected one-shot seed. It repeats the
        two discovery provider kinds and adds custom for a seed read from a
        frozen custom/oneshot draft source's own feed snapshot. It is a
        seed-provenance vocabulary only: ProviderKind stays a two-value
        discovery enum, and a custom seed never becomes a discoverable
        provider, a subgroup, or a subscribable origin.
      enum: [anibt, mikan, custom]
    SubscriptionOrigin:
      type: string
      description: >-
        The unique four-value source-of-subscription enum: anibt | mikan are
        discovery providers, custom is a user-supplied manual source, agent is
        reserved for one-shot acquisition: an agent draft is a candidate
        snapshot for acquire-seed-once and the temporary one-shot mount
        carries it, but it can never be subscribed or activated (422
        ORIGIN_NOT_SUBSCRIBABLE). This is the only four-value enum;
        ProviderKind stays a two-value discovery enum, SnapshotSeedProvider is
        the separate seed-provenance vocabulary (anibt | mikan | custom), and
        RSS SourceKind stays provider_group | custom_rss.
      enum: [anibt, mikan, custom, oneshot]
    SubscriptionState:
      type: string
      description: >-
        User intent of the Subscription. pending (not started) is the creation
        state: the configuration is fully editable but nothing runs (no
        refresh, evaluation, acquisition or notification, manual commands
        included). pending -> active (patchAnimeSubscription with state active)
        is the first start and behaves like a new subscription: its first
        refresh discovers and evaluates the feed. active <-> stopped is
        stop/resume; the first refresh after a resume only records a baseline.
        There is no pending -> stopped transition and nothing returns to
        pending.
      enum: [pending, active, stopped]
    SourceKind:
      type: string
      description: >-
        RSS source wiring kind. provider_group is a discovered source produced
        by a provider; custom_rss is a manual source. This enum is NOT the
        four-value subscription origin: custom/oneshot origins may own
        custom_rss sources, and provider origins may have none at creation.
      enum: [provider_group, custom_rss]
    TMDBMediaKind:
      type: string
      enum: [tv, movie]
    ReleaseFormat:
      type: string
      enum: [tv, movie, ova, ona]
      description: >-
        Release format as a provider states it: tv, movie (剧场版), ova or ona
        (web release). On catalog items and anime list rows it is a read-only
        provider catalog fact (Mikan homepage section data-dayofweek 0–6 = tv,
        7 = movie, 8 = ova; AniBT format TV / MOVIE / OVA / ONA); on a Bangumi
        metadata search result it is the subject platform. It is never edited,
        never stored with anime metadata, never guessed from a title or the
        TMDB media kind, and naming does not read it.
    SelectionMode:
      type: string
      enum: [auto, manual]
    ProviderGroupDefaultMode:
      type: string
      enum: [blacklist, whitelist]
    ProviderGroupDefault:
      type: object
      additionalProperties: false
      required: [mode, score, groups]
      properties:
        mode:
          $ref: '#/components/schemas/ProviderGroupDefaultMode'
        score:
          type: integer
          minimum: 1
          maximum: 100
        groups:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 256
        pinned_scores:
          type: array
          maxItems: 512
          description: >-
            Live site policy (Global subgroups only; a per-anime copy is never
            read). A pinned group's final score is its pinned score: the site
            default score and every name keyword no longer apply to it. The site
            list still gates it (a blacklisted group stays excluded, a group
            outside a whitelist stays unselected) and a per-anime manual include
            or exclude still wins. Each group_ref is the provider's own
            normalized group key, pinned at most once.
          items:
            $ref: '#/components/schemas/PinnedGroupScore'
    PinnedGroupScore:
      type: object
      additionalProperties: false
      required: [group_ref, score]
      properties:
        group_ref:
          type: string
          minLength: 1
          maxLength: 256
          description: The provider's own group key (Mikan numeric id, AniBT slug).
        score:
          type: integer
          minimum: 1
          maximum: 100
    ProviderGroupDefaults:
      type: object
      additionalProperties: false
      properties:
        anibt:
          $ref: '#/components/schemas/ProviderGroupDefault'
        mikan:
          $ref: '#/components/schemas/ProviderGroupDefault'
    NameKeywordRule:
      type: object
      additionalProperties: false
      required: [keyword, score]
      properties:
        keyword:
          type: string
          minLength: 1
          maxLength: 256
        score:
          type: integer
          minimum: -100
          maximum: 100
    ProviderNameKeywordRules:
      type: object
      additionalProperties: false
      properties:
        anibt:
          type: array
          items:
            $ref: '#/components/schemas/NameKeywordRule'
        mikan:
