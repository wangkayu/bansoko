  /file-manager/mounts:
    get:
      tags: [FileManager]
      operationId: listFileManagerMounts
      x-scope: read
      description: >-
        The browser's quick entries: the filesystem root, each download
        connection's application-side root, and each work's tree top (the
        directory holding the files that work's own placements put on disk). A
        mount is a navigation shortcut only: it never bounds what may be read
        or written, and every read and write names an absolute path. Read-only;
        availability is resolved at read time.
      responses:
        '200':
          description: The quick entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileManagerMountList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /file-manager/entries:
    get:
      tags: [FileManager]
      operationId: listFileManagerEntries
      x-scope: read
      description: >-
        One sorted page of one absolute directory (directories first, then
        byte-wise name order), each entry with its derived ownership state and
        whether the product manages it. The path is absolute; it is refused
        when it names an application-data or system directory the browser never
        reads, and a relative path or any symlink component is refused. A
        symlink entry is listed but never followed. Only metadata is read (no
        hashing); one listing reads at most 10000 entries and reports
        `truncated` beyond that. The read writes nothing and observes nothing
        for scans.
      parameters:
        - $ref: '#/components/parameters/FileManagerPath'
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        '200':
          description: One page of the directory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileManagerListing'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /file-manager/entry:
    get:
      tags: [FileManager]
      operationId: getFileManagerEntry
      x-scope: read
      description: >-
        Read-only detail of one absolute entry path: its derived state, whether
        the product manages it, the anime and execution record that own it,
        unfinished owners holding it, the video a bound sidecar follows or the
        sidecars of a video, the operations its state allows or refuses, the
        latest user operation on it, and the revision every write on it must
        name.
      parameters:
        - name: path
          in: query
          required: true
          description: Absolute entry path.
          schema:
            type: string
            minLength: 1
            maxLength: 4096
