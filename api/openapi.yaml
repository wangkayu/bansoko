  /acquisitions/{acquisition_id}/import/retry:
    post:
      tags: [Releases]
      operationId: retryAcquisitionImport
      x-scope: write
      x-mcp:
        tool: retry_import
        group: records
        write: true
        description: >-
          Retry the import (file_execution) stage of one settled execution record. Every
          failed file of the acquisition is placed again and every failed placement
          handoff is reopened; files that succeeded are untouched, no earlier stage runs
          again and nothing is downloaded again. Works for subscription and one-shot
          records. Send the record's version as If-Match and a fresh Idempotency-Key;
          import_retry_available on the record says whether the retry is accepted now.
          Fails with IMPORT_RETRY_IN_FLIGHT while the record still runs,
          IMPORT_RETRY_NOT_APPLICABLE when nothing in the import stage failed,
          MANAGED_ANIME_RETIRED for a retired owner and OWNER_VERSION_CONFLICT for a stale
          version.
      description: >-
        Retries the import (file_execution) stage of one settled record. Each
        failed file effect is reset and queued again from the durable file
        operations of the acquisition, so it works after the failed work items
        were pruned; each failed placement handoff of a completed file is
        reopened. Succeeded files are untouched, no earlier stage is redone and
        nothing is downloaded again. A failed record runs again and settles
        anew; the record keeps the attempt count. If-Match carries the record
        version the caller saw. The same Idempotency-Key replays the accepted
        result. 409 IMPORT_RETRY_IN_FLIGHT while the record runs or has live
        work, IMPORT_RETRY_NOT_APPLICABLE when the import stage has nothing
        failed (or the record is compact, cancelled, or a reclaimed one-shot),
        MANAGED_ANIME_RETIRED for a retired owner, OWNER_VERSION_CONFLICT for a
        stale version, IDEMPOTENCY_KEY_REUSED for a reused key with another
        version.
      parameters:
        - $ref: '#/components/parameters/AcquisitionID'
        - $ref: '#/components/parameters/IfMatchVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: The import stage runs again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcquisitionImportRetryResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
