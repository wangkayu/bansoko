            Provider feed URL of the group. Withheld from MCP tool results
            (x-mcp-omit): a feed URL can embed a private key.
        observed_at:
          type: string
          format: date-time
    ProviderGroupDiscoveryResult:
      type: object
      additionalProperties: false
      required: [provider, provider_entry_ref, observed_at, source_version, schema_version, snapshot_version, groups]
      properties:
        provider:
          $ref: '#/components/schemas/ProviderKind'
        provider_entry_ref:
          type: string
          minLength: 1
          maxLength: 256
        observed_at:
          type: string
          format: date-time
        source_version:
          type: string
          minLength: 1
          maxLength: 128
        schema_version:
          type: string
          minLength: 1
          maxLength: 128
        snapshot_version:
          $ref: '#/components/schemas/Version'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/ProviderGroupDiscoveryGroup'
    SeedSearchSnapshotInput:
      type: object
      additionalProperties: false
      required: [query]
      description: >-
        One keyword torrent search. Only the free-text query is accepted: the
        endpoint, the normalization and the snapshot scope are derived
        server-side, so no URL, entry, group, seed key or torrent byte can be
        supplied. The response renders the snapshot's complete seed window: both
        sites answer at most 100 keyword results, so that window is also the
        complete result set.
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 256
          description: >-
            A space-composed keyword query. Combine the work title with a
            subtitle group, an episode number or a resolution to narrow the
            upstream result (for example "示例作品 示例字幕组 03"); both sites
            match the text themselves and the first release adds no filter.
    SeedSearchSnapshotSeed:
      type: object
      additionalProperties: false
      required: [stable_seed_key, title, download_url, torrent_state]
      properties:
        stable_seed_key:
          type: string
          minLength: 1
          maxLength: 256
          description: Stable identity within this search snapshot.
        title:
          type: string
          minLength: 1
          maxLength: 512
        published_at:
          type: string
          format: date-time
          nullable: true
        download_url:
          type: string
          minLength: 1
          maxLength: 2048
          x-mcp-omit: true
          x-secret: true
          description: >-
            Torrent download URL. It can embed a credential, so it stays a
            display fact for the caller that fetched the snapshot; an expand or
            download names the snapshot identity plus stable_seed_key instead
            and the server resolves the locator itself.
        size_bytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        info_hash:
          type: string
          minLength: 1
          maxLength: 128
          nullable: true
          description: >-
            Content identity the provider published for this seed, when it
            published one. A search row without it is expanded and cached like a
            feed row, and the expanded torrent's own hash becomes the identity.
        expected_payload_digest:
          type: string
          minLength: 71
          maxLength: 71
          pattern: '^sha256:[0-9a-f]{64}$'
          nullable: true
        torrent_state:
          type: string
          enum: [available, unavailable, not_applicable]
        group_name:
          type: string
          maxLength: 256
          nullable: true
          description: >-
            Subtitle group name parsed from the release title for display only.
            It is never a provider group identity and never a subscription or
            download input.
        resolution:
          type: string
          maxLength: 64
          nullable: true
          description: >-
            Resolution parsed from the release title for display only.
        title_hint:
          type: string
          maxLength: 512
          nullable: true
          description: >-
            Work-title candidate parsed from the release title for display
            only. It is never a work identity and never a subscription or
            download input; a caller may use it as the editable title default.
    SeedSearchSnapshotView:
      type: object
      additionalProperties: false
      required:
        [provider, scope_ref, query_ref, snapshot_id, snapshot_version,
         content_hash, freshness, total_seeds, retention_seconds, seeds]
      description: >-
        One immutable keyword search snapshot and its complete seed window.
        `total_seeds` counts the complete result set the snapshot identity
        covers, and `seeds` renders all of it. A search snapshot is
        short-lived (24 hours), is never a group or a subscription source, and is
        refreshed only by fetching the same query again.
      properties:
        provider:
          type: string
          enum: [anibt, mikan]
        scope_ref:
          type: string
          pattern: '^search-scope:[0-9a-f]{64}$'
        query_ref:
          type: string
          pattern: '^search-query:[0-9a-f]{64}$'
        query:
          type: string
          maxLength: 256
          nullable: true
          description: >-
            The normalized query, echoed by the fetch that ran it. The query
            text itself is not persisted, only its digest.
        snapshot_id:
          $ref: '#/components/schemas/ID'
        snapshot_version:
          $ref: '#/components/schemas/Version'
        content_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        fetched_at:
          type: string
          format: date-time
        fresh_until:
          type: string
          format: date-time
          description: >-
            The freshness window of this search snapshot. An expired snapshot
            requires a new search; it is never silently re-issued.
        freshness:
          type: string
          enum: [fresh, stale, missing]
        total_seeds:
          type: integer
          minimum: 0
        retention_seconds:
          type: integer
          minimum: 1
          description: >-
            The derived retention of a search snapshot (86400 seconds). After
            it, the snapshot may be purged, including its latest version.
        parser:
          type: string
          nullable: true
          description: >-
            The versioned reader that produced this snapshot's seed facts, for
            diagnosis when an upstream layout changes.
        seeds:
          type: array
          items:
            $ref: '#/components/schemas/SeedSearchSnapshotSeed'
    ProviderRSSPreviewInput:
      type: object
      additionalProperties: false
      required: [group_ref]
      properties:
        group_ref:
          type: string
          minLength: 1
          maxLength: 256
    ProviderRSSPreviewSeed:
      type: object
      additionalProperties: false
      required: [stable_seed_key, title, download_url]
      properties:
        stable_seed_key:
          type: string
          minLength: 1
          maxLength: 256
          description: Stable identity within this persisted feed snapshot.
        title:
          type: string
          minLength: 1
          maxLength: 512
        published_at:
          type: string
          format: date-time
          nullable: true
        download_url:
          type: string
          minLength: 1
          maxLength: 2048
          x-mcp-omit: true
          x-secret: true
          description: >-
            Torrent download URL. Withheld from MCP tool results (x-mcp-omit):
            it can embed a passkey. An agent selects the seed by snapshot
            identity plus stable_seed_key instead (SelectedSeedInput reference
            form).
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        info_hash:
          type: string
          minLength: 1
          maxLength: 128
        expected_payload_digest:
          type: string
          minLength: 71
          maxLength: 71
          pattern: '^sha256:[0-9a-f]{64}$'
          x-mcp-omit: true
          description: >-
            SHA-256 digest of the complete persisted torrent bytes when
            available. Not part of the MCP seed view (x-mcp-omit): a seed
            reference is resolved server-side and needs no digest.
    FeedSiteList:
      type: object
      additionalProperties: false
      required: [sites]
      properties:
        sites:
          type: array
          items:
            $ref: '#/components/schemas/FeedSite'
    FeedSite:
      type: object
      additionalProperties: false
      required: [id, name, hosts, identity, match]
      properties:
        id:
          type: string
          enum: [mikan, anibt, nyaa, acgrip, bangumi_moe, miobt, unit3d]
        name:
          type: string
          minLength: 1
        hosts:
          type: array
          items:
            type: string
            minLength: 1
          description: >-
            Declared hosts; a subdomain of one matches too. Empty for a
            content-matched entry.
        match:
          type: string
          enum: [host, content]
          description: >-
            host: a custom feed on one of the hosts uses this adapter.
            content: a tracker architecture (UNIT3D) whose hosts vary; a
            custom feed on an unlisted host uses this adapter when the feed
            itself carries the architecture's signature.
        identity:
          type: string
          enum: [feed, expansion]
          description: >-
            feed: the item's infohash is in the feed (an element or the
            download URL). expansion: it is known only once the torrent is
            fetched and parsed.
    ProviderRSSPreviewResult:
      type: object
      additionalProperties: false
      required: [provider, provider_entry_ref, group_ref, freshness, seeds]
      properties:
        provider:
          type: string
          enum: [anibt, mikan, custom]
        provider_entry_ref:
          type: string
          minLength: 1
          maxLength: 256
        group_ref:
          type: string
          minLength: 1
          maxLength: 256
        snapshot_id:
          $ref: '#/components/schemas/ID'
          nullable: true
        snapshot_version:
          $ref: '#/components/schemas/Version'
          nullable: true
        fetched_at:
          type: string
          format: date-time
          nullable: true
        observed_at:
          type: string
          format: date-time
          nullable: true
        freshness:
          type: string
          enum: [fresh, stale, missing]
        content_hash:
          type: string
          minLength: 8
          maxLength: 72
          pattern: '^sha256:[0-9a-f]{64}$'
          nullable: true
          description: SHA-256 digest of canonical typed seed facts, not a raw RSS body hash.
        seeds:
          type: array
          items:
            $ref: '#/components/schemas/ProviderRSSPreviewSeed'
    RulesPatch:
