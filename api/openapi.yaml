          maxLength: 256
        action:
          type: string
          enum: [force_include, force_exclude, restore_auto]
    AutomationKind:
      type: string
      enum: [group_discovery, rss_refresh, metadata_match, catalog_refresh]
    AutomationTrigger:
      type: string
      enum: [scheduled, manual]
    AutomationIntervalUnit:
      type: string
      enum: [minute, hour, day]
    AutomationState:
      type: string
      enum: [queued, running, completed, partial, failed]
    SubscriptionLogKind:
      type: string
      enum:
        - subscription_created
        - subscription_started
        - subscription_stopped
        - subscription_resumed
        - metadata_applied
        - group_changed
        - policy_changed
        - rss_new_content
        - rss_refresh_failed
        - release_processed
        - download_changed
        - artifact_verified
        - placement_changed
        - replacement_decided
        - cleanup_completed
        - file_alignment_completed
        - file_alignment_failed
        - acquisition_settled
    SubscriptionLogOutcome:
      type: string
      enum: [info, success, failure]
    ManagedAnime:
      type: object
      additionalProperties: false
      required: [id, title, version]
      description: >-
        Formal anime owner. The id is the sole formal owner identity. Provider
        refs, custom RSS locators/URLs, labels, titles, and other external
        attributes are not owner identity and may collide across owners.
      properties:
        id:
          $ref: '#/components/schemas/ID'
          description: Sole formal owner identity for this ManagedAnime.
        title:
          type: string
          minLength: 1
          maxLength: 512
        title_override:
          type: string
          nullable: true
          minLength: 1
          maxLength: 512
        version:
          $ref: '#/components/schemas/Version'
    Subscription:
      type: object
      additionalProperties: false
      required: [id, managed_anime_id, origin, state, lifecycle_state, lifecycle_epoch, version, new_releases_only]
      description: >-
        The single subscription owned by one ManagedAnime. Its active/stopped
        state is reversible automation intent; lifecycle_state is the separate
        irreversible active/retired owner boundary. Its external origin and
        origin_entry_ref are provenance attributes and are not formal owner
        identity; managed_anime_id points to the sole owner identity.
      properties:
        id:
          $ref: '#/components/schemas/ID'
          description: Identity of this subordinate Subscription row.
        managed_anime_id:
          $ref: '#/components/schemas/ID'
          description: Sole formal owner identity of the ManagedAnime owning this Subscription.
        origin:
          $ref: '#/components/schemas/SubscriptionOrigin'
        origin_entry_ref:
          type: string
          nullable: true
          minLength: 1
          maxLength: 256
          description: >-
            External provider/candidate provenance. It is non-unique and is not
            the formal owner identity; separate owners may carry the same value.
        instance_label:
          type: string
          nullable: true
          minLength: 1
          maxLength: 256
        state:
          $ref: '#/components/schemas/SubscriptionState'
        lifecycle_state:
          type: string
          enum: [active, retired]
        lifecycle_epoch:
          type: integer
          format: int64
          minimum: 1
        retired_at:
          type: string
          format: date-time
          nullable: true
        version:
          $ref: '#/components/schemas/Version'
        new_releases_only:
          type: boolean
          description: >-
            New releases only (只获取新种子). When true, a Release published
            before start_baseline_at, or without a publish time, takes the
            terminal verdict start_baseline instead of being evaluated; an
            explicit retryRelease still evaluates it through every rule.
            Changeable only while the subscription is pending
            (setAnimeNewReleasesOnly); frozen once started.
        start_baseline_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Baseline of new_releases_only: the instance creation time (the
            subscribe that created it, not the first start). Present exactly
            when new_releases_only is true.
    BGMBinding:
      type: object
      additionalProperties: false
      required: [work_id]
      properties:
        work_id:
          type: string
          minLength: 1
          maxLength: 128
    TMDBBinding:
      type: object
      additionalProperties: false
      required: [work_id, media_kind, season]
      properties:
        work_id:
          type: string
          minLength: 1
          maxLength: 128
        media_kind:
          $ref: '#/components/schemas/TMDBMediaKind'
        season:
          type: integer
          minimum: 0
    NullableBGMBinding:
      allOf:
        - $ref: '#/components/schemas/BGMBinding'
      nullable: true
    NullableTMDBBinding:
      allOf:
        - $ref: '#/components/schemas/TMDBBinding'
      nullable: true
    AnimeMetadataDraft:
      type: object
      additionalProperties: false
      description: >-
        The draft metadata bindings. bgm and tmdb carry the match bindings
        selected for this draft: the candidate write path stores them, and the
        stored binding is then the naming fact source (title/kind) of
        every render of that exact revision. A draft that selects no match
        keeps both null: no default binding is fabricated, and a template that
        reads bgm.* or tmdb.* fails as an undefined variable until one is
        selected.
      properties:
        bgm:
          $ref: '#/components/schemas/NullableBGMBinding'
        tmdb:
          $ref: '#/components/schemas/NullableTMDBBinding'
        media_kind_override:
          type: string
          nullable: true
          enum: [tv, movie]
          description: >-
            Owner pin of the frozen media kind. NULL means unset; the frozen
            kind is then the TMDB binding's media_kind, then the unbound TV
            default. It never rewrites the TMDB tuple.
        total_episodes:
          type: integer
          nullable: true
          minimum: 0
          description: Planned total episode count for the series.
        year:
          type: integer
          nullable: true
          minimum: 1900
          maximum: 2100
          description: >-
            Owner-edited year that naming reads as anime.year. NULL means unset
            and anime.year renders empty. It is never read from metadata;
            matching TMDB in the UI only fills the form with the work's year
            until the owner saves.
        season:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            Owner-edited season that naming reads as anime.season (and
            anime.season_folder, anime.season_path, ep.s00e00); 0 is the specials
            season. NULL means unset: the season composites render empty and
            ep.s00e00 renders the episode alone (E07). The shipped TV
            directory template keeps anime.season_folder as its own folder
            level, so a season-less render refuses
            (naming_fact_missing_anime_season_folder). It is independent of
            the TMDB binding:
            tmdb.season stays the bound TMDB season used for TMDB episode
            lookups, and editing one never changes the other. Confirming a
            TMDB match in the UI fills it with the matched season only while it
            is unset; nothing is stored until the owner saves.
    AnimeMetadata:
      type: object
      additionalProperties: false
      required: [managed_anime_id, version]
      properties:
        managed_anime_id:
          $ref: '#/components/schemas/ID'
        bgm:
          $ref: '#/components/schemas/NullableBGMBinding'
        tmdb:
          $ref: '#/components/schemas/NullableTMDBBinding'
        media_kind_override:
          type: string
          nullable: true
          enum: [tv, movie]
          description: >-
            Owner pin of the frozen media kind. NULL means unset; the frozen
            kind is then the TMDB binding's media_kind, then the unbound TV
            default. It never rewrites the TMDB tuple.
        total_episodes:
          type: integer
          nullable: true
          minimum: 0
          description: Planned total episode count for the series.
        year:
          type: integer
          nullable: true
          minimum: 1900
          maximum: 2100
          description: >-
            Owner-edited year that naming reads as anime.year. NULL means unset
            and anime.year renders empty. It is never read from metadata;
            matching TMDB in the UI only fills the form with the work's year
            until the owner saves.
        season:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            Owner-edited season that naming reads as anime.season (and
            anime.season_folder, anime.season_path, ep.s00e00); 0 is the specials
            season. NULL means unset: the season composites render empty and
            ep.s00e00 renders the episode alone (E07). The shipped TV
            directory template keeps anime.season_folder as its own folder
            level, so a season-less render refuses
            (naming_fact_missing_anime_season_folder). It is independent of
            the TMDB binding:
            tmdb.season stays the bound TMDB season used for TMDB episode
            lookups, and editing one never changes the other. Confirming a
            TMDB match in the UI fills it with the matched season only while it
            is unset; nothing is stored until the owner saves.
        title_override:
          type: string
          nullable: true
          minLength: 1
          maxLength: 512
        version:
          $ref: '#/components/schemas/Version'
    ProviderProvenance:
      type: object
      additionalProperties: false
      required: [provider, provider_entry_ref, provider_group_ref, discovery_snapshot_version]
      properties:
        provider:
          $ref: '#/components/schemas/ProviderKind'
        provider_entry_ref:
          type: string
          minLength: 1
          maxLength: 256
        provider_group_ref:
          type: string
          minLength: 1
          maxLength: 256
        discovery_snapshot_version:
          type: string
          minLength: 1
          maxLength: 128
    ProviderGroupSelection:
      type: object
      additionalProperties: false
      required: [id, subscription_id, provider, group_ref, display_name, selection_mode, effective_selected, effective_score, count_in_limit, version, available, availability_generation]
      properties:
        available:
          type: boolean
          readOnly: true
        availability_generation:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        id:
          $ref: '#/components/schemas/ID'
        subscription_id:
          $ref: '#/components/schemas/ID'
        provider:
          $ref: '#/components/schemas/ProviderKind'
        group_ref:
          type: string
          minLength: 1
          maxLength: 256
        display_name:
          type: string
          minLength: 1
          maxLength: 256
        selection_mode:
          $ref: '#/components/schemas/SelectionMode'
        manual_selected:
          type: boolean
          nullable: true
        effective_selected:
          type: boolean
        effective_score:
          type: integer
        count_in_limit:
          type: boolean
        reason_code:
          type: string
          nullable: true
          description: >-
            Why this group is in its selection state, produced by the same
            group-selection decision as effective_selected, so a client
            explains the outcome instead of inferring it. Selected groups
            carry policy_always or ranked_within_max_rss; unselected groups
            carry policy_never (a per-anime manual exclusion),
            site_blacklisted, site_not_whitelisted, policy_score_negative or
            max_rss_exhausted; provider_group_not_observed means the provider
            no longer lists the group. On the owner read this is the live
            verdict even when the stored effective_selected has drifted from
            it (a site policy change the next recompute has not applied yet);
            a row the live decision does not cover carries the stored
            section's replayed reason. Null only when no decision covers the
            row.
        score_breakdown:
          allOf:
            - $ref: '#/components/schemas/SubgroupScoreBreakdown'
          nullable: true
          description: >-
            How the live decision scored the group. Null when the reason is
            a stored-section replay or there is no decision.
        version:
          $ref: '#/components/schemas/Version'
    CatalogSuppression:
      type: object
      additionalProperties: false
      required: [id, provider, provider_entry_ref, title_snapshot, suppressed_at, version]
      properties:
        id:
          $ref: '#/components/schemas/ID'
        provider:
          $ref: '#/components/schemas/ProviderKind'
        provider_entry_ref:
          type: string
          minLength: 1
          maxLength: 256
        title_snapshot:
          type: string
          minLength: 1
          maxLength: 512
        suppressed_at:
          type: string
          format: date-time
        version:
          $ref: '#/components/schemas/Version'
    CatalogSuppressionInput:
      type: object
      additionalProperties: false
      required: [title_snapshot]
      properties:
        title_snapshot:
          type: string
          minLength: 1
          maxLength: 512
          description: >-
            Title as displayed when the entry was suppressed. Kept so the
            suppression list stays readable after the entry leaves the
            provider catalog.
    RSSSourceDraft:
      type: object
      additionalProperties: false
      required: [source_kind, locator, group_name, title, episode_offset]
      properties:
        source_kind:
          $ref: '#/components/schemas/SourceKind'
        locator:
          type: string
          minLength: 1
          maxLength: 4096
          x-secret: true
          description: >-
            Opaque provider-built or user-supplied external locator; preserve as
            entered. Secret (x-secret): a bearer without the secrets scope reads
            the fixed placeholder "[secret]" instead; sending the placeholder
            back in a candidate patch keeps the stored value of the same source. It is an RSS source attribute, not ManagedAnime owner
            identity, and equal locators may belong to separately-created owners.
        locator_display:
          type: string
          nullable: true
          minLength: 1
          maxLength: 4096
          description: >-
            Credential-free external locator display; non-unique source
            metadata, never formal ManagedAnime owner identity.
        group_name:
          type: string
          minLength: 1
          maxLength: 256
        title:
          type: string
          minLength: 1
          maxLength: 512
        episode_offset:
          type: integer
          minimum: -1000
          maximum: 1000
          description: The episode offset of this RSS link; 0 means no offset.
        anibt_aux_mode:
          type: string
          nullable: true
          enum: [disabled, fill_missing, override]
          description: >-
            Per-source AniBT auxiliary merge mode (only meaningful for AniBT
            provider sources). NULL means the source never requested AniBT
            auxiliary facts; disabled/fill_missing/override select whether
            valid AniBT provider attributes ignore, fill missing parser
            values, or override parser values.
        provider_provenance:
          allOf:
            - $ref: '#/components/schemas/ProviderProvenance'
          nullable: true
        http_feed_connection_ref:
          type: string
          nullable: true
          minLength: 1
          maxLength: 256
          description: Explicit HTTP feed connection reference for custom RSS sources.
        network_route_ref:
          type: string
          nullable: true
          minLength: 1
          maxLength: 256
          description: Explicit network route reference for custom RSS sources.
    RSSSource:
      type: object
      additionalProperties: false
      description: Safe ordinary read model; the protected raw locator is never exposed.
      required: [id, subscription_id, source_kind, locator_display, group_name, title, episode_offset, version]
      properties:
        id:
          $ref: '#/components/schemas/ID'
        subscription_id:
          $ref: '#/components/schemas/ID'
        source_kind:
          $ref: '#/components/schemas/SourceKind'
        locator_display:
          type: string
          minLength: 1
          maxLength: 4096
          description: >-
            Redacted credential-free external locator display; non-unique source
            metadata, never formal ManagedAnime owner identity.
        group_name:
          type: string
          minLength: 1
          maxLength: 256
        title:
          type: string
          minLength: 1
          maxLength: 512
        episode_offset:
          type: integer
          minimum: -1000
          maximum: 1000
          description: The episode offset of this RSS link; 0 means no offset.
        anibt_aux_mode:
          type: string
          nullable: true
          enum: [disabled, fill_missing, override]
          description: >-
            Per-source AniBT auxiliary merge mode (only meaningful for AniBT
            provider sources). NULL means the source never requested AniBT
            auxiliary facts; disabled/fill_missing/override select whether
            valid AniBT provider attributes ignore, fill missing parser
            values, or override parser values.
        provider_provenance:
          allOf:
            - $ref: '#/components/schemas/ProviderProvenance'
          nullable: true
        http_feed_connection_ref:
          type: string
          nullable: true
          minLength: 1
          maxLength: 256
          description: Explicit HTTP feed connection reference for custom RSS sources.
        network_route_ref:
          type: string
          nullable: true
          minLength: 1
          maxLength: 256
          description: Explicit network route reference for custom RSS sources.
        version:
          $ref: '#/components/schemas/Version'
    RSSSourceRuntime:
      type: object
      additionalProperties: false
      required: [rss_source_id, health, version]
      properties:
        rss_source_id:
          $ref: '#/components/schemas/ID'
        cursor:
          $ref: '#/components/schemas/RSSCursor'
          x-mcp-omit: true
          description: >-
            Feed cursor (the newest item identity: guid, enclosure or link URL,
            or content hash). Withheld from MCP tool results (x-mcp-omit): a URL
            can embed a passkey.
        last_good_facts:
          $ref: '#/components/schemas/RSSLastGoodFacts'
        last_refresh_at:
          type: string
          format: date-time
        last_success_at:
          type: string
          format: date-time
        health:
          type: string
          enum: [unknown, ready, degraded, failed]
        reason_code:
          type: string
        reason_detail:
          type: string
        version:
          $ref: '#/components/schemas/Version'
        failed_work_item_id:
          description: Opaque handle of the terminal failed work item accepted by this owner's manual-retry endpoint; absent when the owner has no failed work item.
          $ref: '#/components/schemas/ID'
    RSSCursor:
      type: object
      additionalProperties: false
      required: [strategy, value]
      properties:
        strategy:
          type: string
          enum: [guid, enclosure, link, content_hash]
        value:
          type: string
          minLength: 1
          x-secret: true
          description: >-
            Cursor value (guid, enclosure or link URL, or content hash). Secret
            (x-secret): a URL can embed a passkey.
    RSSLastGoodFacts:
      type: object
      additionalProperties: false
      required: [item_count, newest_stable_item_key]
      properties:
        item_count:
          type: integer
          minimum: 0
        newest_stable_item_key:
          type: string
          minLength: 1
          x-mcp-omit: true
          x-secret: true
          description: >-
            Identity key of the newest feed item (guid, else enclosure or link
            URL, else content hash). Withheld from MCP tool results
            (x-mcp-omit): a URL fallback can embed a passkey.
        feed_title:
          type: string
    ReleaseVerdict:
      type: string
      enum:
        - discovered
        - waiting_metadata
        - subscription_stopped
        - source_unavailable
        - parse_failed
        - accepted_pending_download
        - filtered
        - adopted_existing
        - acquisition_failed
        - submitted
        - resume_baseline
        - start_baseline
      description: >-
        resume_baseline: present in the feed when a stopped subscription
        resumed; never evaluated or retried. start_baseline: the subscription
        has new_releases_only and the Release was published before the
        instance was created (or has no publish time); automatic paths never
        evaluate it and a rule change does not re-evaluate it, but an explicit
        retryRelease evaluates it through every rule. Both are quiet terminal
        verdicts: no failure or discovery notice.
    RawReleaseFacts:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        published_at:
          type: string
          format: date-time
        enclosure_type:
          type: string
        enclosure_length:
          type: integer
          format: int64
          minimum: 0
    SourceFacts:
      type: object
      additionalProperties: false
      required: [identity_kind, identity_value]
      properties:
        identity_kind:
          type: string
          enum: [guid, enclosure, link, content_hash]
        identity_value:
          type: string
          minLength: 1
          x-mcp-omit: true
          x-secret: true
          description: >-
            Value of the RSS item identity (guid, enclosure or link URL, or
            content hash). Withheld from MCP tool results (x-mcp-omit): a URL
            can embed a passkey.
        group_name:
          type: string
        anibt:
          $ref: '#/components/schemas/AniBTTagFacts'
        title_tags:
          $ref: '#/components/schemas/TitleTagFacts'
    ParsedReleaseFacts:
      type: object
      additionalProperties: false
      properties:
        episode:
          type: number
          minimum: 0
          description: >-
            The single episode the release places. Absent for a batch (see
            coverage) and when no file carries an episode of its own.
        coverage:
          $ref: '#/components/schemas/ReleaseCoverage'
        group_name:
          type: string
        quality:
          type: string
        languages:
          type: array
          items:
            type: string
        special:
          type: boolean
          default: false
          description: |
            Marks a special/extracurricular release (NCOP/NCED/Special) excluded
            from the regular episode progress aggregation. Defaults to false
            when absent so legacy rows aggregate normally.
    ReleaseCoverage:
      type: object
      additionalProperties: false
      required: [season, episodes]
      description: >-
        The episodes a batch release places (two or more), from its accepted
        batch plan. Display only: coverage keys stay the authority.
      properties:
        season:
          type: integer
          minimum: 0
        episodes:
          type: array
          minItems: 2
          items:
            type: integer
            minimum: 0
    MediaRecognitionPreviewInput:
      type: object
      additionalProperties: false
      required: [items, context, parser]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 256
          items:
            $ref: '#/components/schemas/MediaRecognitionItemInput'
        context:
          $ref: '#/components/schemas/MediaRecognitionContext'
        parser:
          $ref: '#/components/schemas/ParserSelection'
    MediaRecognitionItemInput:
