      description: >-
        Dumps the database with the schema-owner connection, verifies the
        archive, and streams one backup file as a download named
        bansoko-<UTC yyyymmddThhmmssZ>-schema<N>.bansoko-backup. The file is the
        line "BANSOKO-BACKUP/1", one JSON header line (app, format,
        schema_version, created_at, payload_bytes, payload_sha256), then the
        pg_dump custom-format archive. Nothing is kept on the server. The file
        holds every stored row, including encrypted secrets, but never
