        metadata_hold:
          $ref: '#/components/schemas/MetadataHold'
        subgroups:
          $ref: '#/components/schemas/SubgroupsOwnerResult'
        rules:
          $ref: '#/components/schemas/AnimeRules'
        rss_sources:
          type: array
          items:
            $ref: '#/components/schemas/RSSSource'
        rss_source_runtimes:
          type: array
          items:
            $ref: '#/components/schemas/RSSSourceRuntime'
        releases:
          type: array
